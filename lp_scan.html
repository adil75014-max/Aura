<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrôle laissez-passer — Aura</title>
<script src="vendor/supabase.js"></script>
<script src="vendor/html5-qrcode.min.js"></script>
<style>
  :root{ --bg:#080b14; --ink:#e8ebf0; --muted:#94a3b8; --line:#232c40; --cyan:#22d3ee; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;}
  header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);}
  header h1{font-size:1.05rem;margin:0;font-weight:800;flex:1;}
  header a{color:var(--muted);text-decoration:none;font-size:.82rem;}
  .wrap{max-width:560px;margin:0 auto;padding:16px;}
  #reader{width:100%;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#000;}
  .manual{margin-top:14px;display:flex;gap:8px;}
  .manual input{flex:1;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#0e1626;color:var(--ink);font-size:.9rem;}
  .manual button{padding:11px 16px;border:none;border-radius:10px;background:var(--cyan);color:#06222b;font-weight:700;cursor:pointer;}
  .hint{font-size:.78rem;color:var(--muted);text-align:center;margin-top:10px;}
  .sens-switch{display:flex;gap:8px;margin-bottom:14px;}
  .sens-btn{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0e1626;color:var(--ink);font-size:.85rem;font-weight:600;cursor:pointer;}
  .sens-btn.active{background:var(--cyan);color:#06222b;border-color:var(--cyan);}

  /* Écran résultat plein écran */
  #result{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:999;}
  #result.show{display:flex;}
  #result.ok{background:linear-gradient(160deg,#15803d,#052e16);}
  #result.no{background:linear-gradient(160deg,#b91c1c,#450a0a);}
  #result .icon{font-size:6rem;line-height:1;margin-bottom:10px;}
  #result .verdict{font-size:2.4rem;font-weight:900;letter-spacing:.04em;margin-bottom:6px;}
  #result .reason{font-size:1.1rem;opacity:.95;margin-bottom:22px;}
  #result .details{background:rgba(0,0,0,.25);border-radius:14px;padding:16px 20px;text-align:left;max-width:420px;width:100%;font-size:.92rem;line-height:1.6;}
  #result .details .k{opacity:.75;font-size:.78rem;}
  #result .acc{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  #result .acc span{font-size:.74rem;background:rgba(255,255,255,.18);border-radius:7px;padding:2px 9px;}
  #result .acc-alert{display:none;background:#dc2626;color:#fff;border:2px solid #fff;border-radius:14px;padding:14px 18px;max-width:420px;width:100%;margin-bottom:16px;text-align:left;animation:accpulse 1.1s ease-in-out infinite;}
  #result .acc-alert.show{display:block;}
  #result .acc-alert h3{margin:0 0 7px;font-size:1.15rem;font-weight:900;letter-spacing:.03em;}
  #result .acc-alert ul{margin:0;padding-left:20px;font-size:.95rem;line-height:1.55;}
  #result .acc-alert .sub{opacity:.9;font-size:.82rem;}
  @keyframes accpulse{0%,100%{box-shadow:0 0 0 3px rgba(220,38,38,.45);}50%{box-shadow:0 0 0 9px rgba(220,38,38,.12);}}
  #result button{margin-top:26px;padding:15px 40px;border:none;border-radius:12px;background:#fff;color:#111;font-size:1.1rem;font-weight:800;cursor:pointer;}
</style>
</head>
<body>
<header>
  <span style="font-size:1.3rem;">🔎</span>
  <h1>Contrôle d'accès — laissez-passer</h1>
  <a href="index.html">← Accueil</a>
</header>

<div class="wrap">
  <div class="sens-switch">
    <button class="sens-btn active" data-s="auto" onclick="setSens('auto')">🔄 Auto</button>
    <button class="sens-btn" data-s="arrivee" onclick="setSens('arrivee')">➡️ Arrivée</button>
    <button class="sens-btn" data-s="depart" onclick="setSens('depart')">⬅️ Départ</button>
  </div>
  <div id="reader"></div>
  <div class="manual">
    <input id="token-manual" placeholder="Ou saisir le code manuellement">
    <button onclick="checkToken(document.getElementById('token-manual').value.trim())">Vérifier</button>
  </div>
  <div class="hint">Scannez le QR à l'<strong>arrivée</strong> puis au <strong>départ</strong> pour l'horodatage.<br>Mode « Auto » : 1ᵉʳ scan = arrivée, 2ᵉ = départ. L'écran passe au vert ou au rouge.</div>
</div>

<!-- Écran résultat -->
<div id="result">
  <div class="icon" id="r-icon"></div>
  <div class="verdict" id="r-verdict"></div>
  <div class="reason" id="r-reason"></div>
  <div class="acc-alert" id="r-acc-alert"></div>
  <div class="details" id="r-details"></div>
  <button onclick="resetScan()">Scanner suivant</button>
</div>

<script src="supabaseClient.js"></script>
<script>
/* ── Garde : scan réservé au service Sûreté (ou admin/superviseur) ──
   L'agent doit être connecté à Aura. Son identité (id) est envoyée à la
   RPC lp_scan qui revérifie côté serveur. */
const _role = (localStorage.getItem("role") || "").toLowerCase();
const _service = (localStorage.getItem("service") || "").toLowerCase();
const _agentNom = localStorage.getItem("nom") || null;
const _scanAllowed = (_service === "surete") || ["admin","superadmin","superviseur"].includes(_role);

(function(){
  if(!_scanAllowed){
    document.body.innerHTML = '<div style="max-width:480px;margin:80px auto;text-align:center;font-family:system-ui;color:#e8ebf0;">'
      + '<div style="font-size:3rem;">🔒</div>'
      + '<h2>Scan réservé au service Sûreté</h2>'
      + '<p style="color:#94a3b8;">Le contrôle des laissez-passer est réservé aux agents de sûreté connectés à Aura.</p>'
      + '<a href="index.html" style="color:#22d3ee;">← Retour</a></div>';
    throw new Error("LP scan : accès refusé");
  }
})();

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(iso){ try{ return new Date(iso).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}); }catch(_){ return iso||"—"; } }

let _scanner = null;
let _busy = false;
let _sens = "auto"; // auto | arrivee | depart

function setSens(s){
  _sens = s;
  document.querySelectorAll(".sens-btn").forEach(b=>b.classList.toggle("active", b.dataset.s===s));
}

// Extrait le token d'un contenu scanné : soit une URL ...?t=XXX, soit le token brut
function extractToken(text){
  if(!text) return "";
  try{
    const u = new URL(text);
    const t = u.searchParams.get("t");
    if(t) return t;
  }catch(_){ /* pas une URL */ }
  return text.trim();
}

async function checkToken(raw){
  const token = extractToken(raw);
  if(!token){ showToast("Code vide", true); return; }
  if(_busy) return;
  _busy = true;

  try{
    const { data, error } = await supabaseClient.rpc("lp_scan", { p_token: token, p_agent_nom: _agentNom, p_sens: _sens });
    if(error){ showResult(false, "ERREUR", error.message, null); _busy=false; return; }
    if(!data || !data.ok){ showResult(false, "REFUSÉ", (data&&data.message)||"Laissez-passer inconnu", null); _busy=false; return; }

    // Détails accompagnement (non renvoyés par la RPC) → select complémentaire
    let acc = null;
    try{
      const { data: ex } = await supabaseClient.from("laissez_passer")
        .select("besoin_agent_surete,surete_details,besoin_pompier,pompier_details,besoin_technicien,technicien_details")
        .eq("qr_token", token).maybeSingle();
      acc = ex || null;
    }catch(_){}
    const lpMerged = Object.assign({}, data.lp||{}, acc||{});

    const verdict = data.autorise ? "ACCÈS AUTORISÉ" : "ACCÈS REFUSÉ";
    const reason = data.autorise && data.horodatage ? (data.message + " · " + data.horodatage) : data.message;
    showResult(data.autorise, verdict, reason, lpMerged, data);
  }catch(e){
    showResult(false, "ERREUR", e.message, null);
  }
  _busy = false;
}

function showResult(ok, verdict, reason, lp, full){
  const r = document.getElementById("result");
  document.getElementById("r-icon").textContent = ok ? "✅" : "⛔";
  document.getElementById("r-verdict").textContent = verdict;
  document.getElementById("r-reason").textContent = reason || "";

  // Alerte accompagnement (rouge, bien visible pour l'agent)
  const alertEl = document.getElementById("r-acc-alert");
  const needs = [];
  if(lp){
    if(lp.besoin_agent_surete) needs.push(["👮 Agent de sûreté", lp.surete_details]);
    if(lp.besoin_pompier)      needs.push(["🚒 Pompier", lp.pompier_details]);
    if(lp.besoin_technicien)   needs.push(["🔧 Technicien service technique", lp.technicien_details]);
  }
  if(needs.length){
    alertEl.innerHTML = "<h3>⚠️ ACCOMPAGNEMENT REQUIS</h3><ul>" + needs.map(([lbl,det])=>{
      const d = (Array.isArray(det)&&det.length) ? (' <span class="sub">— '+det.map(esc).join(", ")+'</span>') : "";
      return "<li>"+esc(lbl)+d+"</li>";
    }).join("") + "</ul>";
    alertEl.classList.add("show");
  }else{
    alertEl.classList.remove("show"); alertEl.innerHTML = "";
  }

  let html = "";
  if(lp){
    const accs=[];
    if(lp.porte_segep) accs.push("Porte SEGEP");
    if(lp.quai_38_sevres) accs.push("Quai 38 Sèvres");
    if(lp.ouverture_porte) accs.push("Ouverture Porte");
    if(lp.horlo_jo) accs.push("Horlo/JO");
    html = `
      <div><span class="k">Demandeur</span><br>${esc(lp.nom_demandeur||"—")}</div>
      <div style="margin-top:8px"><span class="k">Société</span><br>${esc(lp.societe||"—")} · ${esc(lp.nb_intervenants||1)} pers.</div>
      ${lp.noms_intervenants?`<div style="margin-top:8px"><span class="k">Intervenant(s)</span><br>${esc(lp.noms_intervenants).replace(/\n/g,", ")}</div>`:""}
      <div style="margin-top:8px"><span class="k">Zone / Nature</span><br>${esc(lp.marque_zone||"—")} — ${esc(lp.nature_travaux||"—")}</div>
      <div style="margin-top:8px"><span class="k">Fenêtre</span><br>${fmt(lp.debut)} → ${fmt(lp.fin)}</div>
      ${(lp.arrivee_le||lp.depart_le)?`<div style="margin-top:8px"><span class="k">Passage</span><br>${lp.arrivee_le?("Arrivée "+fmt(lp.arrivee_le)):""}${lp.depart_le?(" · Départ "+fmt(lp.depart_le)):""}</div>`:""}
      ${accs.length?`<div class="acc">${accs.map(a=>`<span>${a}</span>`).join("")}</div>`:""}
    `;
  }
  document.getElementById("r-details").innerHTML = html;
  document.getElementById("r-details").style.display = html ? "block" : "none";

  r.className = "show " + (ok ? "ok" : "no");
  try{ navigator.vibrate && navigator.vibrate(ok ? 200 : [120,80,120,80,120]); }catch(_){}
}

function resetScan(){
  document.getElementById("result").className = "";
  document.getElementById("token-manual").value = "";
  const a=document.getElementById("r-acc-alert"); if(a){ a.classList.remove("show"); a.innerHTML=""; }
}

// Caméra QR
function onScanSuccess(decodedText){
  if(_busy || document.getElementById("result").classList.contains("show")) return;
  checkToken(decodedText);
}
window.addEventListener("load", ()=>{
  try{
    _scanner = new Html5Qrcode("reader");
    _scanner.start({ facingMode:"environment" }, { fps:10, qrbox:{width:240,height:240} }, onScanSuccess)
      .catch(err=>{ document.getElementById("reader").innerHTML = '<div style="padding:30px;text-align:center;color:#94a3b8;font-size:.85rem;">📷 Caméra indisponible — utilisez la saisie manuelle.<br><span style="opacity:.6">'+esc(err)+'</span></div>'; });
  }catch(e){
    document.getElementById("reader").innerHTML = '<div style="padding:30px;text-align:center;color:#94a3b8;">Lecteur QR indisponible — saisie manuelle.</div>';
  }

  // Token passé directement dans l'URL (?t=) → vérif auto (ex : ouverture du lien email)
  const t = new URLSearchParams(location.search).get("t");
  if(t) checkToken(t);
});
</script>
</body>
</html>
