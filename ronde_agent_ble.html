<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ronde agent – Détection BLE automatique</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { background:#0d0f14; color:#fff; font-family:system-ui; margin:0; padding:20px; }
h1 { text-align:center; color:#4da3ff; margin-bottom:10px; }
h2 { margin-top:0; color:#ffffff; }
.section { background:rgba(255,255,255,0.08); padding:20px; border-radius:12px; margin-bottom:20px; border:1px solid rgba(255,255,255,0.15); }
.info { font-size:0.9rem; color:#b0b0b0; margin-bottom:10px; }
.progress-container { background:rgba(255,255,255,0.12); border-radius:10px; overflow:hidden; height:18px; margin-top:10px; }
.progress-bar { height:100%; width:0%; background:linear-gradient(90deg,#4da3ff,#00d4ff); transition:width 0.3s; }
.points-list { list-style:none; padding:0; margin:0; }
.point-item { padding:12px; border-radius:10px; margin-bottom:8px; background:rgba(255,255,255,0.06); display:flex; flex-direction:column; gap:4px; }
.point-item.current { border:1px solid #4da3ff; box-shadow:0 0 10px rgba(77,163,255,0.4); }
.point-item.done { background:rgba(0,180,80,0.18); border:1px solid rgba(0,200,100,0.6); }
.point-title { font-weight:600; }
.point-status { font-size:0.85rem; color:#b0b0b0; }
.badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:0.75rem; margin-right:6px; }
.badge-current { background:#4da3ff; color:#fff; }
.badge-done { background:#00b86b; color:#fff; }
.badge-pending { background:#555; color:#fff; }
button { margin-top:10px; padding:12px; background:#4da3ff; border:none; border-radius:10px; color:white; font-weight:600; cursor:pointer; width:100%; font-size:1rem; }
button:hover { background:#1d7be6; }
.log { font-size:0.8rem; max-height:140px; overflow-y:auto; background:rgba(0,0,0,0.35); padding:10px; border-radius:8px; margin-top:10px; }
.log-line { margin-bottom:4px; color:#c0c0c0; }
.log-line strong { color:#4da3ff; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<h1>Ronde en cours – Agent</h1>

<div class="section" id="rondeInfo">
    <h2 id="rondeNom">Ronde</h2>
    <div class="info" id="rondeDesc">Description de la ronde…</div>
    <div>
        <span>Progression :</span>
        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
        <div class="info"><span id="progressText">0 / 0 points validés</span></div>
    </div>
    <button id="btnStartScan" onclick="demarrerScan()">Démarrer la ronde (scan BLE)</button>
</div>

<div class="section">
    <h2>Points de passage</h2>
    <ul class="points-list" id="pointsList"></ul>
</div>

<div class="section">
    <h2>Journal</h2>
    <div class="log" id="log"></div>
</div>

<div class="section">
    <h2>Ajouter un commentaire / photos / vidéos</h2>
    <textarea id="commentaire" placeholder="Commentaire..." style="width:100%;height:80px;border-radius:10px;padding:10px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;"></textarea>
    <label style="margin-top:10px;display:block;">📸 Photos</label>
    <input type="file" id="photos" accept="image/*" capture="camera" multiple style="margin-bottom:10px;">
    <label style="margin-top:10px;display:block;">🎥 Vidéos</label>
    <input type="file" id="videos" accept="video/*" capture="camcorder" multiple>
    <button onclick="ajouterMedia()">Ajouter au journal</button>
</div>

<div class="section">
    <button onclick="ouvrirRapportFinal()">Voir le rapport final</button>
</div>

<div id="rapportModal" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);display:none;justify-content:center;align-items:center;padding:20px;z-index:9999;">
    <div style="background:#1a1d25;border-radius:12px;padding:20px;width:100%;max-width:600px;max-height:90%;overflow-y:auto;">
        <h2 style="color:#4da3ff;">Rapport final de la ronde</h2>
        <div id="rapportContent"></div>
        <button onclick="exportPDF()">Exporter en PDF</button>
        <button onclick="fermerRapport()" style="margin-top:10px;background:#555;">Fermer</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabaseClient.js"></script>
<script>
const RSSI_THRESHOLD = -75;
let rondeCourante = null;
let rondeDbId = null;
let indexPointCourant = 0;
let scanActif = false;
let bleScan = null;

const rondeExemple = {
    nom:"Ronde exemple – Bâtiment A",
    description:"Ronde de démonstration avec 3 points BLE.",
    type:"ronde_ouverture",
    points:[
        {nom:"Entrée principale",beaconId:"BEACON-ENTREE-001",valide:false,horodatage:null},
        {nom:"Local TGBT",beaconId:"BEACON-TGBT-002",valide:false,horodatage:null},
        {nom:"Parking -1 Nord",beaconId:"BEACON-PARK-003",valide:false,horodatage:null}
    ]
};

async function chargerRonde() {
    // Essayer de charger depuis Supabase les rondes non terminées
    const { data, error } = await supabaseClient
        .from("rondes")
        .select("*")
        .eq("statut","en_cours")
        .order("created_at",{ascending:false})
        .limit(1);

    if (data && data.length > 0) {
        const r = data[0];
        rondeDbId = r.id;
        rondeCourante = {
            nom: r.type || "Ronde",
            description: r.observations || "",
            type: r.type,
            points: (r.meta && r.meta.points) ? r.meta.points : rondeExemple.points
        };
        log("Ronde chargée depuis Supabase.");
    } else {
        rondeCourante = rondeExemple;
        log("Aucune ronde en cours. Utilisation d'une ronde d'exemple.");
    }

    document.getElementById("rondeNom").innerText = rondeCourante.nom;
    document.getElementById("rondeDesc").innerText = rondeCourante.description;
    indexPointCourant = trouverPremierPointNonValide();
    afficherPoints();
    majProgression();
}

function trouverPremierPointNonValide() {
    for (let i=0;i<rondeCourante.points.length;i++) { if (!rondeCourante.points[i].valide) return i; }
    return rondeCourante.points.length;
}

function afficherPoints() {
    const ul = document.getElementById("pointsList");
    ul.innerHTML = "";
    rondeCourante.points.forEach((p,i) => {
        const li = document.createElement("li");
        li.className = "point-item";
        if (p.valide) li.classList.add("done");
        else if (i===indexPointCourant) li.classList.add("current");

        const titre = document.createElement("div"); titre.className="point-title";
        const badge = document.createElement("span"); badge.className="badge";
        if (p.valide) { badge.classList.add("badge-done"); badge.textContent="Validé"; }
        else if (i===indexPointCourant) { badge.classList.add("badge-current"); badge.textContent="En cours"; }
        else { badge.classList.add("badge-pending"); badge.textContent="À venir"; }
        titre.appendChild(badge);
        titre.appendChild(document.createTextNode(" "+p.nom));

        const status = document.createElement("div"); status.className="point-status";
        if (p.valide && p.horodatage) status.textContent="Validé le "+p.horodatage;
        else if (p.beaconId) status.textContent="Balise : "+p.beaconId;

        li.appendChild(titre); li.appendChild(status); ul.appendChild(li);
    });
}

function majProgression() {
    const total=rondeCourante.points.length;
    const valides=rondeCourante.points.filter(p=>p.valide).length;
    const pct=total===0?0:Math.round((valides/total)*100);
    document.getElementById("progressBar").style.width=pct+"%";
    document.getElementById("progressText").innerText=valides+" / "+total+" points validés";
}

function log(msg) {
    const logDiv=document.getElementById("log");
    const line=document.createElement("div"); line.className="log-line";
    line.innerHTML=`<strong>[${new Date().toLocaleTimeString()}]</strong> ${msg}`;
    logDiv.prepend(line);
}

async function ajouterMedia() {
    const commentaire=document.getElementById("commentaire").value.trim();
    if (commentaire) log(`<strong>Commentaire :</strong> ${commentaire}`);
    const point=rondeCourante.points[indexPointCourant]||rondeCourante.points[rondeCourante.points.length-1];
    if (!point.media) point.media=[];
    point.media.push({commentaire, date:new Date().toLocaleString()});
    await sauvegarderRonde();
    document.getElementById("commentaire").value="";
    document.getElementById("photos").value="";
    document.getElementById("videos").value="";
}

async function demarrerScan() {
    if (!navigator.bluetooth||!navigator.bluetooth.requestLEScan) { alert("Scan BLE non supporté."); return; }
    if (!rondeCourante||!rondeCourante.points.length) { alert("Aucune ronde chargée."); return; }
    if (scanActif) { arreterScan(); return; }
    try {
        bleScan=await navigator.bluetooth.requestLEScan({acceptAllAdvertisements:true});
        scanActif=true;
        document.getElementById("btnStartScan").innerText="Arrêter le scan BLE";
        log("Scan BLE démarré.");
        navigator.bluetooth.addEventListener("advertisementreceived", onAdvertisement);
    } catch(e) { log("Erreur BLE: "+e); }
}

function arreterScan() {
    if (bleScan&&bleScan.active) bleScan.stop();
    scanActif=false;
    document.getElementById("btnStartScan").innerText="Démarrer la ronde (scan BLE)";
    log("Scan BLE arrêté.");
}

function onAdvertisement(event) {
    if (!scanActif) return;
    const rssi=event.rssi;
    const id=event.device&&event.device.id?event.device.id:"";
    const name=event.device&&event.device.name?event.device.name:"";
    log(`Signal: ${name} (RSSI: ${rssi} dBm)`);
    if (rssi<RSSI_THRESHOLD) return;
    const point=rondeCourante.points[indexPointCourant];
    if (!point||!point.beaconId) return;
    if (id.includes(point.beaconId)||name.includes(point.beaconId)) validerPointCourant(rssi);
}

async function validerPointCourant(rssi) {
    if (indexPointCourant>=rondeCourante.points.length) return;
    const point=rondeCourante.points[indexPointCourant];
    if (point.valide) return;
    point.valide=true;
    point.horodatage=new Date().toLocaleString();
    log(`Point validé: "${point.nom}" (RSSI: ${rssi} dBm)`);
    await sauvegarderRonde();
    indexPointCourant=trouverPremierPointNonValide();
    afficherPoints(); majProgression();
    if (indexPointCourant>=rondeCourante.points.length) {
        log("Ronde terminée !");
        arreterScan();
        // Marquer comme terminée sur Supabase
        if (rondeDbId) {
            await supabaseClient.from("rondes").update({statut:"terminee",fin_at:new Date().toISOString()}).eq("id",rondeDbId);
        }
        showToast("✅ Ronde terminée et enregistrée !");
    }
}

async function sauvegarderRonde() {
    if (rondeDbId) {
        await supabaseClient.from("rondes").update({
            observations: rondeCourante.description,
            meta: { points: rondeCourante.points }
        }).eq("id", rondeDbId);
    } else {
        // Créer une nouvelle ronde
        const { data, error } = await supabaseClient.from("rondes").insert({
            type: rondeCourante.type || "ronde_ouverture",
            statut: "en_cours",
            observations: rondeCourante.description,
            meta: { points: rondeCourante.points, nom: rondeCourante.nom }
        }).select();
        if (data && data.length > 0) rondeDbId = data[0].id;
    }
}

function ouvrirRapportFinal() {
    let html=`<p><strong>Nom:</strong> ${rondeCourante.nom}</p><p><strong>Description:</strong> ${rondeCourante.description}</p><hr>`;
    rondeCourante.points.forEach((p,i) => {
        html+=`<h3 style="color:#4da3ff;">${i+1}. ${p.nom}</h3>`;
        html+=`<p><strong>Statut:</strong> ${p.valide?"Validé":"Non validé"}</p>`;
        if (p.horodatage) html+=`<p><strong>Horodatage:</strong> ${p.horodatage}</p>`;
        if (p.media&&p.media.length>0) { p.media.forEach(m=>{ if(m.commentaire) html+=`<p><strong>Commentaire:</strong> ${m.commentaire}</p>`; }); }
        html+="<hr>";
    });
    document.getElementById("rapportContent").innerHTML=html;
    document.getElementById("rapportModal").style.display="flex";
}

function fermerRapport() { document.getElementById("rapportModal").style.display="none"; }

async function exportPDF() {
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF("p","mm","a4");
    const canvas=await html2canvas(document.getElementById("rapportContent"),{scale:2});
    const imgData=canvas.toDataURL("image/png");
    const imgW=190, imgH=canvas.height*imgW/canvas.width;
    pdf.addImage(imgData,"PNG",10,10,imgW,imgH);
    pdf.save(`Ronde_${Date.now()}.pdf`);
}

chargerRonde();
</script>
<script src="security.js"></script>
</body>
</html>
