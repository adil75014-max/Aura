<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <title>Permanence - LBM Sécurité</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 🎨 Design global -->
    <link rel="stylesheet" href="global.css">

<style>
/* 🎨 Styles spécifiques à cette page */

h1 {
    text-align: center;
    margin-bottom: 25px;
    color: var(--accent);
    font-size: 1.7rem;
    letter-spacing: 1px;
    font-weight: 600;
}

/* Bouton menu */
.menu-return {
    display: flex;
    justify-content: flex-start;
    margin-bottom: 20px;
}

.menu-return button {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 10px;
    color: var(--accent);
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 500;
    transition: 0.25s;
}

.menu-return button:hover {
    background: var(--accent);
    color: #000;
}

/* Boutons PDF */
.pdf-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 25px;
}

.pdf-buttons button {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 7px 12px;
    border-radius: 10px;
    color: var(--text);
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 500;
    transition: 0.25s;
}

.pdf-buttons button:hover {
    background: var(--accent);
    color: #000;
}

/* Upload box */
.upload-box {
    background: var(--card);
    padding: 18px;
    border-radius: 14px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    max-width: 600px;
    margin: 0 auto;
}

input[type="file"] {
    margin-top: 10px;
    padding: 8px;
    background: var(--bg2);
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    color: var(--text);
    font-size: 0.85rem;
}

/* PDF viewer */
#pdfContainer {
    margin-top: 25px;
    background: var(--card);
    border-radius: 14px;
    padding: 10px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    animation: fadeIn 0.4s ease;
}

iframe {
    width: 100%;
    height: 78vh;
    border-radius: 12px;
    border: none;
    background: rgba(0,0,0,0.25);
    transform-origin: center center;
    transition: transform 0.25s ease;
}

/* Fullscreen overlay */
#pdfFullscreen {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 9999;
    padding: 20px;
}

#pdfFullscreen iframe {
    width: 100%;
    height: 90vh;
    border-radius: 12px;
    border: none;
    background: rgba(0,0,0,0.25);
}

#pdfFullscreen button {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 10px;
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 500;
    margin-bottom: 15px;
    transition: 0.25s;
}

#pdfFullscreen button:hover {
    background: var(--accent);
    color: #000;
}

/* Animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<!-- 🔐 LOGIN -->


<h1>Permanence</h1>

<!-- Bouton menu -->
<div class="menu-return">
    <button onclick="goMenu()">⟵ Menu</button>
</div>

<!-- Boutons PDF -->
<div class="pdf-buttons">
    <button onclick="fullscreenPDF()">⛶ Plein écran</button>
    <button onclick="deletePDF()">🗑 Supprimer</button>
    <button onclick="zoomIn()">＋ Zoom</button>
    <button onclick="zoomOut()">－ Zoom</button>
</div>

<div class="upload-box">
    <p>Importer un PDF :</p>
    <input type="file" id="pdfInput" accept="application/pdf">
</div>

<div id="pdfContainer">
    <iframe id="pdfViewer" src=""></iframe>
</div>

<!-- Fullscreen overlay -->
<div id="pdfFullscreen">
    <button onclick="closeFullscreen()">⟵ Quitter le plein écran</button>
    <iframe id="pdfFullscreenViewer"></iframe>
</div><script>
/* ============================================================
   VARIABLES
============================================================ */
const input = document.getElementById("pdfInput");
const viewer = document.getElementById("pdfViewer");
const fullViewer = document.getElementById("pdfFullscreenViewer");

let zoomLevel = 1;

/* ============================================================
   CHARGER PDF SAUVEGARDÉ
============================================================ */
const savedPDF = localStorage.getItem("permanencePDF");
if (savedPDF) viewer.src = savedPDF;

/* ============================================================
   UPLOAD PDF
============================================================ */
input.addEventListener("change", function() {
    const file = this.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const pdfURL = e.target.result;
        viewer.src = pdfURL;
        localStorage.setItem("permanencePDF", pdfURL);
    };
    reader.readAsDataURL(file);
});

/* ============================================================
   BOUTON MENU
============================================================ */
function goMenu() {
    window.location.href = "index.html";
}

/* ============================================================
   PLEIN ÉCRAN
============================================================ */
function fullscreenPDF() {
    if (!viewer.src) return;
    fullViewer.src = viewer.src;
    document.getElementById("pdfFullscreen").style.display = "block";
}

function closeFullscreen() {
    fullViewer.src = "";
    document.getElementById("pdfFullscreen").style.display = "none";
}

/* ============================================================
   SUPPRESSION PDF
============================================================ */
function deletePDF() {
    localStorage.removeItem("permanencePDF");
    viewer.src = "";
    alert("PDF supprimé.");
}

/* ============================================================
   ZOOM
============================================================ */
function zoomIn() {
    zoomLevel += 0.1;
    viewer.style.transform = `scale(${zoomLevel})`;
}

function zoomOut() {
    zoomLevel = Math.max(0.3, zoomLevel - 0.1);
    viewer.style.transform = `scale(${zoomLevel})`;
}
</script>

<!-- 🔐 Sécurité -->
<script src="security.js"></script>

<!-- 🎨 Thème global -->
<script src="global.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="supabaseClient.js"></script>
<script src="tenant.js"></script>
<script src="notifications_global.js"></script>
</body>
</html>
