<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Superviseur - LBM Sécurité</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabaseClient.js"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- 🎨 Design global (fallback si global.css absent) -->
    <link rel="stylesheet" href="global.css">

<style>
/* Fallback variables si global.css manquant */
:root {
    --bg: #0a0f1c;
    --bg2: #111827;
    --card: #1a2236;
    --text: #e2e8f0;
    --accent: #4da3ff;
    --border: #2a3a5c;
    --shadow: 0 4px 16px rgba(0,0,0,0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
}

h1 {
    text-align: center;
    color: var(--accent);
    margin-bottom: 30px;
}

/* Loader */
.loader-overlay {
    position: fixed; inset: 0;
    background: rgba(10,15,28,0.9);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
    transition: opacity 0.4s;
}
.loader-overlay.hidden { opacity: 0; pointer-events: none; }
.spinner {
    width: 48px; height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #1e3a5f; color: #fff;
    padding: 14px 22px; border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    transform: translateY(100px); opacity: 0;
    transition: all 0.4s;
    z-index: 1000;
    font-size: 0.95rem;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { background: #5f1e1e; }

/* Indicateurs */
.indicators {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
}
.indicator {
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
}
.indicator h3 { margin: 0; font-size: 1.1rem; color: var(--accent); }
.indicator p { margin: 8px 0 0; font-size: 1.6rem; font-weight: 700; }

/* Bouton refresh */
.btn-refresh {
    display: block;
    margin: 0 auto 25px;
    padding: 10px 28px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: 0.2s;
}
.btn-refresh:hover { background: var(--accent); color: #000; }
.btn-refresh:disabled { opacity: 0.4; cursor: not-allowed; }

/* Filtres */
.filters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
}
select, input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
    font-size: 1rem;
}
select option { background: var(--card); color: var(--text); }

/* Tableau */
.table-wrap { overflow-x: auto; }
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 25px;
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
    min-width: 700px;
}
th, td { padding: 14px; border-bottom: 1px solid var(--border); text-align: left; }
th { background: var(--bg2); color: var(--accent); white-space: nowrap; }
tr:hover { background: rgba(255,255,255,0.05); }

/* Badges statut */
.badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
}
.badge-urgente { background: #dc2626; color: #fff; }
.badge-haute { background: #f59e0b; color: #000; }
.badge-normale { background: #3b82f6; color: #fff; }
.badge-basse { background: #6b7280; color: #fff; }
.badge-ouvert { background: #22c55e; color: #000; }
.badge-en_cours { background: #f59e0b; color: #000; }
.badge-cloture { background: #6b7280; color: #fff; }

/* Liens */
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Boutons */
.btn-excel {
    margin-top: 20px;
    padding: 14px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #000;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    font-size: 1.1rem;
}
.btn-mail {
    margin-top: 15px;
    padding: 14px;
    background: linear-gradient(135deg, #7ab8ff, #4d9dff);
    border: none;
    border-radius: 10px;
    color: #0a0f1c;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    font-size: 1.1rem;
    box-shadow: 0 4px 12px rgba(122,184,255,0.4);
    transition: 0.25s ease;
}
.btn-mail:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(122,184,255,0.6); }

/* État vide */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #6b7280;
    font-size: 1.1rem;
}

/* Bouton Ouvrir */
.btn-view {
    background: rgba(77,163,255,0.15);
    border: 1px solid rgba(77,163,255,0.4);
    color: #4da3ff;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: 0.2s;
}
.btn-view:hover { background: #4da3ff; color: #000; }

/* Modale rapport */
.modal-overlay {
    display: none;
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    z-index: 9999;
    justify-content: center; align-items: center;
    padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal-box {
    background: #1a1f2e;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 25px;
    max-width: 720px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    color: white;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}
.modal-box h2 { color: #4da3ff; margin-bottom: 18px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px; }
.modal-box h3 { color:#7ab8ff; margin:18px 0 8px; font-size:1rem; }
.modal-box .field { margin-bottom: 10px; }
.modal-box .field-label { color: #7ab8ff; font-weight: 600; font-size: 0.85rem; display:block; margin-bottom:2px; }
.modal-box .field-value { color: white; white-space: pre-wrap; word-break: break-word; line-height:1.5; }
.modal-actions { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
.modal-close, .modal-print {
    padding: 8px 16px; border-radius: 8px; cursor: pointer; border:1px solid; font-weight:600;
}
.modal-close { background: rgba(239,68,68,0.2); border-color:#ef4444; color: #ef4444; }
.modal-close:hover { background: #ef4444; color: white; }
.modal-print { background: rgba(122,184,255,0.2); border-color:#7ab8ff; color: #7ab8ff; }
.modal-print:hover { background: #7ab8ff; color: #000; }
</style>
</head>

<body>

<!-- LOADER -->
<div class="loader-overlay" id="loader">
    <div class="spinner"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<h1>Dashboard Superviseur</h1>

<!-- REFRESH -->
<button class="btn-refresh" id="btnRefresh" onclick="loadAllData()">🔄 Rafraîchir les données</button>

<!-- INDICATEURS -->
<div class="indicators">
    <div class="indicator">

    </div>
    <div class="indicator">
        <h3>Ce mois</h3>

    </div>
    <div class="indicator">
        <h3>Urgents / Critiques</h3>
        <p id="indCritique">—</p>
    </div>
    <div class="indicator">
        <h3>Rondes</h3>
        <p id="indRondes">—</p>
    </div>
    <div class="indicator">
        <h3>Vérifications</h3>
        <p id="indVerifs">—</p>
    </div>
</div>

<!-- FILTRES -->
<div class="filters">
    <select id="source" onchange="applyFilters()">
        <option value="all">Toutes les sources</option>
        <option value="rapports">Rapports</option>
        <option value="rondes">Rondes</option>
        <option value="verifications">Vérifications</option>
    </select>

    <select id="periode" onchange="toggleCustomDates(); applyFilters()">

        <option value="today">Aujourd'hui</option>
        <option value="week">Cette semaine</option>
        <option value="month">Ce mois</option>
        <option value="year">Cette année</option>
        <option value="custom">Personnalisé</option>
    </select>

    <input type="date" id="dateStart" style="display:none;" onchange="applyFilters()">

    <select id="theme" onchange="applyFilters()">
        <option value="all">Tous les types</option>

            <option value="incendie">Détection incendie</option>

        <optgroup label="🔄 Rondes">

            <option value="rondepermisfeu">Ronde Permis feu</option>
            <option value="rondeissuessecours">Ronde Issue de secours</option>
            <option value="rondesurfacevente">Ronde Surface de vente</option>

        <optgroup label="🔍 Vérifications">
            <option value="verifj1baie_ssi">J1 Baie SSI</option>
            <option value="verifj2materiel_pc">J2 Matériel PC</option>
            <option value="verifj3materiel_secours">J3 Matériel de secours</option>
            <option value="verifj4epi">J4 EPI</option>
            <option value="verifj5interphonieascmc">J5 Interphonie ASC/MC</option>
            <option value="verifextincteursria_baes">Extincteur / RIA / BAES</option>
            <option value="verif_sprinkler">Sprinkler</option>
            <option value="verif_surpresseur">Surpresseur</option>
            <option value="verifcolonneseche">Colonne sèche</option>
            <option value="verifdesenfumagenaturel">Désenfumage naturel</option>
            <option value="verifbaieaccessible">Baie accessible</option>

    <select id="tri" onchange="applyFilters()">
        <option value="recent">Plus récent → plus ancien</option>

    </select>
</div>

<!-- TABLEAU -->
<div class="table-wrap">
<table id="tableRapports">
    <thead>
        <tr>
            <th>Date</th>

<div class="empty-state" id="emptyState" style="display:none;">
    Aucune donnée ne correspond aux filtres sélectionnés.
</div>

<!-- BOUTONS -->
<button class="btn-excel" onclick="exportCSV()">📤 Exporter la sélection en CSV</button>
<button class="btn-mail" onclick="envoyerRapportsPDF('jour')">📧 Envoyer PDF 8h → 20h</button>
<button class="btn-mail" onclick="envoyerRapportsPDF('nuit')">🌙 Envoyer PDF 20h → 8h</button>

<script>
/* ==========================================================
   SUPABASE CONFIG
   ========================================================== */
// Config from supabaseClient.js


// supabaseClient loaded from supabaseClient.js

/* ==========================================================
   STATE
   ========================================================== */
let allData = [];       // unified rows
let filteredData = [];  // after filters
let profilesMap = {};   // id → { nom, prenom }

/* ==========================================================
   TOAST
   ========================================================== */
function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => t.className = 'toast', 3500);
}

/* ==========================================================
   LOADER
   ========================================================== */
function setLoading(on) {
    document.getElementById('loader').classList.toggle('hidden', !on);
    document.getElementById('btnRefresh').disabled = on;
}

/* ==========================================================
   LOAD ALL DATA FROM SUPABASE
   ========================================================== */
async function loadAllData() {
    setLoading(true);
    try {
        // 1) Load profiles for name resolution
        const { data: profiles, error: pErr } = await supabaseClient
            .from("profiles")
            .select('id, nom, prenom');

        if (pErr) throw pErr;

        profilesMap = {};
        (profiles || []).forEach(p => {
            profilesMap[p.id] = { nom: p.nom || '', prenom: p.prenom || '' };
        });

        // Also load from legacy "users" table for fallback
        const { data: users } = await supabaseClient
            .from("users")
            .select('id, nom');
        (users || []).forEach(u => {
            if (!profilesMap[u.id]) {
                profilesMap[u.id] = { nom: u.nom || '', prenom: '' };
            }
        });

        // 2) Load rapports
        const { data: rapports, error: rErr } = await supabaseClient
            .from("rapports")
            .select('*')
            .order('created_at', { ascending: false });

        if (rErr) throw rErr;

        // 3) Load rondes
        const { data: rondes, error: roErr } = await supabaseClient
            .from("rondes")
            .select('*')
            .order('created_at', { ascending: false });

        if (roErr) throw roErr;

        // 4) Load verifications
        const { data: verifs, error: vErr } = await supabaseClient
            .from("verifications")
            .select('*')
            .order('created_at', { ascending: false });

        if (vErr) throw vErr;

        // 5) Unify into a single array
        allData = [];

        (rapports || []).forEach(r => {
            const dt = new Date(r.created_at);
            const agent = resolveAgent(r.auteur_id, r.meta);
            allData.push({
                source: 'rapports',
                date: dt.toISOString().split('T')[0],
                heure: dt.toTimeString().slice(0, 5),
                datetime: dt,
                type: r.type || '—',
                agent: agent,
                lieu: r.localisation || '—',
                resume: r.titre || r.description || '—',
                statut: r.statut || '—',
                priorite: r.priorite || 'normale',
                id: r.id,
                description: r.description || '',
                meta: r.meta || {},
                raw: r
            });
        });

        (rondes || []).forEach(r => {
            const dt = new Date(r.debut_at || r.created_at);
            const agent = resolveAgent(r.agent_id, r.meta);
            allData.push({
                source: 'rondes',
                date: dt.toISOString().split('T')[0],
                heure: dt.toTimeString().slice(0, 5),
                datetime: dt,
                type: r.type || '—',
                agent: agent,
                lieu: r.observations || '—',
                resume: 'Ronde ' + (r.type || ''),
                statut: r.statut || '—',
                priorite: r.statut === 'anomalie' ? 'haute' : 'normale',
                id: r.id,
                description: r.observations || '',
                meta: r.meta || {},
                raw: r
            });
        });

        (verifs || []).forEach(v => {
            const dt = new Date(v.created_at);
            const agent = resolveAgent(v.agent_id, v.meta);
            allData.push({
                source: 'verifications',
                date: dt.toISOString().split('T')[0],
                heure: dt.toTimeString().slice(0, 5),
                datetime: dt,
                type: v.type || '—',
                agent: agent,
                lieu: v.commentaire || '—',
                resume: 'Vérif. ' + (v.type || '') + ' → ' + (v.resultat || ''),
                statut: v.resultat || '—',
                priorite: v.resultat === 'non_conforme' || v.resultat === 'anomalie' ? 'haute' : 'normale',
                id: v.id,
                description: v.commentaire || '',
                meta: v.meta || {},
                raw: v
            });
        });

        // Sort by most recent
        allData.sort((a, b) => b.datetime - a.datetime);

        // Update indicators
        updateIndicators(rapports || [], rondes || [], verifs || []);

        // Apply filters and render
        applyFilters();

        const total = (rapports || []).length + (rondes || []).length + (verifs || []).length;
        showToast(`✅ ${total} enregistrements chargés depuis Supabase`);

    } catch (err) {
        console.error('Supabase error:', err);
        showToast('❌ Erreur de chargement : ' + (err.message || err), true);
    } finally {
        setLoading(false);
    }
}

function resolveAgent(id, metaFallback) {
    // 1) Essai via profiles/users si on a un id
    if (id) {
        const p = profilesMap[id];
        if (p) {
            const nom = [p.prenom, p.nom].filter(Boolean).join(' ').trim();
            if (nom) return nom;
        }
    }
    // 2) Fallback : meta.agent_nom (rempli par report.html)
    if (metaFallback && metaFallback.agent_nom) {
        return metaFallback.agent_nom;
    }
    // 3) Dernier recours : début de l'id ou tiret
    if (id) return id.slice(0, 8) + '…';
    return '—';
}

/* ==========================================================
   INDICATORS
   ========================================================== */
function updateIndicators(rapports, rondes, verifs) {
    const total = rapports.length + rondes.length + verifs.length;
    document.getElementById('indTotal').textContent = total;

    // Ce mois
    const now = new Date();
    const moisActuel = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    const ceMois = allData.filter(r => r.date.startsWith(moisActuel)).length;
    document.getElementById('indMonth').textContent = ceMois;

    // Critiques
    const critiques = rapports.filter(r => r.priorite === 'urgente' || r.priorite === 'haute').length;
    document.getElementById('indCritique').textContent = critiques;

    // Rondes
    document.getElementById('indRondes').textContent = rondes.length;

    // Vérifications
    document.getElementById('indVerifs').textContent = verifs.length;
}

/* ==========================================================
   FILTERS
   ========================================================== */
function toggleCustomDates() {
    const isCustom = document.getElementById('periode').value === 'custom';
    document.getElementById('dateStart').style.display = isCustom ? '' : 'none';
    document.getElementById('dateEnd').style.display = isCustom ? '' : 'none';
}

function applyFilters() {
    let data = [...allData];

    const source  = document.getElementById('source').value;
    const periode = document.getElementById('periode').value;
    const theme   = document.getElementById('theme').value;
    const tri     = document.getElementById('tri').value;
    const ds      = document.getElementById('dateStart').value;
    const de      = document.getElementById('dateEnd').value;

    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];

    // Source filter
    if (source !== 'all') {
        data = data.filter(r => r.source === source);
    }

    // Period filter
    if (periode === 'today') {
        data = data.filter(r => r.date === todayStr);
    } else if (periode === 'week') {
        const weekAgo = new Date(today);
        weekAgo.setDate(weekAgo.getDate() - 7);
        data = data.filter(r => r.datetime >= weekAgo);
    } else if (periode === 'month') {
        const mois = todayStr.slice(0, 7);
        data = data.filter(r => r.date.startsWith(mois));
    } else if (periode === 'year') {
        const annee = todayStr.slice(0, 4);
        data = data.filter(r => r.date.startsWith(annee));
    } else if (periode === 'custom' && ds && de) {
        data = data.filter(r => r.date >= ds && r.date <= de);
    }

    // Type filter
    if (theme !== 'all') {
        data = data.filter(r => r.type === theme);
    }

    // Sort
    if (tri === 'recent') {
        data.sort((a, b) => b.datetime - a.datetime);
    } else if (tri === 'old') {
        data.sort((a, b) => a.datetime - b.datetime);
    } else if (tri === 'agent') {
        data.sort((a, b) => a.agent.localeCompare(b.agent));
    } else if (tri === 'theme') {
        data.sort((a, b) => a.type.localeCompare(b.type));
    }

    filteredData = data;
    renderTable(data);
}

/* ==========================================================
   RENDER TABLE
   ========================================================== */
function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    const empty = document.getElementById('emptyState');
    const table = document.getElementById('tableRapports');

    tbody.innerHTML = '';

    if (data.length === 0) {
        table.style.display = 'none';
        empty.style.display = '';
        return;
    }

    table.style.display = '';
    empty.style.display = 'none';

    const sourceLabels = { rapports: '📋 Rapport', rondes: '🔄 Ronde', verifications: '🔍 Vérif.' };
    const prioriteClasses = { urgente: 'badge-urgente', haute: 'badge-haute', normale: 'badge-normale', basse: 'badge-basse' };
    const statutClasses = { ouvert: 'badge-ouvert', en_cours: 'badge-en_cours', cloture: 'badge-cloture', terminee: 'badge-cloture', conforme: 'badge-ouvert', non_conforme: 'badge-urgente', anomalie: 'badge-haute' };

    data.forEach(r => {
        const tr = document.createElement('tr');

        const pClass = prioriteClasses[r.priorite] || 'badge-normale';
        const sClass = statutClasses[r.statut] || 'badge-normale';

        tr.innerHTML = `
            <td>${r.date}</td>
            <td>${r.heure}</td>
            <td>${sourceLabels[r.source] || r.source}</td>
            <td>${r.type}</td>
            <td>${r.agent}</td>
            <td title="${escapeHtml(r.resume)}">${truncate(r.lieu, 30)}</td>
            <td><span class="badge ${sClass}">${r.statut}</span></td>
            <td><span class="badge ${pClass}">${r.priorite}</span></td>
            <td><button class="btn-view" onclick="openReport('${r.source}','${r.id}')">👁 Ouvrir</button></td>
        `;
        tbody.appendChild(tr);
    });
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function truncate(str, len) {
    if (!str || str.length <= len) return str || '—';
    return str.slice(0, len) + '…';
}

/* ==========================================================
   EXPORT CSV
   ========================================================== */
function exportCSV() {
    if (filteredData.length === 0) {
        showToast('Aucune donnée à exporter', true);
        return;
    }

    // Récupère toutes les clés meta présentes dans la sélection pour faire des colonnes
    const metaKeys = new Set();
    filteredData.forEach(r => {
        if (r.meta && typeof r.meta === 'object') {
            Object.keys(r.meta).forEach(k => metaKeys.add(k));
        }
    });
    const metaCols = [...metaKeys].sort();

    const headers = [
        'Date', 'Heure', 'Source', 'Type', 'Agent', 'Lieu', 'Résumé',
        'Description', 'Statut', 'Priorité', 'ID',
        ...metaCols.map(k => 'meta.' + k)
    ];

    const rows = filteredData.map(r => {
        const base = [
            r.date, r.heure, r.source, r.type, r.agent, r.lieu, r.resume,
            r.description || '', r.statut, r.priorite, r.id
        ];
        const metaVals = metaCols.map(k => {
            const v = (r.meta || {})[k];
            if (v === null || v === undefined) return '';
            if (typeof v === 'object') return JSON.stringify(v);
            return String(v);
        });
        return [...base, ...metaVals]
            .map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""').replace(/\r?\n/g, ' ¶ ') + '"')
            .join(';');
    });

    const csv = '\uFEFF' + headers.join(';') + '\n' + rows.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'rapports_lbm_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
    URL.revokeObjectURL(url);

    showToast(`✅ ${filteredData.length} lignes exportées (avec description + meta)`);
}

/* ==========================================================
   PDF GENERATION
   ========================================================== */
function getRapportsPlage(type) {
    const todayStr = new Date().toISOString().split('T')[0];

    return allData.filter(r => {
        if (r.date !== todayStr) return false;
        const h = parseInt(r.heure.split(':')[0]);
        if (type === 'jour') return h >= 8 && h < 20;
        if (type === 'nuit') return (h >= 20 && h <= 23) || (h >= 0 && h < 8);
        return false;
    });
}

async function genererPDFUltra(rapportsFiltrés, titre) {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const M = 15, PW = 180, BOT = 275;
    let y = 0, pageNum = 0;

    /* ── HELPERS ── */
    function newPage() {
        if (pageNum > 0) pdf.addPage();
        pageNum++;
        pdf.setDrawColor(200); pdf.setLineWidth(0.2); pdf.line(M, 12, M + PW, 12);
        y = 18;
    }
    function footer() {
        pdf.setDrawColor(180); pdf.setLineWidth(0.2); pdf.line(M, 283, M + PW, 283);
        pdf.setFontSize(7); pdf.setTextColor(140);
        pdf.text('Le Bon Marche \u00b7 SEGEP RG \u00b7 Batiment 3  |  Document confidentiel', M, 288);
        pdf.text('Page ' + pageNum, M + PW, 288, { align: 'right' });
    }
    function ensureSpace(n) { if (y + n > BOT) { footer(); newPage(); } }
    function writeLines(text, x, maxW, fontSize, color, bold) {
        pdf.setFontSize(fontSize);
        pdf.setTextColor(color[0], color[1], color[2]);
        if (bold) pdf.setFont(undefined, 'bold'); else pdf.setFont(undefined, 'normal');
        const lines = pdf.splitTextToSize(String(text || ''), maxW);
        lines.forEach(l => { ensureSpace(fontSize * 0.45 + 1); pdf.text(l, x, y); y += fontSize * 0.45 + 1; });
        pdf.setFont(undefined, 'normal');
    }

    const sourceLabels = { rapports: 'Rapport', rondes: 'Ronde', verifications: 'Verification' };
    const sourceColors = { rapports: [180, 50, 50], rondes: [50, 100, 180], verifications: [190, 140, 20] };

    /* ══════════════════════════════════════════════
       EN-TÊTE PAGE 1
    ══════════════════════════════════════════════ */
    newPage();

    // Bandeau corporate
    pdf.setFillColor(15, 25, 50);
    pdf.rect(0, 0, 210, 52, 'F');
    pdf.setFillColor(200, 170, 50);
    pdf.rect(0, 52, 210, 1.5, 'F');

    pdf.setFontSize(20); pdf.setTextColor(255);
    pdf.text(titre.toUpperCase(), M, 24);

    pdf.setFontSize(10); pdf.setTextColor(200, 170, 50);
    pdf.text('Le Bon Marche  \u00b7  SEGEP RG  \u00b7  Batiment 3', M, 34);

    const dateGen = new Date().toLocaleString('fr-FR');
    pdf.setFontSize(8); pdf.setTextColor(160);
    pdf.text('Genere le ' + dateGen, M, 44);

    y = 62;

    /* ── CARTOUCHE SYNTHÈSE ── */
    const nbRapports = rapportsFiltrés.filter(r => r.source === 'rapports').length;
    const nbRondes = rapportsFiltrés.filter(r => r.source === 'rondes').length;
    const nbVerifs = rapportsFiltrés.filter(r => r.source === 'verifications').length;
    const nbHaute = rapportsFiltrés.filter(r => r.priorite === 'haute' || r.priorite === 'urgente').length;

    ensureSpace(32);
    pdf.setFillColor(245, 247, 252);
    pdf.setDrawColor(200); pdf.setLineWidth(0.3);
    pdf.roundedRect(M, y, PW, 26, 3, 3, 'FD');

    // Ligne 1 : compteurs
    const cols = [
        { label: 'Total', val: String(rapportsFiltrés.length), x: M + 8 },
        { label: 'Rapports', val: String(nbRapports), x: M + 50 },
        { label: 'Rondes', val: String(nbRondes), x: M + 90 },
        { label: 'Verifications', val: String(nbVerifs), x: M + 130 }
    ];
    cols.forEach(c => {
        pdf.setFontSize(8); pdf.setTextColor(100); pdf.text(c.label, c.x, y + 8);
        pdf.setFontSize(14); pdf.setTextColor(20); pdf.setFont(undefined, 'bold');
        pdf.text(c.val, c.x, y + 17);
    });
    // Alertes
    if (nbHaute > 0) {
        pdf.setFillColor(255, 230, 230); pdf.setDrawColor(200, 60, 60);
        pdf.roundedRect(M + PW - 35, y + 5, 28, 14, 2, 2, 'FD');
        pdf.setFontSize(8); pdf.setTextColor(180, 30, 30);
        pdf.text(nbHaute + ' alerte' + (nbHaute > 1 ? 's' : ''), M + PW - 32, y + 14);
    }
    pdf.setFont(undefined, 'normal');
    y += 34;

    /* ── LISTE VIDE ── */
    if (rapportsFiltrés.length === 0) {
        ensureSpace(20);
        pdf.setFontSize(11); pdf.setTextColor(100);
        pdf.text('Aucun evenement dans cette plage horaire.', M, y);
        footer();
        return pdf;
    }

    /* ══════════════════════════════════════════════
       RAPPORTS DÉTAILLÉS
    ══════════════════════════════════════════════ */
    rapportsFiltrés.forEach((r, idx) => {
        ensureSpace(35);

        // Bandeau du rapport
        const color = sourceColors[r.source] || [80, 80, 80];
        pdf.setFillColor(color[0], color[1], color[2]);
        pdf.roundedRect(M, y, PW, 10, 2, 2, 'F');
        pdf.setFontSize(11); pdf.setTextColor(255); pdf.setFont(undefined, 'bold');
        const headerTxt = (idx + 1) + '.  [' + (sourceLabels[r.source] || r.source).toUpperCase() + ']  ' + (r.type || '').toUpperCase();
        pdf.text(headerTxt, M + 5, y + 7);
        pdf.setFont(undefined, 'normal');
        y += 14;

        // Tableau info clé
        const infoRows = [
            ['Date / Heure', r.date + '  a  ' + r.heure],
            ['Agent', r.agent || '\u2014'],
            ['Lieu', r.lieu || '\u2014'],
            ['Statut', r.statut || '\u2014'],
            ['Priorite', r.priorite || 'normale']
        ];

        const colW1 = 35, colW2 = PW - colW1;
        infoRows.forEach(([lbl, val]) => {
            ensureSpace(8);
            pdf.setFillColor(250, 251, 254);
            pdf.rect(M, y, PW, 7, 'F');
            pdf.setDrawColor(230); pdf.setLineWidth(0.1);
            pdf.rect(M, y, PW, 7, 'S');
            pdf.line(M + colW1, y, M + colW1, y + 7);

            pdf.setFontSize(8); pdf.setTextColor(100);
            pdf.text(lbl, M + 3, y + 5);

            pdf.setFontSize(9); pdf.setTextColor(30);
            // Priorité haute en rouge
            if (lbl === 'Priorite' && (val === 'haute' || val === 'urgente')) pdf.setTextColor(200, 40, 40);
            pdf.text(String(val).substring(0, 80), M + colW1 + 3, y + 5);

            y += 7;
        });

        // Description
        if (r.description && r.description.trim()) {
            y += 3;
            ensureSpace(12);
            pdf.setFontSize(9); pdf.setTextColor(60, 80, 130); pdf.setFont(undefined, 'bold');
            pdf.text('Description', M, y); y += 5;
            pdf.setFont(undefined, 'normal');

            pdf.setFontSize(9); pdf.setTextColor(40);
            const descLines = pdf.splitTextToSize(r.description, PW - 8);
            descLines.forEach(l => {
                ensureSpace(5);
                pdf.text(l, M + 4, y);
                y += 4.5;
            });
        }

        // Meta (clés utiles seulement, pas les données techniques)
        if (r.meta && typeof r.meta === 'object') {
            const skipKeys = ['form_data', 'form_fields', 'source'];
            const metaEntries = Object.entries(r.meta).filter(([k, v]) => {
                if (skipKeys.includes(k)) return false;
                if (v === null || v === undefined || v === '') return false;
                if (typeof v === 'object') return false;
                return true;
            });

            if (metaEntries.length) {
                y += 3;
                ensureSpace(10);
                pdf.setFontSize(9); pdf.setTextColor(60, 80, 130); pdf.setFont(undefined, 'bold');
                pdf.text('Details complementaires', M, y); y += 5;
                pdf.setFont(undefined, 'normal');

                metaEntries.forEach(([k, v]) => {
                    ensureSpace(6);
                    const label = k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                    pdf.setFontSize(8); pdf.setTextColor(110);
                    pdf.text(label + ' :', M + 4, y);
                    pdf.setTextColor(40);
                    pdf.text(String(v).substring(0, 100), M + 4 + pdf.getTextWidth(label + ' : ') + 2, y);
                    y += 5;
                });
            }
        }

        // Séparateur
        y += 4;
        ensureSpace(4);
        pdf.setDrawColor(220); pdf.setLineWidth(0.15);
        pdf.line(M + 20, y, M + PW - 20, y);
        y += 6;
    });

    // Footer dernière page
    footer();
    return pdf;
}

async function envoyerRapportsPDF(type) {
    const rapportsFiltrés = getRapportsPlage(type);

    const dateStr = new Date().toLocaleDateString('fr-FR');
    const titre = type === 'jour'
        ? 'Rapports du jour ' + dateStr + ' (8h - 20h)'
        : 'Rapports de nuit ' + dateStr + ' (20h - 8h)';

    const pdf = await genererPDFUltra(rapportsFiltrés, titre);

    const filename = 'Rapports_LBM_' + type + '_' + new Date().toISOString().split('T')[0] + '.pdf';
    pdf.save(filename);

    // Mail professionnel
    const subject = titre + ' — Le Bon Marche Securite';
    const body = [
        'Bonjour,',
        '',
        'Veuillez trouver ci-joint le compte rendu des evenements de la vacation.',
        '',
        'Vacation : ' + (type === 'jour' ? 'Jour (8h - 20h)' : 'Nuit (20h - 8h)'),
        'Date : ' + dateStr,
        'Total : ' + rapportsFiltrés.length + ' evenement(s)',
        '',
        'Cordialement,',
        'Service Securite Incendie',
        'Le Bon Marche — SEGEP RG — Batiment 3'
    ].join('\n');

    window.location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);

    showToast('📧 PDF genere (' + rapportsFiltrés.length + ' rapports)');
}

/* ==========================================================
   OPEN REPORT — modale détail
   ========================================================== */
function openReport(source, id) {
    const r = allData.find(x => x.source === source && String(x.id) === String(id));
    if (!r) {
        showToast('Rapport introuvable', true);
        return;
    }

    const sourceLabels = { rapports: '📋 Rapport', rondes: '🔄 Ronde', verifications: '🔍 Vérification' };

    let metaHtml = '';
    if (r.meta && Object.keys(r.meta).length) {
        metaHtml = '<h3>Détails complémentaires</h3>';
        Object.entries(r.meta).forEach(([k, v]) => {
            if (v === null || v === undefined || v === '') return;
            const val = typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v);
            metaHtml += `
                <div class="field">
                    <span class="field-label">${escapeHtml(k)}</span>
                    <div class="field-value">${escapeHtml(val)}</div>
                </div>`;
        });
    }

    const descHtml = r.description && r.description.trim()
        ? `<h3>Description</h3>
           <div class="field"><div class="field-value">${escapeHtml(r.description)}</div></div>`
        : '';

    const html = `
        <h2>${sourceLabels[r.source] || r.source} — ${escapeHtml(r.type || '')}</h2>

        <div class="field"><span class="field-label">Date / Heure</span>
             <div class="field-value">${r.date} à ${r.heure}</div></div>

        <div class="field"><span class="field-label">Agent</span>
             <div class="field-value">${escapeHtml(r.agent)}</div></div>

        <div class="field"><span class="field-label">Lieu</span>
             <div class="field-value">${escapeHtml(r.lieu)}</div></div>

        <div class="field"><span class="field-label">Résumé</span>
             <div class="field-value">${escapeHtml(r.resume)}</div></div>

        <div class="field"><span class="field-label">Statut / Priorité</span>
             <div class="field-value">${escapeHtml(r.statut)} — ${escapeHtml(r.priorite)}</div></div>

        <div class="field"><span class="field-label">ID</span>
             <div class="field-value" style="font-family:monospace;font-size:0.85rem;opacity:0.7">${r.id}</div></div>

        ${descHtml}
        ${metaHtml}

        <div class="modal-actions">
            <button class="modal-print" onclick="printSingleReport('${source}','${id}')">📄 Exporter ce rapport en PDF</button>
            <button class="modal-close" onclick="closeReport()">Fermer</button>
        </div>
    `;

    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('active');
}

function closeReport() {
    document.getElementById('modalOverlay').classList.remove('active');
}

async function printSingleReport(source, id) {
    const r = allData.find(x => x.source === source && String(x.id) === String(id));
    if (!r) return;
    const titre = 'Rapport ' + (r.type || '') + ' du ' + r.date;
    const pdf = await genererPDFUltra([r], titre);
    pdf.save('Rapport_LBM_' + (r.type || 'detail').replace(/[^a-zA-Z0-9]/g, '_') + '_' + r.date + '.pdf');
    showToast('📄 PDF du rapport telecharge');
}

/* ==========================================================
   REALTIME SUBSCRIPTION (auto-refresh on new data)
   ========================================================== */
function setupRealtime() {
    supabaseClient
        .channel('dashboard-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'rapports' }, () => {
            showToast('🔔 Nouveau rapport détecté, rechargement…');
            setTimeout(loadAllData, 500);
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'rondes' }, () => {
            showToast('🔔 Nouvelle ronde détectée, rechargement…');
            setTimeout(loadAllData, 500);
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'verifications' }, () => {
            showToast('🔔 Nouvelle vérification détectée, rechargement…');
            setTimeout(loadAllData, 500);
        })
        .subscribe();
}

/* ==========================================================
   INIT
   ========================================================== */
document.addEventListener('DOMContentLoaded', () => {
    loadAllData();
    setupRealtime();
});
