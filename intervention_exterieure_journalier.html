<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<title>Interventions Entreprises Extérieures — Liste journalière</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 🎨 Design global -->
<link rel="stylesheet" href="global.css">

<style>
/* 🎨 Styles spécifiques à cette page */

h1 { 
    color: var(--accent); 
    margin-bottom: 20px; 
    text-align: center;
}

h2 { 
    color: var(--accent); 
    margin-top: 30px; 
}

/* Champ de recherche */
input {
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
}

/* Bloc rapport */
.rapport {
    background: var(--card);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
}

/* Compteurs */
.compteur {
    background: var(--card);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
}

/* Bouton retour */
.menu-return {
    display: flex;
    justify-content: flex-start;
    margin-bottom: 20px;
}

.menu-return button {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 10px;
    color: var(--accent);
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 500;
    transition: 0.25s;
}

.menu-return button:hover {
    background: var(--accent);
    color: #000;
}
</style>
</head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="supabaseClient.js"></script>
<script src="tenant.js"></script>

<body>

<!-- 🔐 LOGIN -->


<h1>Interventions Entreprises Extérieures — Liste journalière</h1>

<!-- 🔵 BOUTON MENU STANDARD -->
<div class="menu-return">
    <button onclick="goMenu()">⟵ Menu</button>
</div>

<div class="info">Date du jour : <span id="dateDuJour"></span></div>

<!-- ============================
     COMPTEURS
============================ -->
<div class="compteur">
    <h3 style="color:var(--accent); margin-top:0;">Compteurs du jour</h3>
    <p>Total : <span id="countTotal">0</span></p>
    <p>8h → 20h : <span id="countDay">0</span></p>
    <p>20h → 8h : <span id="countNight">0</span></p>
</div>

<input type="text" id="search" placeholder="Rechercher (entreprise, agent, localisation)…">

<h2>🕗 8h → 20h</h2>
<div id="dayShift"></div>

<h2>🌙 20h → 8h</h2>
<div id="nightShift"></div><script>
// Fallback showToast si global.js pas encore chargé
if (typeof showToast !== "function") {
    window.showToast = function(msg, isError) { alert(msg); };
}

/* ============================================================
   DATE DU JOUR
============================================================ */
const today = new Date().toLocaleDateString("fr-FR");
document.getElementById("dateDuJour").textContent = today;

/* ============================================================
   HELPERS
============================================================ */
function fmtHeure(iso) {
    if (!iso) return null;
    return new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}

function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
}

function mapRow(r) {
    return {
        id:           r.id,
        entreprise:   r.entreprise || "—",
        responsable:  r.responsable || "—",
        telephone:    r.telephone || "",
        zone:         r.zone || "—",
        typeTravaux:  r.type_travaux || "—",
        heureDebut:   fmtHeure(r.heure_arrivee),
        heureFin:     fmtHeure(r.heure_depart),
        statut:       r.statut || "—"
    };
}

/* ============================================================
   CHARGER LES INTERVENTIONS DU JOUR
============================================================ */
let listeJour = [];

async function chargerRapports() {
    const todayISO = new Date().toISOString().split("T")[0];
    const { data, error } = await supabaseClient
        .from("interventions_exterieures")
        .select("*")
        .gte("created_at", todayISO + "T00:00:00")
        .lte("created_at", todayISO + "T23:59:59")
        .order("created_at", { ascending: false });

    if (error) { showToast("❌ " + error.message, true); return; }

    listeJour = (data || []).map(mapRow);
    afficher(listeJour);
    updateCounters(listeJour);
}

/* ============================================================
   AFFICHAGE PAR TRANCHE HORAIRE
============================================================ */
function afficher(liste) {
    const day = document.getElementById("dayShift");
    const night = document.getElementById("nightShift");

    day.innerHTML = "";
    night.innerHTML = "";

    if (liste.length === 0) {
        day.innerHTML = "<p>Aucune intervention en cours aujourd'hui.</p>";
        night.innerHTML = "";
        return;
    }

    liste.forEach(r => {
        const div = document.createElement("div");
        div.className = "rapport";

        const enCours = !r.heureFin;
        const tel = r.telephone
            ? `<p><strong>Téléphone :</strong> ${escapeHtml(r.telephone)}</p>` : "";

        const sortieBlock = enCours
            ? `
                <label style="display:block; margin-top:10px;">Heure de départ :</label>
                <input type="time" id="depart_${r.id}" style="width:100%; padding:8px; border-radius:6px;
                       background:var(--bg2); color:var(--text); border:1px solid var(--border); margin-top:4px;">
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button onclick="cloturer('${r.id}')"
                            style="flex:1; padding:10px; background:var(--accent); color:#000;
                                   border:none; border-radius:8px; cursor:pointer; font-weight:600;">
                        ✅ Clôturer
                    </button>
                    <button onclick="supprimer('${r.id}')"
                            style="flex:1; padding:10px; background:#ef4444; color:white;
                                   border:none; border-radius:8px; cursor:pointer; font-weight:600;">
                        🗑 Supprimer
                    </button>
                </div>`
            : `
                <p style="color:#4ade80; font-weight:600; margin-top:10px;">✓ Terminée</p>
                <button onclick="supprimer('${r.id}')"
                        style="width:100%; padding:10px; background:#ef4444; color:white;
                               border:none; border-radius:8px; cursor:pointer; font-weight:600;">
                    🗑 Supprimer
                </button>`;

        div.innerHTML = `
            <p><strong>Entreprise :</strong> ${escapeHtml(r.entreprise)}</p>
            <p><strong>Type de travaux :</strong> ${escapeHtml(r.typeTravaux)}</p>
            <p><strong>Responsable :</strong> ${escapeHtml(r.responsable)}</p>
            ${tel}
            <p><strong>Zone :</strong> ${escapeHtml(r.zone)}</p>
            <p><strong>Heure d'arrivée :</strong> ${r.heureDebut || "—"}</p>
            <p><strong>Heure de départ :</strong> ${r.heureFin || "—"}</p>
            ${sortieBlock}
        `;

        // Tranche selon l'heure d'arrivée
        const heure = r.heureDebut;
        if (!heure) { day.appendChild(div); return; }
        const h = parseInt(heure.split(":")[0]);
        if (h >= 8 && h < 20) day.appendChild(div);
        else night.appendChild(div);
    });
}

/* ============================================================
   COMPTEURS
============================================================ */
function updateCounters(liste) {
    let total = liste.length, day = 0, night = 0;
    liste.forEach(r => {
        const heure = r.heureDebut;
        if (!heure) { day++; return; }
        const h = parseInt(heure.split(":")[0]);
        if (h >= 8 && h < 20) day++; else night++;
    });
    document.getElementById("countTotal").textContent = total;
    document.getElementById("countDay").textContent = day;
    document.getElementById("countNight").textContent = night;
}

/* ============================================================
   CLÔTURER UNE INTERVENTION
============================================================ */
async function cloturer(id) {
    const heure = document.getElementById("depart_" + id).value;
    if (!heure) { alert("Veuillez entrer une heure de départ."); return; }

    const now = new Date();
    const [h, m] = heure.split(":");
    const ts = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m).toISOString();

    const { error } = await supabaseClient
        .from("interventions_exterieures")
        .update({ heure_depart: ts, statut: "termine" })
        .eq("id", id);

    if (error) { showToast("❌ " + error.message, true); return; }
    showToast("✅ Intervention clôturée");
    chargerRapports();
}

/* ============================================================
   SUPPRIMER UNE INTERVENTION
============================================================ */
async function supprimer(id) {
    if (!confirm("Supprimer définitivement cette intervention ?")) return;

    const { error } = await supabaseClient
        .from("interventions_exterieures")
        .delete()
        .eq("id", id);

    if (error) { showToast("❌ " + error.message, true); return; }
    showToast("🗑 Intervention supprimée");
    chargerRapports();
}

/* ============================================================
   RECHERCHE LOCALE (pas de re-fetch)
============================================================ */
document.getElementById("search").addEventListener("input", function () {
    const q = this.value.toLowerCase();
    const filtered = listeJour.filter(r =>
        r.entreprise.toLowerCase().includes(q) ||
        r.responsable.toLowerCase().includes(q) ||
        r.zone.toLowerCase().includes(q) ||
        r.typeTravaux.toLowerCase().includes(q)
    );
    afficher(filtered);
    updateCounters(filtered);
});

/* ============================================================
   LANCEMENT
============================================================ */
chargerRapports();

function goMenu() { window.location.href = "index.html"; }
</script>

<!-- 🔐 Sécurité -->
<script src="security.js"></script>

<!-- 🎨 Thème global -->
<script src="global.js"></script>

<script src="notifications_global.js"></script>
</body>
</html>
