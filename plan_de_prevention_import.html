<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Plan de Prévention – Import & Consultation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 🎨 Design global -->
<link rel="stylesheet" href="global.css">

<style>
/* 🎨 Styles spécifiques à cette page */

h1 {
    text-align: center;
    margin-bottom: 25px;
    color: var(--accent);
}

/* Bouton menu */
.menu-return {
    display: flex;
    justify-content: flex-start;
    margin-bottom: 20px;
}

.menu-return button {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 10px;
    color: var(--accent);
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 500;
    transition: 0.25s;
}

.menu-return button:hover {
    background: var(--accent);
    color: #000;
}

/* Cartes */
.card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 25px;
    box-shadow: var(--shadow);
}

/* Labels */
label {
    font-size: 0.9rem;
    opacity: 0.9;
}

/* Inputs */
input, select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
}

/* Boutons */
button {
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: black;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    opacity: 0.9;
}

/* Tableau */
table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
}

td, th {
    padding: 12px;
    border-bottom: 1px solid var(--border);
}

th {
    cursor: pointer;
    color: var(--accent);
}

.active {
    color: #4ade80;
    font-weight: 700;
}

/* Barre d’actions */
.actions-bar {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.actions-bar button {
    width:auto;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<script type="module">
import { requireLogin } from "./js/users.js";
requireLogin();
</script>

<h1>📋 Plan de Prévention</h1>

<!-- Bouton menu -->
<div class="menu-return">
    <button onclick="goMenu()">⟵ Menu</button>
</div>

<!-- Dashboard -->
<div id="dashboard" style="display:flex; gap:15px; margin-bottom:25px; flex-wrap:wrap;">
    <div class="card" style="flex:1; min-width:180px; text-align:center;">
        <h3>Actifs</h3>
        <p id="dashActifs" style="font-size:1.6rem; color:#4ade80;">0</p>
    </div>

    <div class="card" style="flex:1; min-width:180px; text-align:center;">
        <h3>Expirant (7 jours)</h3>
        <p id="dashExpirant" style="font-size:1.6rem; color:#fbbf24;">0</p>
    </div>

    <div class="card" style="flex:1; min-width:180px; text-align:center;">
        <h3>Sans visite</h3>
        <p id="dashSansVisite" style="font-size:1.6rem; color:#ef4444;">0</p>
    </div>
</div>

<!-- Alertes critiques -->
<div id="alertes" class="card" style="display:none; border-left:4px solid #ef4444;">
    <h3 style="color:#ef4444;">⚠️ Alertes critiques</h3>
    <ul id="alertList"></ul>
</div>

<!-- Import -->
<div class="card">
    <h2>Importer un Plan de Prévention</h2>

    <label>PDF du plan :</label>
    <input type="file" id="pdfInput" accept="application/pdf">

    <label>Entreprise :</label>
    <input type="text" id="inputEntreprise" placeholder="Ex : Vinci, Segep, Dalkia">

    <label>Zone concernée :</label>
    <input type="text" id="inputZone" placeholder="Ex : Sous-sol, RDC, Local TGBT">

    <label>Date de validité :</label>
    <input type="date" id="inputDate">

    <label>Visite commune effectuée :</label>
    <select id="inputVisite">
        <option value="Non">Non</option>
        <option value="Oui">Oui</option>
    </select>

    <label>Observations :</label>
    <input type="text" id="inputObs" placeholder="Notes, remarques, points sensibles…">

    <button onclick="importerPDF()" style="width:100%;">Importer</button>
</div>

<!-- Filtres + recherche + tableau -->
<div class="card">
    <h2>Plans de Prévention Actifs</h2>

    <div class="actions-bar">
        <select id="filtreEntreprise">
            <option value="">Toutes les entreprises</option>
        </select>

        <select id="filtreZone">
            <option value="">Toutes les zones</option>
        </select>

        <select id="filtreVisite">
            <option value="">Visite ?</option>
            <option value="Oui">Oui</option>
            <option value="Non">Non</option>
        </select>

        <button onclick="exportExcel()">Exporter Excel</button>
    </div>

    <input type="text" id="searchInput" placeholder="🔍 Recherche (nom, entreprise, zone)" style="margin-bottom:15px; width:100%;">

    <table id="tablePP">
        <tr>
            <th onclick="trier('nom')">Nom du PDF ⬍</th>
            <th onclick="trier('entreprise')">Entreprise ⬍</th>
            <th onclick="trier('zone')">Zone ⬍</th>
            <th onclick="trier('dateValidite')">Valable jusqu’au ⬍</th>
            <th>État</th>
            <th>Visite</th>
            <th>Observations</th>
            <th>Ouvrir</th>
            <th>Modifier</th>
        </tr>
    </table>
</div><!-- ============================
     MODALE D'ÉDITION
============================ -->
<div id="modalEdit" style="
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.6); backdrop-filter:blur(4px);
    justify-content:center; align-items:center;
">
    <div style="
        background:var(--card); padding:20px; border-radius:12px;
        width:90%; max-width:400px; border:1px solid var(--border);
        box-shadow:var(--shadow);
    ">
        <h3 style="color:var(--accent);">Modifier le Plan</h3>

        <label>Visite commune :</label>
        <select id="editVisite">
            <option value="Non">Non</option>
            <option value="Oui">Oui</option>
        </select>

        <label>Observations :</label>
        <input type="text" id="editObs">

        <button onclick="saveEdit()" style="width:100%;">Enregistrer</button>
        <button onclick="closeModal()" style="background:#444; color:white; margin-top:10px; width:100%;">Annuler</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabaseClient.js"></script>
<script>
// ============================
// Données
// ============================
let plans = [];
async function loadPlans() {
    const { data, error } = await supabaseClient
        .from("plan_prevention")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Erreur chargement plans :", error);
        alert("Erreur Supabase : " + error.message);
        return;
    }

    plans = (data || []).map(p => ({
        id:            p.id,
        nom:           p.nom_pdf || "Sans nom",
        entreprise:    p.entreprise || "",
        zone:          p.zone || "",
        dateValidite:  p.date_validite || "",
        url:           p.pdf_url || "#",
        pdfPath:       p.pdf_path || null,
        visite:        p.visite || "Non",
        observations:  p.observations || ""
    }));

    afficherPlans();
    remplirFiltres();
}
loadPlans();
let triActuel = { colonne: null, ordre: 1 };
let editIndex = null;
let lastCriticalCount = 0;

// ============================
// Affichage des plans actifs
// ============================
function afficherPlans() {
    const table = document.getElementById("tablePP");

    table.innerHTML = `
        <tr>
            <th onclick="trier('nom')">Nom du PDF ⬍</th>
            <th onclick="trier('entreprise')">Entreprise ⬍</th>
            <th onclick="trier('zone')">Zone ⬍</th>
            <th onclick="trier('dateValidite')">Valable jusqu’au ⬍</th>
            <th>État</th>
            <th>Visite</th>
            <th>Observations</th>
            <th>Ouvrir</th>
            <th>Modifier</th>
        </tr>
    `;

    const now = new Date();
    const fEnt = document.getElementById("filtreEntreprise").value;
    const fZone = document.getElementById("filtreZone").value;
    const fVisite = document.getElementById("filtreVisite").value;
    const search = document.getElementById("searchInput").value.toLowerCase();

    plans.forEach((p, index) => {
        const validite = new Date(p.dateValidite);
        const actif = validite >= now;
        if (!actif) return;

        if (fEnt && p.entreprise !== fEnt) return;
        if (fZone && p.zone !== fZone) return;
        if (fVisite && (p.visite || "Non") !== fVisite) return;

        if (
            !p.nom.toLowerCase().includes(search) &&
            !p.entreprise.toLowerCase().includes(search) &&
            !p.zone.toLowerCase().includes(search)
        ) return;

        const diff = (validite - now) / (1000 * 3600 * 24);

        let color = "#4ade80"; // vert
        if ((p.visite || "Non") === "Non") color = "#fbbf24"; // orange
        if (diff <= 7) color = "#ef4444"; // rouge

        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${p.nom}</td>
            <td>${p.entreprise}</td>
            <td>${p.zone}</td>
            <td>${p.dateValidite}</td>
            <td class="active">Actif</td>
            <td style="color:${color}; font-weight:700;">${p.visite || "Non"}</td>
            <td>${p.observations || "-"}</td>
            <td><a href="${p.url}" target="_blank" style="color:var(--accent);">Ouvrir</a></td>
            <td><button onclick="editPlan(${index})" style="background:var(--accent); color:black; padding:6px 10px; border-radius:6px; border:none;">✏️</button></td>
        `;
        table.appendChild(row);
    });

    updateDashboard();
    updateAlertes();
}

// ============================
// Tri
// ============================
function trier(colonne) {
    if (triActuel.colonne === colonne) {
        triActuel.ordre *= -1;
    } else {
        triActuel.colonne = colonne;
        triActuel.ordre = 1;
    }

    plans.sort((a, b) => {
        if (colonne === "dateValidite") {
            return (new Date(a[colonne]) - new Date(b[colonne])) * triActuel.ordre;
        }
        return a[colonne].localeCompare(b[colonne]) * triActuel.ordre;
    });

    afficherPlans();
}

// ============================
// Remplir les filtres
// ============================
function remplirFiltres() {
    const fEnt = document.getElementById("filtreEntreprise");
    const fZone = document.getElementById("filtreZone");

    fEnt.innerHTML = `<option value="">Toutes les entreprises</option>`;
    fZone.innerHTML = `<option value="">Toutes les zones</option>`;

    const entreprises = [...new Set(plans.map(p => p.entreprise))];
    const zones = [...new Set(plans.map(p => p.zone))];

    entreprises.forEach(ent => {
        const opt = document.createElement("option");
        opt.value = ent;
        opt.textContent = ent;
        fEnt.appendChild(opt);
    });

    zones.forEach(z => {
        const opt = document.createElement("option");
        opt.value = z;
        opt.textContent = z;
        fZone.appendChild(opt);
    });
}

// ============================
// Import PDF
// ============================
async function importerPDF() {
    const fileInput = document.getElementById("pdfInput");
    const entreprise = document.getElementById("inputEntreprise").value.trim();
    const zone = document.getElementById("inputZone").value.trim();
    const dateValidite = document.getElementById("inputDate").value;
    const visite = document.getElementById("inputVisite").value;
    const observations = document.getElementById("inputObs").value.trim();

    if (!fileInput.files.length) return alert("Sélectionne un PDF");
    if (!entreprise) return alert("Saisis une entreprise");
    if (!zone) return alert("Saisis une zone");
    if (!dateValidite) return alert("Saisis une date de validité");

    const file = fileInput.files[0];
    const btn = document.querySelector('button[onclick="importerPDF()"]');
    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = "⏳ Import en cours…";

    try {
        // 1) Upload du PDF dans le bucket Storage
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const path = `${Date.now()}_${safeName}`;

        const { error: upErr } = await supabaseClient
            .storage
            .from("plans-prevention")
            .upload(path, file, { contentType: "application/pdf", upsert: false });

        if (upErr) throw upErr;

        // 2) Récupération de l'URL publique
        const { data: pub } = supabaseClient
            .storage
            .from("plans-prevention")
            .getPublicUrl(path);

        const pdfUrl = pub.publicUrl;

        // 3) Insertion dans la table
        const { error: insErr } = await supabaseClient
            .from("plan_prevention")
            .insert({
                nom_pdf:       file.name,
                entreprise:    entreprise,
                zone:          zone,
                date_validite: dateValidite,
                visite:        visite,
                observations:  observations,
                pdf_url:       pdfUrl,
                pdf_path:      path,
                statut:        "actif"
            });

        if (insErr) throw insErr;

        // 4) Reset du formulaire
        fileInput.value = "";
        document.getElementById("inputEntreprise").value = "";
        document.getElementById("inputZone").value = "";
        document.getElementById("inputDate").value = "";
        document.getElementById("inputVisite").value = "Non";
        document.getElementById("inputObs").value = "";

        // 5) Rechargement de la liste depuis Supabase
        await loadPlans();
        alert("✅ Plan de prévention importé.");
    } catch (e) {
        console.error(e);
        alert("❌ Erreur : " + (e.message || e));
    } finally {
        btn.disabled = false;
        btn.textContent = originalLabel;
    }
}

// ============================
// Dashboard
// ============================
function updateDashboard() {
    const now = new Date();

    let actifs = 0;
    let expirant = 0;
    let sansVisite = 0;

    plans.forEach(p => {
        const d = new Date(p.dateValidite);
        const diff = (d - now) / (1000 * 3600 * 24);

        if (d >= now) actifs++;
        if (diff <= 7 && diff >= 0) expirant++;
        if ((p.visite || "Non") === "Non") sansVisite++;
    });

    document.getElementById("dashActifs").textContent = actifs;
    document.getElementById("dashExpirant").textContent = expirant;
    document.getElementById("dashSansVisite").textContent = sansVisite;
}

// ============================
// Alertes critiques
// ============================
function updateAlertes() {
    const now = new Date();
    const alertBox = document.getElementById("alertes");
    const alertList = document.getElementById("alertList");

    alertList.innerHTML = "";
    let count = 0;

    plans.forEach(p => {
        const d = new Date(p.dateValidite);
        const diff = (d - now) / (1000 * 3600 * 24);

        if ((p.visite || "Non") === "Non" && diff <= 7 && diff >= 0) {
            const li = document.createElement("li");
            li.textContent = `${p.nom} – visite non faite, expire dans ${Math.ceil(diff)} jours`;
            alertList.appendChild(li);
            count++;
        }
    });

    alertBox.style.display = count > 0 ? "block" : "none";

    if (count > 0 && count !== lastCriticalCount && "Notification" in window) {
        if (Notification.permission === "granted") {
            new Notification("Plans de prévention critiques", {
                body: `${count} plan(s) sans visite et proches de l'échéance.`,
            });
        } else if (Notification.permission !== "denied") {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    new Notification("Plans de prévention critiques", {
                        body: `${count} plan(s) sans visite et proches de l'échéance.`,
                    });
                }
            });
        }
    }

    lastCriticalCount = count;
}

// ============================
// Édition
// ============================
function editPlan(index) {
    editIndex = index;
    const p = plans[index];

    document.getElementById("editVisite").value = p.visite || "Non";
    document.getElementById("editObs").value = p.observations || "";

    document.getElementById("modalEdit").style.display = "flex";
}

function closeModal() {
    document.getElementById("modalEdit").style.display = "none";
    editIndex = null;
}

async function saveEdit() {
    if (editIndex === null) return;

    const plan = plans[editIndex];
    const newVisite = document.getElementById("editVisite").value;
    const newObs    = document.getElementById("editObs").value.trim();

    const { error } = await supabaseClient
        .from("plan_prevention")
        .update({ visite: newVisite, observations: newObs })
        .eq("id", plan.id);

    if (error) {
        alert("❌ Erreur sauvegarde : " + error.message);
        return;
    }

    // Met à jour la copie locale puis ferme la modale
    plans[editIndex].visite = newVisite;
    plans[editIndex].observations = newObs;

    closeModal();
    afficherPlans();
    remplirFiltres();
}

// ============================
// Initialisation
// ============================
afficherPlans();
remplirFiltres();
</script><!-- ============================
     BOUTON MENU
============================ -->
<script>
function goMenu() {
    window.location.href = "index.html";
}
</script>

<!-- 🔐 Sécurité -->
<script src="js/security.js"></script>

<!-- 🎨 Thème global -->
<script src="global.js"></script>

</body>
</html>
