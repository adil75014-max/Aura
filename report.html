<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<title>Rapport - LBM Sécurité</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="global.css">
<style>
body { display:flex; justify-content:center; padding:20px; }
.page-container { width:100%; max-width:700px; }
h1 { text-align:center; margin-bottom:25px; color:var(--accent); font-size:1.7rem; }
.menu-return { margin-bottom:20px; }
.menu-return button { background:var(--bg2); border:1px solid var(--border); padding:8px 16px; border-radius:10px; color:var(--accent); cursor:pointer; transition:0.25s; }
.menu-return button:hover { background:var(--accent); color:#000; }
.section { background:var(--card); border:1px solid var(--border); padding:18px; border-radius:14px; margin-bottom:20px; box-shadow:var(--shadow); }
.section h2 { color:var(--accent); margin-bottom:10px; }
textarea, input[type="text"], input[type="time"], select, input[type="file"] { width:100%; padding:10px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; color:var(--text); margin-top:8px; font-size:0.9rem; }
textarea { min-height:120px; resize:vertical; }
.btn { background:var(--accent); border:none; padding:12px 16px; border-radius:10px; color:#000; font-weight:600; cursor:pointer; width:100%; margin-top:10px; }
.btn:hover { opacity:0.85; }
.btn:disabled { opacity:0.4; cursor:not-allowed; }
</style>
</head>
<body>
<div class="page-container">
<h1>Rapport</h1>
<div class="menu-return"><button onclick="location.href='index.html'">⟵ Menu</button></div>

<label><strong>Site :</strong></label>
<select id="reportSite">
    <option value="">Sélectionner un site</option>
    <option value="LBM">Le Bon Marché</option>
    <option value="GERG">La Grande Épicerie Rive Gauche</option>
    <option value="GERD">La Grande Épicerie Rive Droite</option>
    <option value="SAM">La Samaritaine</option>
    <option value="MH">Moët Hennessy</option>
    <option value="M3">Magasin 3 – 115 Rue du Bac</option>
    <option value="BGX">Bagneux</option>
</select>

<div class="section">
    <h2>Informations automatiques</h2>
    <p><strong>ID :</strong> <span id="reportId"></span></p>
    <p><strong>Date :</strong> <span id="reportDate"></span></p>
    <p><strong>Heure début :</strong> <span id="reportTime"></span></p>
    <label>Heure de fin :</label>
    <input type="time" id="reportEndTime">
    <p><strong>Agent principal :</strong> <span id="reportAgent"></span></p>
    <p><strong>Type :</strong> <span id="reportType"></span></p>
</div>

<!-- SECTION MULTI-AGENTS (2 à 3 agents par intervention) -->
<div class="section">
    <h2>👥 Agents affectés à l'intervention</h2>
    <p style="font-size:0.85rem;opacity:0.7;margin-bottom:12px;">
        Vous pouvez affecter jusqu'à 3 agents sur cette intervention.
    </p>
    <div id="agentsContainer">
        <div class="agent-row" style="display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;">
            <span style="font-size:1.1rem;">👤</span>
            <span id="agent1Name" style="flex:1;font-weight:600;"></span>
            <span style="font-size:0.75rem;opacity:0.6;background:rgba(212,175,55,0.15);padding:4px 10px;border-radius:6px;color:var(--accent);">Principal</span>
        </div>
    </div>

    <div style="margin-top:10px;">
        <label style="font-size:0.88rem;font-weight:600;">Ajouter un agent supplémentaire :</label>
        <div style="display:flex;gap:8px;margin-top:6px;">
            <select id="agentSelect" style="flex:1;padding:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:0.9rem;">
                <option value="">— Sélectionner un agent —</option>
            </select>
            <button type="button" onclick="addAgent()" style="padding:10px 16px;background:var(--accent);color:#000;border:none;border-radius:10px;font-weight:700;cursor:pointer;white-space:nowrap;">+ Ajouter</button>
        </div>
        <div id="agentMsg" style="font-size:0.8rem;margin-top:6px;display:none;"></div>
    </div>
</div>

<div class="section"><h2>Informations générales</h2><textarea id="infoGenerales" placeholder="Décris la situation initiale..."></textarea></div>
<div class="section"><h2>Constat</h2><textarea id="constat" placeholder="Décris ce que tu as constaté..."></textarea></div>
<div class="section"><h2>Actions réalisées</h2><textarea id="actions" placeholder="Décris les actions effectuées..."></textarea></div>
<div class="section">
    <label>📸 Photos (multiples)</label><input type="file" id="photos" accept="image/*" multiple>
    <label style="margin-top:10px;">🎥 Vidéos (multiples)</label><input type="file" id="videos" accept="video/*" multiple>
</div>

<button class="btn" id="btnSave" onclick="saveReport()">💾 Enregistrer le rapport</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="supabaseClient.js"></script>
<script src="tenant.js"></script>
<script>
/* Source de vérité unique : code -> libellé lisible.
   Couvre interventions, vérifications et rondes. */
const TYPES = {
    // Interventions
    incendie:                       "Détection incendie",
    odeur:                          "Odeur suspecte",
    desincarceration:               "Désincarcération ASC/MC/Escalator/Toilette",
    fuite:                          "Fuite d'eau",
    alarme:                         "Alarme technique",
    coupure:                        "Coupure électrique",
    animalier:                      "Sauvetage animalier",
    // Vérifications
    verif_j1_baie_ssi:              "J1 Baie SSI",
    verif_j2_materiel_pc:           "J2 Matériel PC",
    verif_j3_materiel_secours:      "J3 Matériel de secours",
    verif_j4_epi:                   "J4 EPI",
    verif_j5_interphonie_asc_mc:    "J5 Interphonie ASC/MC",
    verif_extincteurs_ria_baes:     "Extincteur / RIA / BAES",
    verif_sprinkler:                "Sprinkler",
    verif_surpresseur:              "Surpresseur",
    verif_colonne_seche:            "Colonne sèche",
    verif_desenfumage_naturel:      "Désenfumage naturel",
    verif_baie_accessible:          "Baie accessible",
    verif_eas:                      "EAS",
    verif_salle_gaz:                "Salle automatique à gaz",
    verif_essai_annuel_technicien:  "Essai annuel Technicien",
    verif_essai_triennal_bureau:    "Essai triennal Bureau de contrôle",
    // Rondes
    verif_popup:                    "Vérification Pop up",
    verifreceptiontravaux:          "Réception Travaux"
};

/* Inverse libellé -> code (généré automatiquement) */
const LABEL_TO_CODE = Object.fromEntries(
    Object.entries(TYPES).map(([code, label]) => [label, code])
);

function getTypeCode(label) {
    return LABEL_TO_CODE[label] || label || "autre";
}

function getTypeLabel(code) {
    return TYPES[code] || code || "—";
}

/* Récupère le type depuis (1) l'URL ?type=..., (2) le localStorage, sinon null */
function resolveIntervention() {
    const params = new URLSearchParams(window.location.search);
    const typeParam = params.get("type");
    if (typeParam) {
        // Le type peut être soit un code (ex: "incendie"), soit un libellé complet (ex: "Levée de doute")
        // On essaie d'abord de le résoudre comme code, sinon comme libellé
        let label, code;
        if (TYPES[typeParam]) {
            // C'est un code connu
            code = typeParam;
            label = TYPES[typeParam];
        } else {
            // C'est probablement un libellé envoyé par la supervision
            label = typeParam;
            code = LABEL_TO_CODE[typeParam] || typeParam.toLowerCase().replace(/\s+/g, "_").replace(/[^\w]/g, "");
        }
        localStorage.setItem("selectedIntervention", label);
        return { code, label };
    }
    const fallback = localStorage.getItem("selectedIntervention");
    if (fallback) return { code: getTypeCode(fallback), label: fallback };
    return { code: null, label: null };
}

document.addEventListener("DOMContentLoaded", () => {
    const { code, label } = resolveIntervention();
    document.getElementById("reportType").textContent = label || "—";

    const now = new Date();
    document.getElementById("reportDate").textContent = now.toLocaleDateString("fr-FR");
    document.getElementById("reportTime").textContent = now.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});

    // Récupérer les paramètres URL passés par la supervision
    const params = new URLSearchParams(window.location.search);
    const agentsFromURL = params.get("agents");
    const noteFromURL = params.get("note");
    const missionId = params.get("missionId");

    // Si des agents sont passés depuis la supervision, les utiliser
    if (agentsFromURL) {
        const agentList = agentsFromURL.split(",").filter(Boolean);
        if (agentList.length) {
            assignedAgents = agentList;
            const agentPrincipal = agentList[0];
            document.getElementById("reportAgent").textContent = agentPrincipal;
            document.getElementById("agent1Name").textContent = agentPrincipal;

            // Afficher les agents supplémentaires
            if (agentList.length > 1) {
                const container = document.getElementById("agentsContainer");
                for (let i = 1; i < agentList.length; i++) {
                    const row = document.createElement("div");
                    row.className = "agent-row";
                    row.style.cssText = "display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;";
                    row.innerHTML = `
                        <span style="font-size:1.1rem;">👤</span>
                        <span style="flex:1;font-weight:600;">${agentList[i]}</span>
                        <span style="font-size:0.75rem;opacity:0.6;background:rgba(100,180,255,0.15);padding:4px 10px;border-radius:6px;color:#4da3ff;">Agent ${i + 1}</span>
                        <button type="button" onclick="removeAgent('${agentList[i]}', this)" style="background:rgba(255,80,80,0.15);border:1px solid rgba(255,80,80,0.3);color:#ff6b6b;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:0.8rem;">✕</button>
                    `;
                    container.appendChild(row);
                }
            }
        }
    } else {
        const agentPrincipal = localStorage.getItem("nom") || "Inconnu";
        document.getElementById("reportAgent").textContent = agentPrincipal;
        document.getElementById("agent1Name").textContent = agentPrincipal;
    }

    // Pré-remplir la note dans le champ "Informations générales"
    if (noteFromURL) {
        const infoGen = document.getElementById("infoGenerales");
        if (infoGen) infoGen.value = "Note opérationnelle depuis la supervision : " + noteFromURL;
    }

    // Stocker le missionId pour le rapport
    if (missionId) {
        document.getElementById("reportId").textContent = missionId;
    }

    document.getElementById("reportSite").addEventListener("change", () => {
        const s = document.getElementById("reportSite").value;
        if (!s) return;
        if (missionId) return; // Ne pas écraser l'ID si fourni
        const codeForId = (code || "autre").toUpperCase().slice(0,3);
        document.getElementById("reportId").textContent = s+"-"+codeForId+"-"+Date.now().toString().slice(-6);
    });

    // Charger la liste des agents depuis Supabase
    loadAgentsList();
});

/* ═══════════════════════════════════════════════════════
   MULTI-AGENTS : jusqu'à 3 agents par intervention
═══════════════════════════════════════════════════════ */
let assignedAgents = [localStorage.getItem("nom") || "Inconnu"];

async function loadAgentsList() {
    const select = document.getElementById("agentSelect");
    try {
        // Charger la feuille de garde du jour
        const todayISO = new Date().toISOString().split("T")[0];
        const { data: feuille, error: fError } = await supabaseClient
            .from("feuille_de_garde")
            .select("*")
            .eq("date_jour", todayISO)
            .maybeSingle();

        const agentsFromFeuille = [];

        if (!fError && feuille && feuille.data_json) {
            const json = feuille.data_json;
            // Extraire tous les noms : chef_poste_nom, agent1_nom à agent5_nom, resp_bm_nom
            const fieldsToCheck = [
                "resp_bm_nom", "chef_poste_nom",
                "agent1_nom", "agent2_nom", "agent3_nom", "agent4_nom", "agent5_nom",
                "stat_8_10_nom", "stat_10_12_nom", "stat_12_13_nom",
                "stat_13_15_nom", "stat_15_17_nom", "stat_17_19_nom",
                "stat_19_21_nom", "stat_21_23_nom"
            ];
            const labels = {
                resp_bm_nom: "Responsable BM",
                chef_poste_nom: "Chef de poste",
                agent1_nom: "Agent 1", agent2_nom: "Agent 2",
                agent3_nom: "Agent 3", agent4_nom: "Agent 4", agent5_nom: "Agent 5"
            };
            const seen = new Set();
            fieldsToCheck.forEach(field => {
                const val = (json[field] || "").trim();
                if (val && !seen.has(val.toLowerCase())) {
                    seen.add(val.toLowerCase());
                    agentsFromFeuille.push({
                        nom: val,
                        role: labels[field] || "Stationnaire"
                    });
                }
            });
        }

        // Si la feuille de garde a des agents, les utiliser
        if (agentsFromFeuille.length > 0) {
            agentsFromFeuille.forEach(p => {
                if (p.nom !== assignedAgents[0]) {
                    const opt = document.createElement("option");
                    opt.value = p.nom;
                    opt.textContent = p.nom + " (" + p.role + ")";
                    select.appendChild(opt);
                }
            });
            // Petit indicateur visuel
            const label = select.previousElementSibling;
            if (label) label.textContent = "Personnel présent (feuille de garde du jour) :";
            return;
        }

        // Sinon, fallback sur la table profiles
        const { data, error } = await supabaseClient
            .from("profiles")
            .select("nom, prenom, role")
            .order("nom");

        if (error || !data) return;

        data.forEach(p => {
            const fullName = [p.prenom, p.nom].filter(Boolean).join(" ");
            if (fullName && fullName !== assignedAgents[0]) {
                const opt = document.createElement("option");
                opt.value = fullName;
                opt.textContent = fullName + (p.role ? " (" + p.role + ")" : "");
                select.appendChild(opt);
            }
        });
    } catch (e) {
        console.warn("Impossible de charger la liste des agents:", e);
    }
}

function addAgent() {
    const select = document.getElementById("agentSelect");
    const msg = document.getElementById("agentMsg");
    const name = select.value;

    msg.style.display = "none";

    if (!name) {
        msg.textContent = "Veuillez sélectionner un agent.";
        msg.style.color = "#ff6b6b";
        msg.style.display = "block";
        return;
    }

    if (assignedAgents.includes(name)) {
        msg.textContent = "Cet agent est déjà affecté.";
        msg.style.color = "#ff6b6b";
        msg.style.display = "block";
        return;
    }

    if (assignedAgents.length >= 3) {
        msg.textContent = "Maximum 3 agents par intervention.";
        msg.style.color = "#ff6b6b";
        msg.style.display = "block";
        return;
    }

    assignedAgents.push(name);
    select.value = "";

    // Ajouter la ligne visuelle
    const container = document.getElementById("agentsContainer");
    const row = document.createElement("div");
    row.className = "agent-row";
    row.style.cssText = "display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;";
    row.innerHTML = `
        <span style="font-size:1.1rem;">👤</span>
        <span style="flex:1;font-weight:600;">${name}</span>
        <span style="font-size:0.75rem;opacity:0.6;background:rgba(100,180,255,0.15);padding:4px 10px;border-radius:6px;color:#4da3ff;">Agent ${assignedAgents.length}</span>
        <button type="button" onclick="removeAgent('${name}', this)" style="background:rgba(255,80,80,0.15);border:1px solid rgba(255,80,80,0.3);color:#ff6b6b;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:0.8rem;">✕</button>
    `;
    container.appendChild(row);

    msg.textContent = "✅ Agent ajouté avec succès.";
    msg.style.color = "#4dff88";
    msg.style.display = "block";
    setTimeout(() => { msg.style.display = "none"; }, 2000);
}

function removeAgent(name, btn) {
    assignedAgents = assignedAgents.filter(a => a !== name);
    btn.closest(".agent-row").remove();
}

/* ═══════════════════════════════════════════════════════
   UPLOAD MÉDIAS → Supabase Storage bucket "rapports-media"
   Retourne un tableau d'URLs publiques
═══════════════════════════════════════════════════════ */
async function uploadMediaFiles(fileInputId, folder) {
    const input = document.getElementById(fileInputId);
    if (!input || !input.files.length) return [];

    const urls = [];
    for (const file of input.files) {
        /* Nom unique : timestamp + nom nettoyé (pas de caractères spéciaux) */
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const path = `${folder}/${Date.now()}_${safeName}`;

        const { error: upErr } = await supabaseClient
            .storage
            .from('rapports-media')
            .upload(path, file, { contentType: file.type, upsert: false });

        if (upErr) {
            console.error(`[Upload] Erreur sur ${file.name} :`, upErr.message);
            continue; /* on skip le fichier en erreur, on continue les autres */
        }

        /* URL publique permanente */
        const { data: pub } = supabaseClient
            .storage
            .from('rapports-media')
            .getPublicUrl(path);

        if (pub && pub.publicUrl) urls.push(pub.publicUrl);
    }
    return urls;
}

async function saveReport() {
    const btn = document.getElementById("btnSave");
    btn.disabled = true; btn.textContent = "⏳ Enregistrement...";
    try {
        const { code: typeCode, label: intervention } = resolveIntervention();
        const site = document.getElementById("reportSite").value;
        const reportId = document.getElementById("reportId").textContent;
        const description = [
            "Informations générales:\n"+document.getElementById("infoGenerales").value,
            "Constat:\n"+document.getElementById("constat").value,
            "Actions réalisées:\n"+document.getElementById("actions").value
        ].join("\n\n");

        /* ── Upload des médias ── */
        btn.textContent = "⏳ Upload des photos...";
        const photoUrls = await uploadMediaFiles('photos', 'photos/' + (reportId || 'unknown'));

        btn.textContent = "⏳ Upload des vidéos...";
        const videoUrls = await uploadMediaFiles('videos', 'videos/' + (reportId || 'unknown'));

        btn.textContent = "⏳ Sauvegarde du rapport...";

        const priorite = typeCode==="incendie" ? "haute" : "normale";

        const { error } = await supabaseClient.from("rapports").insert({
            type: typeCode || "autre",
            titre: (intervention||"Rapport")+" — "+site,
            description: description,
            localisation: site || "Non précisé",
            statut: "ouvert",
            priorite: priorite,
            meta: {
                site,
                heure_debut: document.getElementById("reportTime").textContent,
                heure_fin: document.getElementById("reportEndTime").value,
                agent_nom: assignedAgents[0],
                agents_affectes: assignedAgents, // MULTI-AGENTS
                nb_agents: assignedAgents.length,
                intervention_label: intervention,
                report_id: reportId,
                photos: photoUrls,
                videos: videoUrls
            }
        });
        if (error) throw error;

        // ── Notification globale visible par tous les rôles ──
        const agentsStr = assignedAgents.join(", ");
        if (typeof sendGlobalNotification === "function") {
            await sendGlobalNotification(
                "🔥 Nouvelle intervention : " + (intervention || "Rapport"),
                "Site : " + (site || "—") + "\nAgents : " + agentsStr + "\nPriorité : " + priorite,
                typeCode === "incendie" || typeCode === "alarme" ? "alarme" : "intervention",
                priorite
            );
        }

        const mediaCount = photoUrls.length + videoUrls.length;
        const mediaSuffix = mediaCount > 0 ? ` (${photoUrls.length} photo(s), ${videoUrls.length} vidéo(s))` : '';
        showToast("✅ Rapport enregistré !" + mediaSuffix + " — " + assignedAgents.length + " agent(s)");
        setTimeout(() => location.href="index.html", 1500);
    } catch(e) {
        showToast("❌ "+e.message, true);
        btn.disabled = false; btn.textContent = "💾 Enregistrer le rapport";
    }
}
</script>
<script src="security.js"></script>
<script src="global.js"></script>
<script src="notifications_global.js"></script>
</body>
</html>
