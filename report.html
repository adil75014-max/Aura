<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rapport - LBM Sécurité</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="global.css">

<style>
body {
    display: flex;
    justify-content: center;
    padding: 20px;
}

.page-container {
    width: 100%;
    max-width: 700px;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
    color: var(--accent);
    font-size: 1.7rem;
    font-weight: 600;
}

.menu-return {
    margin-bottom: 20px;
}

.menu-return button {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 10px;
    color: var(--accent);
    cursor: pointer;
    transition: 0.25s;
}

.menu-return button:hover {
    background: var(--accent);
    color: #000;
}

.section {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
}

.section h2 {
    color: var(--accent);
    margin-bottom: 10px;
}

textarea, input[type="text"], input[type="time"], select, input[type="file"] {
    width: 100%;
    padding: 10px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    margin-top: 8px;
    font-size: 0.9rem;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

.btn {
    background: var(--accent);
    border: none;
    padding: 12px 16px;
    border-radius: 10px;
    color: #000;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-top: 10px;
}

.btn:hover {
    opacity: 0.85;
}
</style>
</head>

<body>

<div class="page-container">

<h1>Rapport</h1>

<div class="menu-return">
    <button onclick="goMenu()">⟵ Menu</button>
</div>

<!-- Sélecteur de site -->
<label><strong>Site :</strong></label>
<select id="reportSite">
    <option value="">Sélectionner un site</option>
    <option value="LBM">Le Bon Marché</option>
    <option value="GERG">La Grande Épicerie Rive Gauche</option>
    <option value="GERD">La Grande Épicerie Rive Droite</option>
    <option value="MH">Moët Hennessy</option>
    <option value="M3">Magasin 3 – 115 Rue du Bac</option>
    <option value="BGX">Bagneux</option>
</select>

<!-- Infos automatiques -->
<div class="section">
    <h2>Informations automatiques</h2>

    <p><strong>ID :</strong> <span id="reportId"></span></p>
    <p><strong>Date :</strong> <span id="reportDate"></span></p>
    <p><strong>Heure début :</strong> <span id="reportTime"></span></p>

    <label>Heure de fin :</label>
    <input type="time" id="reportEndTime">

    <p><strong>Agent :</strong> <span id="reportAgent"></span></p>
    <p><strong>Type :</strong> <span id="reportType"></span></p>
</div>

<div class="section">
    <h2>Informations générales</h2>
    <textarea id="infoGenerales" placeholder="Décris la situation initiale..."></textarea>
</div>

<div class="section">
    <h2>Constat</h2>
    <textarea id="constat" placeholder="Décris ce que tu as constaté..."></textarea>
</div>

<div class="section">
    <h2>Actions réalisées</h2>
    <textarea id="actions" placeholder="Décris les actions effectuées..."></textarea>
</div>

<div class="section">
    <label>📸 Photos (multiples)</label>
    <input type="file" id="photos" accept="image/*" multiple>

    <label style="margin-top:10px;">🎥 Vidéos (multiples)</label>
    <input type="file" id="videos" accept="video/*" multiple>
</div>

<button class="btn" onclick="saveReport()">💾 Enregistrer le rapport</button>

</div>

<script>
function goMenu() {
    window.location.href = "index.html";
}
</script>

<script src="js/security.js"></script>
<script src="global.js"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = supabase.createClient(
  "https://hwqlajdytnxavqigmzio.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cWxhamR5dG54YXZxaWdtemlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5Mzg1NjgsImV4cCI6MjA4OTUxNDU2OH0.riGzQlfEPmo9SVK9Rs_fl33DnC5RR5qd2OUhgk4Twv"
);
</script>

<!-- Génération du code intervention -->
<script>
function getTypeCode(label) {
    const map = {
        "Détection incendie": "INC",
        "Odeur suspecte": "ODS",
        "Désincarcération": "DES",
        "Fuite d’eau": "FUE",
        "Alarme technique": "ALT",
        "Coupure électrique": "ELE",
        "Sauvetage animalier": "ANI",
        "Vérification Pop-up": "POP",
        "Réception Travaux": "TRV"
    };
    return map[label] || "UNK";
}
</script>

<!-- Génération ID -->
<script>
async function generateReportId(siteCode, typeCode) {
    const today = new Date();
    const dateCode = today.toISOString().slice(0, 10).replace(/-/g, "");

    const { count } = await supabase
        .from("main_courante_reports")
        .select("*", { count: "exact", head: true })
        .eq("site", siteCode)
        .eq("type_code", typeCode)
        .gte("created_at", today.toISOString().slice(0, 10));

    const index = (count || 0) + 1;
    const paddedIndex = String(index).padStart(3, "0");

    return `${siteCode}-${typeCode}-${dateCode}-${paddedIndex}`;
}
</script>

<!-- Pré-remplissage automatique -->
<script>
document.addEventListener("DOMContentLoaded", async () => {

    const intervention = localStorage.getItem("selectedIntervention");
    const typeCode = getTypeCode(intervention);
    document.getElementById("reportType").textContent = intervention;

    const now = new Date();
    document.getElementById("reportDate").textContent =
        now.toLocaleDateString("fr-FR");
    document.getElementById("reportTime").textContent =
        now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

    const agent = localStorage.getItem("agentName") || "Inconnu";
    document.getElementById("reportAgent").textContent = agent;

    document.getElementById("reportSite").addEventListener("change", async () => {
        const siteCode = document.getElementById("reportSite").value;
        if (!siteCode) return;

        const reportId = await generateReportId(siteCode, typeCode);
        document.getElementById("reportId").textContent = reportId;
    });
});
</script>

<!-- Enregistrement du rapport -->
<script>
async function saveReport() {
    const site = document.getElementById("reportSite").value;
    const reportId = document.getElementById("reportId").textContent;
    const agent = document.getElementById("reportAgent").textContent;
    const type = document.getElementById("reportType").textContent;
    const info = document.getElementById("infoGenerales").value;
    const constat = document.getElementById("constat").value;
    const actions = document.getElementById("actions").value;
    const endTime = document.getElementById("reportEndTime").value;

    if (!site || !reportId) {
        alert("Sélectionne un site avant d’enregistrer.");
        return;
    }

    // Upload photos
    const photoFiles = document.getElementById("photos").files;
    const photoUrls = [];

    for (let file of photoFiles) {
        const path = `photos/${reportId}-${file.name}`;
        const { error } = await supabase.storage
            .from("main-courante")
            .upload(path, file);

        if (!error) {
            const { data } = supabase.storage
                .from("main-courante")
                .getPublicUrl(path);
            photoUrls.push(data.publicUrl);
        }
    }

    // Upload vidéos
    const videoFiles = document.getElementById("videos").files;
    const videoUrls = [];

    for (let file of videoFiles) {
        const path = `videos/${reportId}-${file.name}`;
        const { error } = await supabase.storage
            .from("main-courante")
            .upload(path, file);

        if (!error) {
            const { data } = supabase.storage
                .from("main-courante")
                .getPublicUrl(path);
            videoUrls.push(data.publicUrl);
        }
    }

    // Enregistrement du rapport
    const { error } = await supabase
        .from("main_courante_reports")
        .insert([{
            id_custom: reportId,
            site: site,
            type_code: getTypeCode(type),
            type_label: type,
            agent: agent,
            info_generales: info,
            constat: constat,
            actions: actions,
            end_time: endTime,
            photos: photoUrls,
            videos: videoUrls
        }]);

    if (error) {
        console.error(error);
        alert("Erreur lors de l’enregistrement.");
        return;
    }

    alert("Rapport enregistré avec succès !");
    window.location.href = "index.html";
}
</script>

</body>
</html>
