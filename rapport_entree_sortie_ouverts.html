<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<title>Rapports Entrée/Sortie ouverts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="global.css">
<style>
h1 { color:var(--accent); margin-bottom:20px; text-align:center; }
input { width:100%; padding:10px; margin-bottom:20px; border-radius:8px; border:1px solid var(--border); background:var(--bg2); color:var(--text); }
.rapport { background:var(--card); padding:15px; border-radius:10px; margin-bottom:15px; border:1px solid var(--border); box-shadow:var(--shadow); }
button { margin-top:10px; padding:10px; width:100%; background:var(--accent); border:none; border-radius:8px; color:black; cursor:pointer; font-weight:600; }
button:hover { opacity:0.9; }
.menu-return { display:flex; justify-content:flex-start; margin-bottom:20px; }
.menu-return button { background:var(--bg2); border:1px solid var(--border); padding:8px 16px; border-radius:10px; color:var(--accent); font-size:0.9rem; cursor:pointer; transition:0.25s; width:auto; }
.menu-return button:hover { background:var(--accent); color:#000; }
</style>
</head>
<body>
<h1>Rapports Entrée/Sortie en attente</h1>
<div class="menu-return"><button onclick="location.href='index.html'">⟵ Menu</button></div>

<div id="compteurs" class="rapport">
    <h3 style="color:var(--accent);margin-top:0;">Compteurs des rapports ouverts</h3>

    <div style="display:flex; gap:15px; flex-wrap:wrap; margin-bottom:10px;">
        <div style="flex:1; min-width:140px; text-align:center; background:rgba(77,163,255,0.15); border:1px solid rgba(77,163,255,0.4); border-radius:10px; padding:12px;">
            <div style="font-size:2rem; font-weight:700; color:var(--accent);" id="countPersonnesSite">0</div>
            <div style="font-size:0.85rem; opacity:0.8;">👥 Personnes sur site</div>
        </div>
        <div style="flex:1; min-width:140px; text-align:center; background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:10px; padding:12px;">
            <div style="font-size:1.4rem; font-weight:700;" id="countTotal">0</div>
            <div style="font-size:0.85rem; opacity:0.8;">Rapports ouverts</div>
        </div>
        <div style="flex:1; min-width:140px; text-align:center; background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:10px; padding:12px;">
            <div style="font-size:1.4rem; font-weight:700;" id="countPersonnel">0</div>
            <div style="font-size:0.85rem; opacity:0.8;">Personnel / Société</div>
        </div>
        <div style="flex:1; min-width:140px; text-align:center; background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:10px; padding:12px;">
            <div style="font-size:1.4rem; font-weight:700;" id="countLivraison">0</div>
            <div style="font-size:0.85rem; opacity:0.8;">Livraisons</div>
        </div>
    </div>

    <div style="font-size:0.8rem; opacity:0.6; text-align:right;" id="lastUpdate">—</div>
</div>

<input type="text" id="search" placeholder="Rechercher (société, agent, date)…">
<div id="liste"></div>

<script src="vendor/supabase.js" crossorigin="anonymous"></script>
<script src="supabaseClient.js"></script>
<script src="tenant.js"></script>
<script>
// Fallback showToast si global.js n'est pas encore chargé
if (typeof showToast !== "function") {
    window.showToast = function(msg, isError) {
        if (isError) console.error(msg); else console.log(msg);
        alert(msg);
    };
}

let rapportsData = [];

async function chargerRapports() {
    const { data, error } = await supabaseClient
        .from("rapports_entree_sortie")
        .select("*")
        .eq("statut", "ouvert")
        .order("created_at", { ascending: false });

    if (error) { showToast("❌ "+error.message, true); return; }
    rapportsData = data || [];
    afficher(rapportsData);
    updateCounters(rapportsData);
}

function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
}

function afficher(liste) {
    const div = document.getElementById("liste");
    div.innerHTML = "";
    if (liste.length === 0) { div.innerHTML = "<p>Aucun rapport en attente.</p>"; return; }

    liste.forEach(r => {
        const el = document.createElement("div");
        el.className = "rapport";
        const dt = r.heure_entree ? new Date(r.heure_entree).toLocaleString("fr-FR") : "—";

        // Détail nb personnes / colis selon le type
        let detail = "";
        if (r.motif === "livraison" && r.nb_colis) {
            detail = `<p><strong>Colis / palettes :</strong> ${r.nb_colis}</p>`;
        } else if (r.nb_personnes) {
            detail = `<p><strong>Nombre de personnes :</strong> ${r.nb_personnes}</p>`;
        }

        const obs = r.observations
            ? `<p><strong>Observations :</strong> ${escapeHtml(r.observations)}</p>`
            : "";

        const agent = r.agent_nom
            ? `<p style="opacity:0.7;font-size:0.9rem;"><strong>Saisi par :</strong> ${escapeHtml(r.agent_nom)}</p>`
            : "";

        el.innerHTML = `
            <p><strong>Type :</strong> ${escapeHtml(r.type_entree || r.motif || "—")}</p>
            <p><strong>Entreprise / Société :</strong> ${escapeHtml(r.entreprise || r.nom_personne || "—")}</p>
            ${detail}
            <p><strong>Heure d'entrée :</strong> ${dt}</p>
            ${obs}
            ${agent}

            <label>Heure de sortie :</label>
            <input type="time" id="sortie_${r.id}">

            <div style="display:flex; gap:10px; margin-top:10px;">
                <button onclick="cloturer('${r.id}')">✅ Clôturer</button>
                <button onclick="supprimer('${r.id}')" style="background:#ef4444; color:white;">🗑 Supprimer</button>
            </div>
        `;
        div.appendChild(el);
    });
}

function updateCounters(liste) {
    document.getElementById("countTotal").textContent = liste.length;

    document.getElementById("countPersonnel").textContent = liste.filter(r =>
        r.motif && (r.motif.includes("personnel") || r.motif.includes("société"))
    ).length;

    document.getElementById("countLivraison").textContent = liste.filter(r =>
        r.motif && r.motif.includes("livraison")
    ).length;

    // Personnes sur site = somme de nb_personnes des rapports ouverts (hors livraisons)
    let personnes = 0;
    liste.forEach(r => {
        if (r.motif && r.motif.includes("livraison")) return;
        const n = Number(r.nb_personnes || 0);
        personnes += n > 0 ? n : 1; // au minimum 1 personne par rapport si pas renseigné
    });
    document.getElementById("countPersonnesSite").textContent = personnes;

    document.getElementById("lastUpdate").textContent =
        "Mis à jour : " + new Date().toLocaleTimeString("fr-FR");
}

async function cloturer(id) {
    const heure = document.getElementById("sortie_"+id).value;
    if (!heure) { alert("Veuillez entrer une heure de sortie."); return; }

    const now = new Date();
    const [h,m] = heure.split(":");
    const ts = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m).toISOString();

    const { error } = await supabaseClient
        .from("rapports_entree_sortie")
        .update({ heure_sortie: ts, statut: "cloture" })
        .eq("id", id);

    if (error) { showToast("❌ "+error.message, true); return; }
    showToast("✅ Rapport clôturé !");
    chargerRapports();
}

async function supprimer(id) {
    if (!confirm("Supprimer définitivement ce rapport ouvert ?")) return;

    const { error } = await supabaseClient
        .from("rapports_entree_sortie")
        .delete()
        .eq("id", id);

    if (error) { showToast("❌ "+error.message, true); return; }
    showToast("🗑 Rapport supprimé.");
    chargerRapports();
}

document.getElementById("search").addEventListener("input", function() {
    const q = this.value.toLowerCase();
    const filtered = rapportsData.filter(r =>
        (r.entreprise && r.entreprise.toLowerCase().includes(q)) ||
        (r.nom_personne && r.nom_personne.toLowerCase().includes(q)) ||
        (r.motif && r.motif.toLowerCase().includes(q)) ||
        (r.agent_nom && r.agent_nom.toLowerCase().includes(q))
    );
    afficher(filtered);
    updateCounters(filtered);
});

/* ============================================
   TEMPS RÉEL : rechargement automatique
   quand un rapport est créé, modifié ou supprimé
   ============================================ */
function setupRealtime() {
    supabaseClient
        .channel("entree-sortie-live")
        .on("postgres_changes", {
            event: "*",
            schema: "public",
            table: "rapports_entree_sortie"
        }, () => {
            chargerRapports();
        })
        .subscribe();
}

chargerRapports();
setupRealtime();
</script>
<script src="security.js"></script>
<script src="global.js"></script>
<script src="notifications_global.js"></script>
</body>
</html>
