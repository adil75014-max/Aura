<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Interventions Entreprises Extérieures — Liste journalière</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 🎨 Design global -->
<link rel="stylesheet" href="global.css">

<style>
/* 🎨 Styles spécifiques à cette page */

h1 { 
    color: var(--accent); 
    margin-bottom: 20px; 
    text-align: center;
}

h2 { 
    color: var(--accent); 
    margin-top: 30px; 
}

/* Champ de recherche */
input {
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
}

/* Bloc rapport */
.rapport {
    background: var(--card);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
}

/* Compteurs */
.compteur {
    background: var(--card);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
}

/* Bouton retour */
.menu-return {
    display: flex;
    justify-content: flex-start;
    margin-bottom: 20px;
}

.menu-return button {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 10px;
    color: var(--accent);
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 500;
    transition: 0.25s;
}

.menu-return button:hover {
    background: var(--accent);
    color: #000;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<script type="module">
import { requireLogin } from "./js/users.js";
requireLogin();
</script>

<h1>Interventions Entreprises Extérieures — Liste journalière</h1>

<!-- 🔵 BOUTON MENU STANDARD -->
<div class="menu-return">
    <button onclick="goMenu()">⟵ Menu</button>
</div>

<div class="info">Date du jour : <span id="dateDuJour"></span></div>

<!-- ============================
     COMPTEURS
============================ -->
<div class="compteur">
    <h3 style="color:var(--accent); margin-top:0;">Compteurs du jour</h3>
    <p>Total : <span id="countTotal">0</span></p>
    <p>8h → 20h : <span id="countDay">0</span></p>
    <p>20h → 8h : <span id="countNight">0</span></p>
</div>

<input type="text" id="search" placeholder="Rechercher (entreprise, agent, localisation)…">

<h2>🕗 8h → 20h</h2>
<div id="dayShift"></div>

<h2>🌙 20h → 8h</h2>
<div id="nightShift"></div><script>
/* ============================================================
   DATE DU JOUR
============================================================ */
const today = new Date().toLocaleDateString("fr-FR");
document.getElementById("dateDuJour").textContent = today;

/* ============================================================
   CHARGER LES RAPPORTS DU JOUR
============================================================ */
function chargerRapports() {
    const rapports = JSON.parse(localStorage.getItem("rapports")) || [];

    const journaliers = rapports.filter(r =>
        r.date === today &&
        r.type === "Intervention Entreprise Extérieure"
    );

    afficher(journaliers);
    updateCounters(journaliers);
}

/* ============================================================
   AFFICHAGE DES RAPPORTS PAR TRANCHE HORAIRE
============================================================ */
function afficher(liste) {
    const day = document.getElementById("dayShift");
    const night = document.getElementById("nightShift");

    day.innerHTML = "";
    night.innerHTML = "";

    if (liste.length === 0) {
        day.innerHTML = "<p>Aucune intervention en cours aujourd’hui.</p>";
        night.innerHTML = "";
        return;
    }

    liste.forEach(r => {
        const div = document.createElement("div");
        div.className = "rapport";

        div.innerHTML = `
            <p><strong>Entreprise :</strong> ${r.entreprise}</p>
            <p><strong>Agent :</strong> ${r.agent}</p>
            <p><strong>Localisation :</strong> ${r.localisation}</p>
            <p><strong>Heure début :</strong> ${r.heureDebut}</p>
            <p><strong>Heure fin :</strong> ${r.heureFin || "—"}</p>
            <p><strong>Contrôle EPI :</strong> ${r.epi}</p>
        `;

        const heure = r.heureDebut;
        if (!heure) {
            day.appendChild(div);
            return;
        }

        const h = parseInt(heure.split(":")[0]);

        if (h >= 8 && h < 20) {
            day.appendChild(div);
        } else {
            night.appendChild(div);
        }
    });
}

/* ============================================================
   COMPTEURS AUTOMATIQUES
============================================================ */
function updateCounters(liste) {
    let total = liste.length;
    let day = 0;
    let night = 0;

    liste.forEach(r => {
        const heure = r.heureDebut;
        if (!heure) {
            day++;
            return;
        }

        const h = parseInt(heure.split(":")[0]);

        if (h >= 8 && h < 20) day++;
        else night++;
    });

    document.getElementById("countTotal").textContent = total;
    document.getElementById("countDay").textContent = day;
    document.getElementById("countNight").textContent = night;
}

/* ============================================================
   RECHERCHE RAPIDE
============================================================ */
document.getElementById("search").addEventListener("input", function () {
    const q = this.value.toLowerCase();
    const rapports = JSON.parse(localStorage.getItem("rapports")) || [];

    const journaliers = rapports.filter(r =>
        r.date === today &&
        r.type === "Intervention Entreprise Extérieure" &&
        (
            (r.entreprise && r.entreprise.toLowerCase().includes(q)) ||
            (r.agent && r.agent.toLowerCase().includes(q)) ||
            (r.localisation && r.localisation.toLowerCase().includes(q))
        )
    );

    afficher(journaliers);
    updateCounters(journaliers);
});

/* ============================================================
   LANCEMENT
============================================================ */
chargerRapports();

/* ============================================================
   BOUTON MENU
============================================================ */
function goMenu() {
    window.location.href = "index.html";
}
</script>

<!-- 🔐 Sécurité -->
<script src="js/security.js"></script>

<!-- 🎨 Thème global -->
<script src="global.js"></script>

</body>
</html>
