<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<title>Consignes permanentes — LBM Sécurité</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="global.css">
<style>
body { padding: 20px; max-width: 1100px; margin: 0 auto; }

/* Header */
.page-header { display:flex; align-items:center; gap:14px; margin-bottom:24px; flex-wrap:wrap; }
.page-header h1 { flex:1; font-size:1.5rem; color:var(--accent); margin:0; }
.btn-back { background:var(--bg2); border:1px solid var(--border); padding:8px 16px; border-radius:10px; color:var(--accent); cursor:pointer; font-size:.9rem; transition:.2s; text-decoration:none; }
.btn-back:hover { background:var(--accent); color:#000; }

/* Tabs */
.tabs { display:flex; gap:4px; margin-bottom:20px; background:var(--bg2); padding:4px; border-radius:12px; border:1px solid var(--border); }
.tab { flex:1; text-align:center; padding:10px 16px; border-radius:10px; cursor:pointer; font-weight:600; font-size:.9rem; color:var(--text); transition:.2s; border:none; background:transparent; }
.tab.active { background:var(--accent); color:#000; box-shadow:0 2px 8px rgba(212,175,55,0.3); }
.tab:hover:not(.active) { background:rgba(212,175,55,0.1); }
.tab .tab-count { font-size:.75rem; opacity:.7; margin-left:4px; }

/* Search */
.search-bar { width:100%; padding:12px 16px; border-radius:10px; border:1px solid var(--border); background:var(--bg2); color:var(--text); font-size:.95rem; margin-bottom:20px; }
.search-bar:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(212,175,55,0.15); }

/* Upload form (admin only) */
.upload-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:24px; box-shadow:var(--shadow); }
.upload-card h2 { color:var(--accent); margin-bottom:16px; font-size:1.1rem; }
.upload-form { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.upload-form .full { grid-column:1/-1; }
.upload-form label { display:block; font-size:.8rem; font-weight:600; color:var(--text); opacity:.7; margin-bottom:4px; text-transform:uppercase; letter-spacing:.4px; }
.upload-form input, .upload-form select, .upload-form textarea { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg2); color:var(--text); font-size:.9rem; }
.upload-form textarea { min-height:60px; resize:vertical; }
.upload-form input:focus, .upload-form select:focus, .upload-form textarea:focus { outline:none; border-color:var(--accent); }
.btn-upload { background:var(--accent); border:none; padding:12px 20px; border-radius:10px; color:#000; font-weight:700; font-size:.95rem; cursor:pointer; transition:.2s; }
.btn-upload:hover { opacity:.85; transform:translateY(-1px); }
.btn-upload:disabled { opacity:.4; cursor:wait; }

/* Consignes grid */
.consignes-grid { display:flex; flex-direction:column; gap:12px; }
.consigne-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; display:flex; align-items:center; gap:16px; transition:.2s; cursor:pointer; box-shadow:var(--shadow); }
.consigne-card:hover { border-color:var(--accent); background:rgba(212,175,55,0.04); transform:translateY(-1px); }
.consigne-icon { width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0; background:rgba(212,175,55,0.1); border:1px solid rgba(212,175,55,0.2); }
.consigne-icon.bm { background:rgba(59,130,246,0.1); border-color:rgba(59,130,246,0.25); }
.consigne-icon.torann { background:rgba(168,85,247,0.1); border-color:rgba(168,85,247,0.25); }
.consigne-body { flex:1; min-width:0; }
.consigne-titre { font-weight:700; font-size:.95rem; color:var(--text); margin-bottom:3px; }
.consigne-meta { font-size:.8rem; color:var(--text); opacity:.5; display:flex; flex-wrap:wrap; gap:8px; }
.consigne-right { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
.badge-ack { padding:4px 10px; border-radius:999px; font-size:.72rem; font-weight:600; }
.badge-ack.done { background:rgba(74,222,128,0.15); color:#4ade80; border:1px solid rgba(74,222,128,0.3); }
.badge-ack.pending { background:rgba(251,191,36,0.15); color:#fbbf24; border:1px solid rgba(251,191,36,0.3); }
.badge-service { padding:3px 8px; border-radius:6px; font-size:.7rem; font-weight:700; letter-spacing:.04em; }
.badge-bm { background:rgba(59,130,246,0.15); color:#60a5fa; }
.badge-torann { background:rgba(168,85,247,0.15); color:#a855f7; }

/* Empty state */
.empty-state { text-align:center; padding:50px 20px; color:var(--text); opacity:.4; font-size:.95rem; }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); z-index:9999; display:none; justify-content:center; align-items:flex-start; padding:20px; overflow-y:auto; }
.modal-overlay.active { display:flex; }
.modal-box { background:var(--card); border:1px solid var(--border); border-radius:18px; width:100%; max-width:900px; margin:20px auto; overflow:hidden; box-shadow:0 0 60px rgba(0,0,0,0.5); }
.modal-header { padding:16px 20px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.modal-header h2 { font-size:1.1rem; color:var(--accent); margin:0; }
.modal-close { background:none; border:none; color:var(--text); font-size:1.3rem; cursor:pointer; opacity:.6; }
.modal-close:hover { opacity:1; }
.modal-body { padding:20px; }

/* PDF viewer */
.pdf-frame { width:100%; height:65vh; border-radius:10px; border:1px solid var(--border); background:#222; }

/* Acknowledgment section */
.ack-section { margin-top:20px; padding:16px; border-radius:12px; background:var(--bg2); border:1px solid var(--border); }
.ack-section h3 { margin:0 0 12px; font-size:.95rem; color:var(--accent); }
.ack-list { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
.ack-tag { padding:4px 10px; border-radius:8px; background:rgba(74,222,128,0.1); color:#4ade80; font-size:.8rem; font-weight:600; }
.btn-ack { background:linear-gradient(135deg,#4ade80,#22c55e); border:none; padding:12px 24px; border-radius:10px; color:#000; font-weight:700; font-size:.95rem; cursor:pointer; width:100%; transition:.2s; }
.btn-ack:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(74,222,128,0.3); }
.btn-ack:disabled { opacity:.5; cursor:default; transform:none; box-shadow:none; }
.btn-ack.already { background:var(--bg2); color:#4ade80; border:1px solid rgba(74,222,128,0.3); }

/* Admin actions in modal */
.admin-actions { margin-top:16px; display:flex; gap:8px; flex-wrap:wrap; }
.btn-admin { padding:10px 16px; border-radius:10px; border:1px solid var(--border); background:var(--bg2); color:var(--text); font-size:.85rem; font-weight:600; cursor:pointer; transition:.2s; }
.btn-admin:hover { border-color:var(--accent); color:var(--accent); }
.btn-admin.danger { border-color:#ef4444; color:#ef4444; }
.btn-admin.danger:hover { background:#ef4444; color:#fff; }

/* Description */
.consigne-desc { font-size:.85rem; color:var(--text); opacity:.7; line-height:1.5; margin:10px 0; white-space:pre-wrap; }

@media (max-width:600px) {
    .upload-form { grid-template-columns:1fr; }
    .consigne-card { flex-direction:column; align-items:flex-start; }
    .consigne-right { flex-direction:row; width:100%; justify-content:flex-start; }
    .pdf-frame { height:50vh; }
}
</style>
</head>
<body>



<div class="page-header">
    <a href="index.html" class="btn-back">⟵ Menu</a>
    <h1>📘 Consignes permanentes</h1>
</div>

<!-- ONGLETS BM / TORANN -->
<div class="tabs">
    <button class="tab active" id="tab-bm" onclick="switchTab('BM')">
        🏢 Consignes BM <span class="tab-count" id="count-bm"></span>
    </button>
    <button class="tab" id="tab-torann" onclick="switchTab('Torann')">
        🛡️ Consignes Torann <span class="tab-count" id="count-torann"></span>
    </button>
</div>

<!-- RECHERCHE -->
<input type="text" class="search-bar" id="searchBar" placeholder="🔍 Rechercher une consigne (titre, description, date)…" oninput="renderList()">

<!-- FORMULAIRE D'AJOUT (admin/superviseur uniquement) -->
<div class="upload-card" id="uploadCard" style="display:none;">
    <h2>➕ Ajouter une consigne</h2>
    <div class="upload-form">
        <div>
            <label>Service</label>
            <select id="formService">
                <option value="BM">BM — Le Bon Marché</option>
            <option value="La Samaritaine">La Samaritaine</option>
                <option value="Torann">Torann</option>
            </select>
        </div>
        <div>
            <label>Titre</label>
            <input type="text" id="formTitre" placeholder="Ex : Port du gilet pare-balles">
        </div>
        <div class="full">
            <label>Description (optionnel)</label>
            <textarea id="formDesc" placeholder="Précisions, contexte de la consigne…"></textarea>
        </div>
        <div class="full">
            <label>📄 Fichier PDF de la consigne</label>
            <input type="file" id="formPdf" accept="application/pdf">
        </div>
        <div class="full">
            <button class="btn-upload" id="btnUpload" onclick="ajouterConsigne()">📤 Publier la consigne</button>
        </div>
    </div>
</div>

<!-- LISTE DES CONSIGNES -->
<div class="consignes-grid" id="consignesList"></div>

<!-- MODAL DÉTAIL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)fermerModal()">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="modalTitle">—</h2>
            <button class="modal-close" onclick="fermerModal()">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="supabaseClient.js"></script>
<script src="tenant.js"></script>
<script>
if(typeof showToast!=="function") window.showToast=function(m){alert(m)};

/* ══════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════ */
let consignes = [];
let acquittements = {};   // { consigne_id: [{ agent_nom, acquitte_at }] }
let currentTab = 'BM';
const role = (localStorage.getItem('role') || 'agent').toLowerCase();
const agentNom = localStorage.getItem('nom') || '';
const isAdmin = (role === 'admin' || role === 'superviseur');

/* Afficher le formulaire d'upload uniquement pour admin/superviseur */
if (isAdmin) document.getElementById('uploadCard').style.display = '';

/* ══════════════════════════════════════════════════
   CHARGEMENT
══════════════════════════════════════════════════ */
async function loadConsignes() {
    const { data, error } = await supabaseClient
        .from('consignes_permanentes')
        .select('*')
        .eq('actif', true)
        .order('priorite', { ascending: true, nullsFirst: false })
        .order('created_at', { ascending: false });
    if (error) { showToast('❌ ' + error.message); return; }
    consignes = data || [];

    /* Charger les acquittements */
    const ids = consignes.map(c => c.id);
    if (ids.length) {
        const { data: acks } = await supabaseClient
            .from('consignes_acquittements')
            .select('*')
            .in('consigne_id', ids);
        acquittements = {};
        (acks || []).forEach(a => {
            if (!acquittements[a.consigne_id]) acquittements[a.consigne_id] = [];
            acquittements[a.consigne_id].push(a);
        });
    }

    updateCounts();
    renderList();
}

function updateCounts() {
    const bmCount = consignes.filter(c => (c.service || 'BM') === 'BM').length;
    const torannCount = consignes.filter(c => (c.service || 'BM') === 'Torann').length;
    document.getElementById('count-bm').textContent = bmCount ? `(${bmCount})` : '';
    document.getElementById('count-torann').textContent = torannCount ? `(${torannCount})` : '';
}

/* ══════════════════════════════════════════════════
   ONGLETS
══════════════════════════════════════════════════ */
function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tab-bm').classList.toggle('active', tab === 'BM');
    document.getElementById('tab-torann').classList.toggle('active', tab === 'Torann');
    document.getElementById('formService').value = tab;
    renderList();
}

/* ══════════════════════════════════════════════════
   RENDU LISTE
══════════════════════════════════════════════════ */
function renderList() {
    const container = document.getElementById('consignesList');
    const search = (document.getElementById('searchBar').value || '').toLowerCase();

    const filtered = consignes.filter(c => {
        if ((c.service || 'BM') !== currentTab) return false;
        if (search) {
            const haystack = [c.titre, c.description, c.auteur_nom, fmtDate(c.created_at)].join(' ').toLowerCase();
            if (!haystack.includes(search)) return false;
        }
        return true;
    });

    if (!filtered.length) {
        container.innerHTML = `<div class="empty-state">Aucune consigne ${currentTab} ${search ? 'correspondant à la recherche' : 'publiée'}.</div>`;
        return;
    }

    container.innerHTML = filtered.map(c => {
        const acks = acquittements[c.id] || [];
        const myAck = acks.find(a => a.agent_nom === agentNom);
        const iconClass = (c.service || 'BM') === 'Torann' ? 'torann' : 'bm';
        const badgeService = (c.service || 'BM') === 'Torann'
            ? '<span class="badge-service badge-torann">TORANN</span>'
            : '<span class="badge-service badge-bm">BM</span>';

        return `<div class="consigne-card" onclick="ouvrirConsigne('${c.id}')">
            <div class="consigne-icon ${iconClass}">📄</div>
            <div class="consigne-body">
                <div class="consigne-titre">${esc(c.titre || 'Sans titre')}</div>
                <div class="consigne-meta">
                    <span>📅 ${fmtDate(c.created_at)}</span>
                    ${c.auteur_nom ? '<span>👤 ' + esc(c.auteur_nom) + '</span>' : ''}
                    <span>✅ ${acks.length} acquittement(s)</span>
                </div>
            </div>
            <div class="consigne-right">
                ${badgeService}
                ${myAck
                    ? '<span class="badge-ack done">✅ Lu</span>'
                    : '<span class="badge-ack pending">⏳ À lire</span>'}
            </div>
        </div>`;
    }).join('');
}

/* ══════════════════════════════════════════════════
   MODAL DÉTAIL
══════════════════════════════════════════════════ */
function ouvrirConsigne(id) {
    const c = consignes.find(x => x.id === id);
    if (!c) return;

    document.getElementById('modalTitle').textContent = c.titre || 'Consigne';
    const acks = acquittements[c.id] || [];
    const myAck = acks.find(a => a.agent_nom === agentNom);

    let html = '';

    /* Description */
    if (c.description) {
        html += `<div class="consigne-desc">${esc(c.description)}</div>`;
    }

    /* Infos */
    html += `<div style="font-size:.85rem;color:var(--text);opacity:.6;margin-bottom:12px;">
        Service : <strong>${esc(c.service || 'BM')}</strong> · 
        Publiée le ${fmtDate(c.created_at)}
        ${c.auteur_nom ? ' par <strong>' + esc(c.auteur_nom) + '</strong>' : ''}
        ${c.updated_at && c.updated_at !== c.created_at ? ' · Mise à jour le ' + fmtDate(c.updated_at) : ''}
    </div>`;

    /* PDF viewer */
    if (c.pdf_url) {
        html += `<iframe class="pdf-frame" src="${esc(c.pdf_url)}" title="PDF"></iframe>`;
    } else {
        html += `<div class="empty-state" style="padding:30px;">Aucun PDF attaché à cette consigne.</div>`;
    }

    /* Section acquittement */
    html += `<div class="ack-section">
        <h3>✅ Prise en compte (${acks.length})</h3>
        <div class="ack-list">
            ${acks.length
                ? acks.map(a => `<span class="ack-tag">✓ ${esc(a.agent_nom)} — ${fmtDate(a.acquitte_at)}</span>`).join('')
                : '<span style="font-size:.8rem;color:var(--text);opacity:.4;">Aucun acquittement pour le moment.</span>'}
        </div>`;

    if (myAck) {
        html += `<button class="btn-ack already" disabled>✅ Vous avez validé la prise en compte le ${fmtDate(myAck.acquitte_at)}</button>`;
    } else if (agentNom) {
        html += `<button class="btn-ack" onclick="acquitterConsigne('${c.id}')">✅ Je confirme avoir pris connaissance de cette consigne</button>`;
    } else {
        html += `<button class="btn-ack" disabled>⚠️ Connectez-vous pour valider la prise en compte</button>`;
    }
    html += `</div>`;

    /* Actions admin */
    if (isAdmin) {
        html += `<div class="admin-actions">
            <label class="btn-admin" style="cursor:pointer;">
                🔄 Remplacer le PDF
                <input type="file" accept="application/pdf" style="display:none;" onchange="remplacerPdf('${c.id}', this)">
            </label>
            <button class="btn-admin danger" onclick="supprimerConsigne('${c.id}')">🗑 Supprimer</button>
        </div>`;
    }

    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('active');
}

function fermerModal() {
    document.getElementById('modalOverlay').classList.remove('active');
}

/* ══════════════════════════════════════════════════
   ACQUITTEMENT
══════════════════════════════════════════════════ */
async function acquitterConsigne(id) {
    if (!agentNom) { showToast('⚠️ Nom d\'agent non trouvé.'); return; }

    const { error } = await supabaseClient.from('consignes_acquittements').insert({
        consigne_id: id,
        agent_nom: agentNom,
        agent_role: role
    });

    if (error) {
        if (error.code === '23505') { showToast('✅ Déjà acquittée.'); }
        else { showToast('❌ ' + error.message); }
        return;
    }

    /* Mise à jour locale */
    if (!acquittements[id]) acquittements[id] = [];
    acquittements[id].push({ agent_nom: agentNom, acquitte_at: new Date().toISOString() });
    showToast('✅ Prise en compte enregistrée.');
    ouvrirConsigne(id);   // re-render modal
    renderList();         // re-render badge dans la liste
}

/* ══════════════════════════════════════════════════
   AJOUT CONSIGNE (admin/superviseur)
══════════════════════════════════════════════════ */
async function ajouterConsigne() {
    if (!isAdmin) return;
    const btn = document.getElementById('btnUpload');
    const titre = document.getElementById('formTitre').value.trim();
    const desc  = document.getElementById('formDesc').value.trim();
    const service = document.getElementById('formService').value;
    const fileInput = document.getElementById('formPdf');

    if (!titre)             { showToast('⚠️ Renseignez un titre.'); return; }
    if (!fileInput.files[0]){ showToast('⚠️ Sélectionnez un PDF.'); return; }

    btn.disabled = true; btn.textContent = '⏳ Upload en cours…';
    try {
        const file = fileInput.files[0];
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const path = `${service.toLowerCase()}/${Date.now()}_${safeName}`;

        const { error: upErr } = await supabaseClient.storage
            .from('consignes-permanentes')
            .upload(path, file, { contentType: 'application/pdf', upsert: false });
        if (upErr) throw upErr;

        const { data: pub } = supabaseClient.storage
            .from('consignes-permanentes')
            .getPublicUrl(path);

        const { error: insErr } = await supabaseClient.from('consignes_permanentes').insert({
            titre: titre,
            description: desc || null,
            service: service,
            categorie: service,
            actif: true,
            priorite: 0,
            pdf_url: pub.publicUrl,
            pdf_path: path,
            auteur_nom: agentNom || null
        });
        if (insErr) throw insErr;

        showToast('✅ Consigne publiée.');
        document.getElementById('formTitre').value = '';
        document.getElementById('formDesc').value = '';
        fileInput.value = '';
        await loadConsignes();
        switchTab(service);
    } catch(e) {
        showToast('❌ ' + (e.message || e));
    } finally {
        btn.disabled = false; btn.textContent = '📤 Publier la consigne';
    }
}

/* ══════════════════════════════════════════════════
   REMPLACEMENT PDF (admin/superviseur)
══════════════════════════════════════════════════ */
async function remplacerPdf(id, inputEl) {
    if (!isAdmin || !inputEl.files[0]) return;
    const c = consignes.find(x => x.id === id);
    if (!c) return;
    if (!confirm('Remplacer le PDF de cette consigne par le nouveau fichier ?')) { inputEl.value = ''; return; }

    try {
        showToast('⏳ Remplacement en cours…');
        const file = inputEl.files[0];
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const path = `${(c.service || 'bm').toLowerCase()}/${Date.now()}_${safeName}`;

        /* Upload nouveau */
        const { error: upErr } = await supabaseClient.storage
            .from('consignes-permanentes')
            .upload(path, file, { contentType: 'application/pdf', upsert: false });
        if (upErr) throw upErr;

        /* Supprimer ancien si chemin connu */
        if (c.pdf_path) {
            await supabaseClient.storage.from('consignes-permanentes').remove([c.pdf_path]);
        }

        const { data: pub } = supabaseClient.storage
            .from('consignes-permanentes')
            .getPublicUrl(path);

        const { error: updErr } = await supabaseClient.from('consignes_permanentes')
            .update({ pdf_url: pub.publicUrl, pdf_path: path, updated_at: new Date().toISOString() })
            .eq('id', id);
        if (updErr) throw updErr;

        showToast('✅ PDF mis à jour.');
        await loadConsignes();
        ouvrirConsigne(id);
    } catch(e) {
        showToast('❌ ' + (e.message || e));
    }
    inputEl.value = '';
}

/* ══════════════════════════════════════════════════
   SUPPRESSION (admin/superviseur)
══════════════════════════════════════════════════ */
async function supprimerConsigne(id) {
    if (!isAdmin) return;
    if (!confirm('Supprimer définitivement cette consigne et tous ses acquittements ?\n\nCette action est irréversible.')) return;
    const c = consignes.find(x => x.id === id);

    try {
        /* Supprimer PDF du storage */
        if (c && c.pdf_path) {
            await supabaseClient.storage.from('consignes-permanentes').remove([c.pdf_path]);
        }
        /* Supprimer l'entrée (CASCADE supprime les acquittements) */
        const { error } = await supabaseClient.from('consignes_permanentes').delete().eq('id', id);
        if (error) throw error;

        showToast('✅ Consigne supprimée.');
        fermerModal();
        await loadConsignes();
    } catch(e) {
        showToast('❌ ' + (e.message || e));
    }
}

/* ══════════════════════════════════════════════════
   UTILITAIRES
══════════════════════════════════════════════════ */
function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
}

function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR').slice(0, 5);
}

/* ══════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════ */
loadConsignes();
</script>
