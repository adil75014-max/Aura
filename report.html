<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rapport - LBM Sécurité</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="global.css">
<style>
body { display:flex; justify-content:center; padding:20px; }
.page-container { width:100%; max-width:700px; }
h1 { text-align:center; margin-bottom:25px; color:var(--accent); font-size:1.7rem; }
.menu-return { margin-bottom:20px; }
.menu-return button { background:var(--bg2); border:1px solid var(--border); padding:8px 16px; border-radius:10px; color:var(--accent); cursor:pointer; transition:0.25s; }
.menu-return button:hover { background:var(--accent); color:#000; }
.section { background:var(--card); border:1px solid var(--border); padding:18px; border-radius:14px; margin-bottom:20px; box-shadow:var(--shadow); }
.section h2 { color:var(--accent); margin-bottom:10px; }
textarea, input[type="text"], input[type="time"], select, input[type="file"] { width:100%; padding:10px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; color:var(--text); margin-top:8px; font-size:0.9rem; }
textarea { min-height:120px; resize:vertical; }
.btn { background:var(--accent); border:none; padding:12px 16px; border-radius:10px; color:#000; font-weight:600; cursor:pointer; width:100%; margin-top:10px; }
.btn:hover { opacity:0.85; }
.btn:disabled { opacity:0.4; cursor:not-allowed; }
</style>
</head>
<body>
<div class="page-container">
<h1>Rapport</h1>
<div class="menu-return"><button onclick="location.href='index.html'">⟵ Menu</button></div>

<label><strong>Site :</strong></label>
<select id="reportSite">
    <option value="">Sélectionner un site</option>
    <option value="LBM">Le Bon Marché</option>
    <option value="GERG">La Grande Épicerie Rive Gauche</option>
    <option value="GERD">La Grande Épicerie Rive Droite</option>
    <option value="MH">Moët Hennessy</option>
    <option value="M3">Magasin 3 – 115 Rue du Bac</option>
    <option value="BGX">Bagneux</option>
</select>

<div class="section">
    <h2>Informations automatiques</h2>
    <p><strong>ID :</strong> <span id="reportId"></span></p>
    <p><strong>Date :</strong> <span id="reportDate"></span></p>
    <p><strong>Heure début :</strong> <span id="reportTime"></span></p>
    <label>Heure de fin :</label>
    <input type="time" id="reportEndTime">
    <p><strong>Agent :</strong> <span id="reportAgent"></span></p>
    <p><strong>Type :</strong> <span id="reportType"></span></p>
</div>

<div class="section"><h2>Informations générales</h2><textarea id="infoGenerales" placeholder="Décris la situation initiale..."></textarea></div>
<div class="section"><h2>Constat</h2><textarea id="constat" placeholder="Décris ce que tu as constaté..."></textarea></div>
<div class="section"><h2>Actions réalisées</h2><textarea id="actions" placeholder="Décris les actions effectuées..."></textarea></div>
<div class="section">
    <label>📸 Photos (multiples)</label><input type="file" id="photos" accept="image/*" multiple>
    <label style="margin-top:10px;">🎥 Vidéos (multiples)</label><input type="file" id="videos" accept="video/*" multiple>
</div>

<button class="btn" id="btnSave" onclick="saveReport()">💾 Enregistrer le rapport</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabaseClient.js"></script>
<script>
/* Source de vérité unique : code -> libellé lisible.
   Couvre interventions, vérifications et rondes. */
const TYPES = {
    // Interventions
    incendie:                       "Détection incendie",
    odeur:                          "Odeur suspecte",
    desincarceration:               "Désincarcération ASC/MC/Escalator/Toilette",
    fuite:                          "Fuite d'eau",
    alarme:                         "Alarme technique",
    coupure:                        "Coupure électrique",
    animalier:                      "Sauvetage animalier",
    // Vérifications
    verif_j1_baie_ssi:              "J1 Baie SSI",
    verif_j2_materiel_pc:           "J2 Matériel PC",
    verif_j3_materiel_secours:      "J3 Matériel de secours",
    verif_j4_epi:                   "J4 EPI",
    verif_j5_interphonie_asc_mc:    "J5 Interphonie ASC/MC",
    verif_extincteurs_ria_baes:     "Extincteur / RIA / BAES",
    verif_sprinkler:                "Sprinkler",
    verif_surpresseur:              "Surpresseur",
    verif_colonne_seche:            "Colonne sèche",
    verif_desenfumage_naturel:      "Désenfumage naturel",
    verif_baie_accessible:          "Baie accessible",
    verif_eas:                      "EAS",
    verif_salle_gaz:                "Salle automatique à gaz",
    verif_essai_annuel_technicien:  "Essai annuel Technicien",
    verif_essai_triennal_bureau:    "Essai triennal Bureau de contrôle",
    // Rondes
    verif_popup:                    "Vérification Pop up",
    verifreceptiontravaux:          "Réception Travaux"
};

/* Inverse libellé -> code (généré automatiquement) */
const LABEL_TO_CODE = Object.fromEntries(
    Object.entries(TYPES).map(([code, label]) => [label, code])
);

function getTypeCode(label) {
    return LABEL_TO_CODE[label] || label || "autre";
}

function getTypeLabel(code) {
    return TYPES[code] || code || "—";
}

/* Récupère le type depuis (1) l'URL ?type=..., (2) le localStorage, sinon null */
function resolveIntervention() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("type");
    if (code) {
        const label = getTypeLabel(code);
        // On stocke aussi dans localStorage pour cohérence avec le reste de l'app
        localStorage.setItem("selectedIntervention", label);
        return { code, label };
    }
    const fallback = localStorage.getItem("selectedIntervention");
    if (fallback) return { code: getTypeCode(fallback), label: fallback };
    return { code: null, label: null };
}

document.addEventListener("DOMContentLoaded", () => {
    const { code, label } = resolveIntervention();
    document.getElementById("reportType").textContent = label || "—";

    const now = new Date();
    document.getElementById("reportDate").textContent = now.toLocaleDateString("fr-FR");
    document.getElementById("reportTime").textContent = now.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    document.getElementById("reportAgent").textContent = localStorage.getItem("nom") || "Inconnu";

    document.getElementById("reportSite").addEventListener("change", () => {
        const s = document.getElementById("reportSite").value;
        if (!s) return;
        const codeForId = (code || "autre").toUpperCase().slice(0,3);
        document.getElementById("reportId").textContent = s+"-"+codeForId+"-"+Date.now().toString().slice(-6);
    });
});

/* ═══════════════════════════════════════════════════════
   UPLOAD MÉDIAS → Supabase Storage bucket "rapports-media"
   Retourne un tableau d'URLs publiques
═══════════════════════════════════════════════════════ */
async function uploadMediaFiles(fileInputId, folder) {
    const input = document.getElementById(fileInputId);
    if (!input || !input.files.length) return [];

    const urls = [];
    for (const file of input.files) {
        /* Nom unique : timestamp + nom nettoyé (pas de caractères spéciaux) */
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const path = `${folder}/${Date.now()}_${safeName}`;

        const { error: upErr } = await supabaseClient
            .storage
            .from('rapports-media')
            .upload(path, file, { contentType: file.type, upsert: false });

        if (upErr) {
            console.error(`[Upload] Erreur sur ${file.name} :`, upErr.message);
            continue; /* on skip le fichier en erreur, on continue les autres */
        }

        /* URL publique permanente */
        const { data: pub } = supabaseClient
            .storage
            .from('rapports-media')
            .getPublicUrl(path);

        if (pub && pub.publicUrl) urls.push(pub.publicUrl);
    }
    return urls;
}

async function saveReport() {
    const btn = document.getElementById("btnSave");
    btn.disabled = true; btn.textContent = "⏳ Enregistrement...";
    try {
        const { code: typeCode, label: intervention } = resolveIntervention();
        const site = document.getElementById("reportSite").value;
        const reportId = document.getElementById("reportId").textContent;
        const description = [
            "Informations générales:\n"+document.getElementById("infoGenerales").value,
            "Constat:\n"+document.getElementById("constat").value,
            "Actions réalisées:\n"+document.getElementById("actions").value
        ].join("\n\n");

        /* ── Upload des médias ── */
        btn.textContent = "⏳ Upload des photos...";
        const photoUrls = await uploadMediaFiles('photos', 'photos/' + (reportId || 'unknown'));

        btn.textContent = "⏳ Upload des vidéos...";
        const videoUrls = await uploadMediaFiles('videos', 'videos/' + (reportId || 'unknown'));

        btn.textContent = "⏳ Sauvegarde du rapport...";

        const { error } = await supabaseClient.from("rapports").insert({
            type: typeCode || "autre",
            titre: (intervention||"Rapport")+" — "+site,
            description: description,
            localisation: site || "Non précisé",
            statut: "ouvert",
            priorite: typeCode==="incendie" ? "haute" : "normale",
            meta: {
                site,
                heure_debut: document.getElementById("reportTime").textContent,
                heure_fin: document.getElementById("reportEndTime").value,
                agent_nom: localStorage.getItem("nom"),
                intervention_label: intervention,
                report_id: reportId,
                photos: photoUrls,       // tableau d'URLs publiques
                videos: videoUrls         // tableau d'URLs publiques
            }
        });
        if (error) throw error;

        const mediaCount = photoUrls.length + videoUrls.length;
        const mediaSuffix = mediaCount > 0 ? ` (${photoUrls.length} photo(s), ${videoUrls.length} vidéo(s))` : '';
        showToast("✅ Rapport enregistré !" + mediaSuffix);
        setTimeout(() => location.href="index.html", 1500);
    } catch(e) {
        showToast("❌ "+e.message, true);
        btn.disabled = false; btn.textContent = "💾 Enregistrer le rapport";
    }
}
</script>
<script src="security.js"></script>
<script src="global.js"></script>
</body>
</html>
