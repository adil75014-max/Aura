<style>
/* 🎨 Styles spécifiques à cette page */

h1 {
    text-align: center;
    margin-bottom: 25px;
    color: var(--accent);
    font-size: 1.9rem;
    font-weight: 600;
    text-shadow: 0 0 12px rgba(111,179,255,0.4);
}

/* Bouton retour */
.menu-return {
    margin-bottom: 25px;
}

.menu-return button {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 12px;
    color: var(--accent);
    font-size: 0.95rem;
    cursor: pointer;
    transition: 0.25s;
}

.menu-return button:hover {
    background: var(--accent);
    color: #000;
}

/* Sections */
.section {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 28px;
    box-shadow: var(--shadow);
}

.section h2 {
    color: var(--accent);
    margin-bottom: 14px;
    font-size: 1.25rem;
    font-weight: 600;
}

/* Boutons */
.btn {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 12px;
    color: var(--text);
    font-size: 1rem;
    cursor: pointer;
    transition: 0.25s;
    margin-bottom: 12px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
}

.btn:hover {
    background: var(--accent);
    color: #000;
    transform: translateY(-1px);
}

.empty {
    opacity: 0.7;
    font-size: 0.9rem;
    text-align: center;
    padding: 12px;
}
</style>
  <link rel="stylesheet" href="global.css?v=cplus">

<body>

<h1>Interventions</h1>

<div class="menu-return">
    <button onclick="window.location.href='index.html'">⟵ Retour au menu</button>
</div>

<!-- INTERVENTIONS CLASSIQUES -->
<div class="section">
    <h2>Interventions classiques</h2>

    <button class="btn" onclick="location.href='report.html?type=intervention'">📄 Intervention classique</button>
    <button class="btn" onclick="location.href='create_intervention_report.html'">⚡ Intervention avancée</button>
    <button class="btn" onclick="location.href='report.html?type=verification'">📄 Vérification classique</button>
    <button class="btn" onclick="location.href='create_verification_report.html'">🔥 Vérification incendie avancée</button>
</div>

<!-- INTERVENTIONS PERSONNALISÉES -->
<div class="section">
    <h2>Interventions personnalisées (modèles)</h2>
    <div id="customList"></div>
</div><script>
/* ============================================================
   CHARGEMENT DES MODÈLES PERSONNALISÉS
============================================================ */
function loadCustomForms() {
    const container = document.getElementById("customList");
    container.innerHTML = "";

    const models = JSON.parse(localStorage.getItem("customForms") || "[]");

    if (models.length === 0) {
        container.innerHTML = "<div class='empty'>Aucun modèle créé pour l’instant.</div>";
        return;
    }

    models.forEach(m => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerHTML = "📄 " + m.title;
        btn.onclick = () => {
            location.href = "dynamic_report.html?form=" + m.id;
        };
        container.appendChild(btn);
    });
}

loadCustomForms();
</script>
