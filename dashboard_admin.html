   <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Superviseur - LBM Sécurité</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 🎨 Design global -->
    <link rel="stylesheet" href="global.css">

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* 🎨 Styles spécifiques à cette page */
h1 {
    text-align: center;
    color: var(--accent);
    margin-bottom: 30px;
}

/* Indicateurs */
.indicators {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
}

.indicator {
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
}

.indicator h3 {
    margin: 0;
    font-size: 1.2rem;
    color: var(--accent);
}

.indicator p {
    margin: 8px 0 0;
    font-size: 1.6rem;
    font-weight: 700;
}

/* Filtres */
.filters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
}

select, input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
    font-size: 1rem;
}

/* Options visibles */
select option {
    background: var(--card);
    color: var(--text);
}

/* Tableau */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 25px;
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
}

th, td {
    padding: 14px;
    border-bottom: 1px solid var(--border);
    text-align: left;
}

th {
    background: var(--bg2);
    color: var(--accent);
}

tr:hover {
    background: rgba(255,255,255,0.05);
}

/* Liens */
a {
    color: var(--accent);
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

/* Boutons */
.btn-excel {
    margin-top: 20px;
    padding: 14px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #000;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    font-size: 1.1rem;
}

.btn-mail {
    margin-top: 15px;
    padding: 14px;
    background: linear-gradient(135deg, #7ab8ff, #4d9dff);
    border: none;
    border-radius: 10px;
    color: #0a0f1c;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    font-size: 1.1rem;
    box-shadow: 0 4px 12px rgba(122,184,255,0.4);
    transition: 0.25s ease;
}

.btn-mail:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(122,184,255,0.6);
}
</style>
</head>

<body>

<h1>Dashboard Superviseur</h1>

<!-- INDICATEURS -->
<div class="indicators">
    <div class="indicator">
        <h3>Total interventions</h3>
        <p id="indTotal">0</p>
    </div>

    <div class="indicator">
        <h3>Ce mois</h3>
        <p id="indMonth">0</p>
    </div>

    <div class="indicator">
        <h3>Incidents critiques</h3>
        <p id="indCritique">0</p>
    </div>

    <div class="indicator">
        <h3>Thème sélectionné</h3>
        <p id="indTheme">0</p>
    </div>
</div>

<!-- FILTRES -->
<div class="filters">

    <select id="periode" onchange="applyFilters()">
        <option value="all">Toutes les périodes</option>
        <option value="today">Aujourd’hui</option>
        <option value="week">Cette semaine</option>
        <option value="month">Ce mois</option>
        <option value="year">Cette année</option>
        <option value="custom">Personnalisé</option>
    </select>

    <input type="date" id="dateStart" style="display:none;" onchange="applyFilters()">
    <input type="date" id="dateEnd" style="display:none;" onchange="applyFilters()">

    <select id="theme" onchange="applyFilters()">
        <option value="all">Tous les thèmes</option>

        <!-- 🔥 Interventions -->
        <option value="INC">Détection incendie</option>
        <option value="ODS">Odeur suspecte</option>
        <option value="DES">Désincarcération</option>
        <option value="FUE">Fuite d’eau</option>
        <option value="ALT">Alarme technique</option>
        <option value="ELE">Coupure électrique</option>
        <option value="ANI">Sauvetage animalier</option>

        <!-- 🔄 Rondes -->
        <option value="RONDE_OUVERTURE">Ronde d’ouverture</option>
        <option value="RONDE_TRAVAUX">Ronde Travaux</option>
        <option value="RONDE_PERMIS_FEU">Ronde Permis feu</option>

        <!-- etc. -->
    </select>

    <select id="tri" onchange="applyFilters()">
        <option value="recent">Plus récent → plus ancien</option>
        <option value="old">Plus ancien → plus récent</option>
        <option value="theme">Par thème</option>
        <option value="agent">Par agent</option>
    </select>

</div>

<!-- TABLEAU -->
<table id="tableRapports">
    <thead>
        <tr>
            <th>Date</th>
            <th>Heure</th>
            <th>Type</th>
            <th>Agent</th>
            <th>Lieu</th>
            <th>Résumé</th>
            <th>Voir</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<!-- BOUTON EXPORT EXCEL -->
<button class="btn-excel" onclick="exportExcel()">📤 Exporter la sélection en Excel</button>

<!-- BOUTONS PDF / MAIL -->
<button class="btn-mail" onclick="envoyerRapportsPDF('jour')">📧 Envoyer PDF 8h → 20h</button>
<button class="btn-mail" onclick="envoyerRapportsPDF('nuit')">🌙 Envoyer PDF 20h → 8h</button>

<!-- 🔌 Connexion Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = supabase.createClient(
  "https://hwqlajdytnxavqigmzio.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cWxhamR5dG54YXZxaWdtemlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5Mzg1NjgsImV4cCI6MjA4OTUxNDU2OH0.riGzQlfEPmo9SVK9Rs_fl33DnC5RR5qd2OUhgk4Twv"
);

/* =========================
   📥 Charger les rapports depuis Supabase
   ========================= */
let rapports = [];

async function loadRapports() {
    const { data, error } = await supabase
        .from("main_courante_reports")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Erreur Supabase :", error);
        return;
    }

    // Transformer les données Supabase → format dashboard
    rapports = data.map(r => ({
        date: r.created_at.split("T")[0],
        heure: r.created_at.split("T")[1].slice(0,5),
        type: r.type_code || "inconnu",
        agent: r.agent || "N/A",
        lieu: r.site || "N/A",
        resume: r.info_generales?.slice(0,50) + "..." || "—",
        id: r.id_custom
    }));

    renderTable(rapports);
}
/* =========================
   📊 Affichage tableau + indicateurs
   ========================= */
function renderTable(data) {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    data.forEach(r => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${r.date}</td>
            <td>${r.heure}</td>
            <td>${r.type}</td>
            <td>${r.agent}</td>
            <td>${r.lieu}</td>
            <td>${r.resume}</td>
            <td><a href="rapport_view.html?id=${r.id}">Voir</a></td>
        `;

        tbody.appendChild(tr);
    });

    // Indicateurs
    document.getElementById("indTotal").textContent = data.length;

    const month = new Date().toISOString().slice(0,7);
    document.getElementById("indMonth").textContent =
        data.filter(r => r.date.startsWith(month)).length;

    document.getElementById("indCritique").textContent =
        data.filter(r => r.type === "INC").length;

    document.getElementById("indTheme").textContent =
        document.getElementById("theme").value;
}

/* =========================
   🔍 Filtres
   ========================= */
function applyFilters() {
    let filtered = [...rapports];

    const periode = document.getElementById("periode").value;
    const theme   = document.getElementById("theme").value;
    const tri     = document.getElementById("tri").value;
    const ds      = document.getElementById("dateStart").value;
    const de      = document.getElementById("dateEnd").value;

    const today = new Date().toISOString().split("T")[0];

    // Période
    if (periode === "today") {
        filtered = filtered.filter(r => r.date === today);
    }

    // Thème
    if (theme !== "all") {
        filtered = filtered.filter(r => r.type === theme);
    }

    // Tri
    if (tri === "recent") {
        filtered.sort((a,b) => (b.date + b.heure).localeCompare(a.date + a.heure));
    } 
    else if (tri === "old") {
        filtered.sort((a,b) => (a.date + a.heure).localeCompare(b.date + b.heure));
    } 
    else if (tri === "agent") {
        filtered.sort((a,b) => a.agent.localeCompare(b.agent));
    } 
    else if (tri === "theme") {
        filtered.sort((a,b) => a.type.localeCompare(b.type));
    }

    renderTable(filtered);
}

/* =========================
   📤 Export Excel (placeholder)
   ========================= */
function exportExcel() {
    alert("Export Excel à connecter.");
}

/* =========================
   🕗 Filtrage par plage horaire
   ========================= */
function getRapportsPlage(type) {
    const today = new Date().toISOString().split("T")[0];

    return rapports.filter(r => {
        if (r.date !== today) return false;

        const h = parseInt(r.heure.split(":")[0]);

        if (type === "jour") {
            return h >= 8 && h < 20;
        }

        if (type === "nuit") {
            return (h >= 20 && h <= 23) || (h >= 0 && h < 8);
        }

        return false;
    });
}

/* =========================
   🧾 Génération PDF
   ========================= */
async function genererPDFUltra(rapportsFiltrés, titre) {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");

    pdf.setFillColor(30, 60, 120);
    pdf.rect(0, 0, 210, 40, "F");

    pdf.setFontSize(20);
    pdf.setTextColor(255, 255, 255);
    pdf.text(titre, 10, 25);

    pdf.setDrawColor(77, 163, 255);
    pdf.line(10, 50, 200, 50);

    pdf.setFontSize(11);
    pdf.setTextColor(0, 0, 0);

    let y = 60;

    if (rapportsFiltrés.length === 0) {
        pdf.text("Aucun rapport dans cette plage horaire.", 10, y);
        return pdf;
    }

    rapportsFiltrés.forEach(r => {
        pdf.setFontSize(12);
        pdf.setTextColor(0, 102, 204);
        pdf.text(`• ${r.type.toUpperCase()}`, 10, y);
        y += 6;

        pdf.setFontSize(10);
        pdf.setTextColor(0, 0, 0);

        const bloc = [
            `Date : ${r.date}`,
            `Heure : ${r.heure}`,
            `Agent : ${r.agent}`,
            `Lieu : ${r.lieu}`,
            `Résumé : ${r.resume}`,
        ];

        bloc.forEach(line => {
            pdf.text(line, 15, y);
            y += 6;
        });

        y += 4;

        if (y > 260) {
            pdf.addPage();
            y = 20;
        }
    });

    return pdf;
}

/* =========================
   📧 Envoi mail PDF
   ========================= */
async function envoyerRapportsPDF(type) {
    const rapportsFiltrés = getRapportsPlage(type);

    const titre =
        type === "jour"
        ? "Rapports du jour (8h → 20h)"
        : "Rapports de nuit (20h → 8h)";

    const pdf = await genererPDFUltra(rapportsFiltrés, titre);

    const pdfBlob = pdf.output("blob");
    const pdfURL = URL.createObjectURL(pdfBlob);

    window.location.href =
        `mailto:?subject=${encodeURIComponent(titre)}` +
        `&body=${encodeURIComponent("Veuillez trouver ci-joint les rapports.")}` +
        `&attachment=${pdfURL}`;
}

/* =========================
   🚀 Lancement du dashboard
   ========================= */
loadRapports();
</script>
