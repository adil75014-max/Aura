<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gestion des rondes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { background:#0d0f14; color:#fff; font-family:system-ui; margin:0; padding:20px; }
h1 { text-align:center; color:#4da3ff; margin-bottom:30px; }
.section { background:rgba(255,255,255,0.08); padding:20px; border-radius:12px; margin-bottom:25px; border:1px solid rgba(255,255,255,0.15); }
label { display:block; margin-top:12px; font-weight:600; }
input, textarea, select { width:100%; padding:12px; margin-top:6px; border-radius:10px; border:none; background:rgba(255,255,255,0.12); color:white; }
button { margin-top:15px; padding:12px; background:#4da3ff; border:none; border-radius:10px; color:white; font-weight:600; cursor:pointer; width:100%; }
button:hover { background:#1d7be6; }
table { width:100%; border-collapse:collapse; margin-top:15px; background:rgba(255,255,255,0.06); border-radius:12px; overflow:hidden; }
th, td { padding:12px; border-bottom:1px solid rgba(255,255,255,0.12); }
th { background:rgba(255,255,255,0.12); color:#4da3ff; }
tr:hover { background:rgba(255,255,255,0.08); }
.drag { cursor:grab; }
</style>
</head>
<body>
<h1>Gestion des rondes (Superviseur)</h1>

<div class="section">
    <h2>Gestion des zones de passage</h2>
    <label>Ajouter une zone</label>
    <input type="text" id="zoneInput" placeholder="Ex : Escalier A, Local TGBT, Parking -1...">
    <button onclick="ajouterZone()">Ajouter la zone</button>
    <table><thead><tr><th>Zone</th><th>Supprimer</th></tr></thead><tbody id="zonesTable"></tbody></table>
</div>

<div class="section">
    <h2>Créer une nouvelle ronde</h2>
    <label>Nom de la ronde</label><input type="text" id="nomRonde" placeholder="Ex : Ronde ouverture matin">
    <label>Type</label>
    <select id="typeRonde">
        <option value="ronde_ouverture">Ronde d'ouverture</option>
        <option value="ronde_travaux">Ronde Travaux</option>
        <option value="rondepermisfeu">Ronde Permis feu</option>
        <option value="rondeissuessecours">Ronde Issue de secours</option>
        <option value="rondesurfacevente">Ronde Surface de vente</option>
        <option value="ronde_technique">Ronde Technique</option>
        <option value="ronde_fermeture">Ronde de fermeture</option>
    </select>
    <label>Description</label><textarea id="descRonde" placeholder="Description de la ronde..."></textarea>
    <button onclick="creerRonde()">Créer la ronde</button>
</div>

<div class="section" id="sectionPoints" style="display:none;">
    <h2>Points de passage</h2>
    <label>Zone du point</label><select id="zoneSelect"></select>
    <label>ID Balise BLE</label><input type="text" id="beaconId" placeholder="Ex : BEACON-TGBT-002">
    <button onclick="ajouterPoint()">Ajouter ce point</button>
    <table><thead><tr><th>Ordre</th><th>Zone</th><th>Balise BLE</th><th>Supprimer</th></tr></thead><tbody id="tablePoints"></tbody></table>
    <button onclick="sauvegarderRonde()">💾 Sauvegarder la ronde sur Supabase</button>
</div>

<div class="section">
    <h2>Rondes enregistrées</h2>
    <div id="listeRondes"><p>Chargement...</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabaseClient.js"></script>
<script>
let zones = [];
let ronde = { nom:"", description:"", type:"ronde_ouverture", points:[] };

// --- ZONES (stockées localement, utilisées pour la config) ---
function afficherZones() {
    const tbody=document.getElementById("zonesTable"); tbody.innerHTML="";
    zones.forEach((z,i) => { tbody.innerHTML+=`<tr><td contenteditable="true" oninput="modifierZone(${i},this.innerText)">${z}</td><td><button onclick="supprimerZone(${i})">X</button></td></tr>`; });
    remplirZonesSelect();
}
function ajouterZone() { const z=document.getElementById("zoneInput").value.trim(); if(!z){alert("Nom requis.");return;} zones.push(z); document.getElementById("zoneInput").value=""; afficherZones(); }
function modifierZone(i,nom) { zones[i]=nom.trim(); }
function supprimerZone(i) { zones.splice(i,1); afficherZones(); }
function remplirZonesSelect() { const s=document.getElementById("zoneSelect"); s.innerHTML=""; zones.forEach(z=>{const o=document.createElement("option");o.value=z;o.textContent=z;s.appendChild(o);}); }
afficherZones();

// --- RONDES ---
function creerRonde() {
    const nom=document.getElementById("nomRonde").value.trim();
    if(!nom){alert("Nom requis.");return;}
    ronde.nom=nom;
    ronde.description=document.getElementById("descRonde").value.trim();
    ronde.type=document.getElementById("typeRonde").value;
    ronde.points=[];
    document.getElementById("sectionPoints").style.display="block";
}

function ajouterPoint() {
    const zone=document.getElementById("zoneSelect").value;
    const beacon=document.getElementById("beaconId").value.trim();
    if(!zone||!beacon){alert("Zone et balise requises.");return;}
    ronde.points.push({nom:zone,beaconId:beacon});
    afficherPoints();
}

function afficherPoints() {
    const tbody=document.getElementById("tablePoints"); tbody.innerHTML="";
    ronde.points.forEach((p,i) => { tbody.innerHTML+=`<tr class="drag"><td>${i+1}</td><td>${p.nom}</td><td>${p.beaconId}</td><td><button onclick="supprimerPoint(${i})">X</button></td></tr>`; });
}
function supprimerPoint(i) { ronde.points.splice(i,1); afficherPoints(); }

async function sauvegarderRonde() {
    try {
        const { error } = await supabaseClient.from("rondes").insert({
            type: ronde.type,
            statut: "en_cours",
            observations: ronde.description,
            meta: { nom: ronde.nom, points: ronde.points.map(p=>({nom:p.nom,beaconId:p.beaconId,valide:false,horodatage:null})) }
        });
        if (error) throw error;
        showToast("✅ Ronde sauvegardée sur Supabase !");
        chargerRondesExistantes();
    } catch(e) { showToast("❌ "+e.message, true); }
}

async function chargerRondesExistantes() {
    const { data } = await supabaseClient.from("rondes").select("*").order("created_at",{ascending:false}).limit(20);
    const div=document.getElementById("listeRondes"); div.innerHTML="";
    if (!data||data.length===0) { div.innerHTML="<p>Aucune ronde enregistrée.</p>"; return; }
    data.forEach(r => {
        const el=document.createElement("div");
        el.style.cssText="background:rgba(255,255,255,0.06);padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.12);";
        const dt=new Date(r.created_at).toLocaleString("fr-FR");
        const pts=(r.meta&&r.meta.points)?r.meta.points.length:0;
        el.innerHTML=`<strong>${r.meta&&r.meta.nom||r.type}</strong> — ${r.statut} — ${pts} points — ${dt}`;
        div.appendChild(el);
    });
}
chargerRondesExistantes();
</script>
<script src="security.js"></script>
</body>
</html>
