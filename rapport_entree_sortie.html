<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Entrée & Sortie — Personnel / Société / Livraison</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="global.css">
<style>
h1 { color:var(--accent); text-align:center; margin-bottom:25px; font-size:1.8rem; }
.menu-return { display:flex; justify-content:flex-start; margin-bottom:20px; }
.menu-return button { background:var(--bg2); border:1px solid var(--border); padding:8px 16px; border-radius:10px; color:var(--accent); cursor:pointer; transition:0.25s; }
.menu-return button:hover { background:var(--accent); color:#000; }
.card { background:var(--card); border:1px solid var(--border); padding:20px; border-radius:14px; margin-bottom:25px; box-shadow:var(--shadow); }
.info { margin-bottom:8px; font-size:1rem; opacity:0.9; }
h3 { margin-top:20px; margin-bottom:8px; color:var(--accent); font-size:1.2rem; }
input, select { width:100%; padding:12px; margin-top:6px; border-radius:10px; border:1px solid var(--border); background:var(--bg2); color:var(--text); font-size:1rem; }
select option { background:var(--card); color:var(--text); }
textarea { width:100%; height:150px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:12px; color:var(--text); resize:none; margin-top:10px; }
button { margin-top:15px; padding:14px; background:linear-gradient(135deg,#7ab8ff,#4d9dff); border:none; border-radius:10px; color:#0a0f1c; cursor:pointer; width:100%; font-size:1.1rem; font-weight:700; box-shadow:0 4px 12px rgba(122,184,255,0.4); transition:0.25s; }
button:hover { transform:translateY(-2px); }
button:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
.btn-secondary { background:var(--accent); color:#000; font-weight:600; }
.hidden { display:none; }
</style>
</head>
<body>
<h1>Entrée & Sortie — Personnel / Société / Livraison</h1>
<div class="menu-return"><button onclick="location.href='index.html'">⟵ Menu</button></div>

<div class="card">
    <div class="info">👤 Agent : <span id="nom"></span></div>
    <div class="info">🎖 Statut : <span id="statut"></span></div>
    <div class="info">📅 Date : <span id="dateDuJour"></span></div>
</div>

<div class="card">
    <h3>Type d'entrée</h3>
    <select id="typeEntree">
        <option value="personnel">Personnel</option>
        <option value="societe">Société</option>
        <option value="livraison">Livraison</option>
    </select>

    <div id="blocSociete">
        <h3>Nom de la société ou employé</h3>
        <select id="societe">
            <option value="Le Bon Marché">Le Bon Marché</option>
            <option value="La Grande Épicerie Rive Gauche">La Grande Épicerie Rive Gauche</option>
            <option value="Autre">Autre (à préciser)</option>
        </select>
        <input type="text" id="autreSociete" placeholder="Nom personnalisé" class="hidden">
    </div>

    <h3 id="labelNb">Nombre de personnes</h3>
    <input type="number" id="nbPersonnes" min="1" placeholder="Ex : 3">

    <div id="blocLivraison" class="hidden">
        <h3>Société de livraison</h3>
        <select id="livraisonSociete">
            <option value="Chronopost">Chronopost</option>
            <option value="Colissimo">Colissimo</option>
            <option value="DHL">DHL</option>
            <option value="UPS">UPS</option>
            <option value="FedEx">FedEx</option>
            <option value="Autre">Autre (à préciser)</option>
        </select>
        <input type="text" id="livraisonAutre" placeholder="Nom personnalisé" class="hidden">
        <h3>Nombre de colis / palettes</h3>
        <input type="number" id="nbColis" min="1" placeholder="Ex : 12">
    </div>

    <h3>Heure d'entrée</h3><input type="time" id="heureEntree">
    <h3>Heure de sortie</h3><input type="time" id="heureSortie">
    <h3>Observations (optionnel)</h3><textarea id="observations" placeholder="Notes supplémentaires…"></textarea>

    <button id="save">💾 Enregistrer</button>
    <button class="btn-secondary" onclick="window.print()">📄 Exporter en PDF</button>
    <button class="btn-secondary" onclick="location.href='rapport_entree_sortie_ouverts.html'">📂 Voir les rapports ouverts</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabaseClient.js"></script>
<script>
document.getElementById("nom").textContent = localStorage.getItem("nom");
document.getElementById("statut").textContent = localStorage.getItem("statut");
document.getElementById("dateDuJour").textContent = new Date().toLocaleDateString("fr-FR");

document.getElementById("typeEntree").addEventListener("change", function() {
    const t = this.value;
    document.getElementById("blocSociete").classList.toggle("hidden", t==="livraison");
    document.getElementById("blocLivraison").classList.toggle("hidden", t!=="livraison");
    document.getElementById("labelNb").textContent = t==="livraison" ? "Nombre de colis / palettes" : "Nombre de personnes";
});
document.getElementById("societe").addEventListener("change", function() { document.getElementById("autreSociete").classList.toggle("hidden", this.value!=="Autre"); });
document.getElementById("livraisonSociete").addEventListener("change", function() { document.getElementById("livraisonAutre").classList.toggle("hidden", this.value!=="Autre"); });

document.getElementById("save").addEventListener("click", async () => {
    const btn = document.getElementById("save");
    btn.disabled = true; btn.textContent = "⏳ Enregistrement...";

    try {
        const type = document.getElementById("typeEntree").value;
        let entreprise = "";
        let motif = "";

        if (type === "personnel" || type === "societe") {
            entreprise = document.getElementById("societe").value;
            if (entreprise === "Autre") entreprise = document.getElementById("autreSociete").value || "Non précisé";
            motif = "personnel/société";
        } else {
            entreprise = document.getElementById("livraisonSociete").value;
            if (entreprise === "Autre") entreprise = document.getElementById("livraisonAutre").value || "Non précisé";
            motif = "livraison";
        }

        const heureEntree = document.getElementById("heureEntree").value;
        const heureSortie = document.getElementById("heureSortie").value;
        const now = new Date();
        let heureEntreeTs = null, heureSortieTs = null;
        if (heureEntree) { const [h,m] = heureEntree.split(":"); heureEntreeTs = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m).toISOString(); }
        if (heureSortie) { const [h,m] = heureSortie.split(":"); heureSortieTs = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m).toISOString(); }

        const { error } = await supabaseClient.from("rapports_entree_sortie").insert({
            type_mouvement: "entree",
            nom_personne: entreprise,
            entreprise: entreprise,
            motif: motif,
            badge_numero: null,
            zone: null,
            heure_entree: heureEntreeTs,
            heure_sortie: heureSortieTs,
            statut: heureSortie ? "cloture" : "ouvert",
            observations: document.getElementById("observations").value
        });
        if (error) throw error;
        showToast("✅ Rapport entrée/sortie enregistré !");
        setTimeout(() => location.href="index.html", 1200);
    } catch(e) {
        showToast("❌ "+e.message, true);
        btn.disabled = false; btn.textContent = "💾 Enregistrer";
    }
});
</script>
<script src="security.js"></script>
<script src="global.js"></script>
</body>
</html>
