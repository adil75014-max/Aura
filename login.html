<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<title>Aura Sentinelle LBM – Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        background: radial-gradient(circle at top left, #2b1b1b, #120b0b 50%, #050305);
        color: white;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .login-box {
        width: 90%;
        max-width: 360px;
        background: rgba(10, 5, 5, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        box-shadow: 0 3px 18px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(14px);
        overflow: hidden;
        padding-bottom: 12px;
    }

    .content {
        padding: 0;
        text-align: center;
    }

    .logo {
        width: 65%;
        max-width: 140px;
        margin: 12px auto 6px auto;
        display: block;
        border-radius: 10px;
        padding: 4px;
        box-shadow: 0 0 14px rgba(255, 140, 0, 0.4);
    }

    .header-photo {
        width: 100%;
        height: 90px;
        background: url('https://upload.wikimedia.org/wikipedia/commons/4/4c/Le_Bon_March%C3%A9_Paris.jpg');
        background-size: cover;
        background-position: center;
        filter: brightness(0.8) saturate(1.1);
    }

    .app-name {
        font-size: 0.75rem;
        opacity: 0.9;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: #ffd27f;
        margin-top: 8px;
    }

    .secure {
        font-size: 0.7rem;
        opacity: 0.7;
        margin-bottom: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }

    label {
        display: block;
        margin-top: 8px;
        font-size: 0.8rem;
        opacity: 0.9;
        text-align: left;
        width: 86%;
        margin-left: auto;
        margin-right: auto;
    }

    input {
        width: 86%;
        padding: 8px 10px;
        margin-top: 4px;
        border-radius: 7px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: white;
        font-size: 0.85rem;
    }

    button {
        margin-top: 14px;
        width: 86%;
        padding: 10px;
        background: linear-gradient(135deg, #ffb347, #ff7b47);
        border: none;
        border-radius: 8px;
        color: #1b0f08;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 700;
        box-shadow: 0 3px 12px rgba(255, 140, 0, 0.55);
    }

    .badge-hint {
        margin-top: 10px;
        font-size: 0.85rem;
        opacity: 0.8;
    }

    .error {
        margin-top: 10px;
        color: #ff6b6b;
        text-align: center;
        font-size: 0.8rem;
        display: none;
    }

    .footer {
        margin-top: 10px;
        font-size: 0.65rem;
        opacity: 0.6;
        padding-bottom: 8px;
    }
</style>
</head>

<body>

<div class="login-box">
    <div class="content">

        <!-- Logo Groupe Bon Marché -->
        <div style="
            display: flex;
            justify-content: center;
            padding: 18px 0 6px;
            background: rgba(0,0,0,0.3);
        ">
            <img src="le_bon_marche_logo.jpeg" alt="Groupe Bon Marché" style="
                width: 100px;
                height: auto;
                border-radius: 8px;
            ">
        </div>

        <img src="logo.png" class="logo">

        <div class="header-photo"></div>

        <div class="app-name">Aura Sentinelle – Main courante électronique</div>
        <div class="secure">Authentification requise</div>

        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" placeholder="Votre identifiant" autocomplete="off">

        <!-- Honeypot anti-bot — invisible pour les humains -->
        <div style="position:absolute;left:-9999px;top:-9999px;" aria-hidden="true">
            <label for="website">Website</label>
            <input type="text" id="hp_field" name="website" tabindex="-1" autocomplete="off">
        </div>

        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="Votre mot de passe" autocomplete="off">

        <button id="loginBtn" onclick="login()">Se connecter</button>

        <!-- Bouton biométrique -->
        <button id="bioBtn" onclick="loginWithBiometrics()" style="
            margin-top: 10px;
            width: 86%;
            padding: 10px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 8px;
            color: #ffd27f;
            cursor: pointer;
            font-size: 0.85rem;
        ">
            🔒 Se connecter avec empreinte digitale
        </button>

        <div class="badge-hint">Ou présentez votre badge NFC compatible Aura Sentinelle.</div>

        <div class="error" id="errorMsg"></div>

        <div class="footer">© <span id="year"></span> Aura Sentinelle LBM</div>
    </div>
</div>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

// Audit log local (security.js n'est pas chargé sur login)
function auditLog(action, detail) {
    try {
        if (typeof supabaseClient !== "undefined") {
            supabaseClient.from("security_audit").insert({
                action: action, detail: String(detail || "").substring(0, 500),
                agent: "login_page", page: "login.html",
                user_agent: navigator.userAgent.substring(0, 200),
                created_at: new Date().toISOString()
            }).then(function(){}).catch(function(){});
        }
    } catch(e) {}
}

/* ═══════════════════════════════════════════════════════
   ANTI-BRUTEFORCE — Côté client + serveur
═══════════════════════════════════════════════════════ */
var MAX_ATTEMPTS = 5;
var LOCKOUT_MS = 15 * 60 * 1000; // 15 minutes
var DELAY_BASE_MS = 1000; // Délai progressif

function getLoginAttempts() {
    try {
        var data = JSON.parse(localStorage.getItem("_login_attempts") || "{}");
        return data;
    } catch(e) { return {}; }
}

function saveLoginAttempts(data) {
    localStorage.setItem("_login_attempts", JSON.stringify(data));
}

function isLockedOut() {
    var data = getLoginAttempts();
    if (data.count >= MAX_ATTEMPTS && data.lockedUntil) {
        if (Date.now() < data.lockedUntil) {
            var remaining = Math.ceil((data.lockedUntil - Date.now()) / 60000);
            return remaining;
        }
        // Lock expiré → reset
        saveLoginAttempts({});
    }
    return 0;
}

function recordFailedAttempt() {
    var data = getLoginAttempts();
    data.count = (data.count || 0) + 1;
    data.lastAttempt = Date.now();
    if (data.count >= MAX_ATTEMPTS) {
        data.lockedUntil = Date.now() + LOCKOUT_MS;
    }
    saveLoginAttempts(data);
    return data.count;
}

function resetAttempts() {
    saveLoginAttempts({});
}

/* ═══════════════════════════════════════════════════════
   SANITISATION — Anti-injection SQL/XSS
═══════════════════════════════════════════════════════ */
function sanitizeInput(str) {
    if (!str) return "";
    return str.replace(/[<>"'`;\\\/\{\}\[\]]/g, "").trim().substring(0, 128);
}

/* ═══════════════════════════════════════════════════════
   LOGIN
═══════════════════════════════════════════════════════ */
async function login() {
    var username = sanitizeInput(document.getElementById("username").value);
    var password = document.getElementById("password").value.trim();
    var errorMsg = document.getElementById("errorMsg");
    var loginBtn = document.getElementById("loginBtn");

    errorMsg.style.display = "none";

    // Anti-bot honeypot
    var hp = document.getElementById("hp_field");
    if (hp && hp.value.length > 0) {
        auditLog("BOT_DETECTED", "honeypot filled");
        errorMsg.textContent = "Erreur de sécurité.";
        errorMsg.style.display = "block";
        return;
    }

    // Vérifier le verrouillage anti-bruteforce
    var lockMin = isLockedOut();
    if (lockMin > 0) {
        errorMsg.textContent = "⛔ Compte verrouillé. Réessayez dans " + lockMin + " minute(s).";
        errorMsg.style.display = "block";
        return;
    }

    if (!username || !password) {
        errorMsg.textContent = "Veuillez remplir tous les champs.";
        errorMsg.style.display = "block";
        return;
    }

    // Délai progressif anti-bruteforce
    var attempts = getLoginAttempts();
    var delay = (attempts.count || 0) * DELAY_BASE_MS;
    if (delay > 0) {
        loginBtn.disabled = true;
        loginBtn.textContent = "Patientez...";
        await new Promise(function(r){ setTimeout(r, delay); });
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Connexion...";

    var form = new URLSearchParams();
    form.append("username", username);
    form.append("password", password);

    try {
        var res = await fetch("https://hwqlajdytnxavqigmzio.supabase.co/functions/v1/super-action", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: form.toString()
        });

        var raw = await res.text();
        var data = null;
        try { data = JSON.parse(raw); } catch(e) {}

        if (!res.ok || !data || !data.user) {
            var failCount = recordFailedAttempt();
            var remaining = MAX_ATTEMPTS - failCount;

            // Enregistrer la tentative échouée dans Supabase
            try {
                supabaseClient.from("login_attempts").insert({
                    username: username,
                    success: false,
                    ip_hint: navigator.userAgent.substring(0, 100),
                    created_at: new Date().toISOString()
                });
            } catch(e) {}

            if (remaining <= 0) {
                errorMsg.textContent = "⛔ Trop de tentatives. Compte verrouillé 15 minutes.";
            } else {
                errorMsg.textContent = (data && data.error) || "Identifiants incorrects. " + remaining + " tentative(s) restante(s).";
            }
            errorMsg.style.display = "block";
            loginBtn.disabled = false;
            loginBtn.textContent = "Se connecter";
            return;
        }

        // Succès → reset compteur
        resetAttempts();

        // Enregistrer la connexion réussie
        try {
            supabaseClient.from("login_attempts").insert({
                username: username,
                success: true,
                ip_hint: navigator.userAgent.substring(0, 100),
                created_at: new Date().toISOString()
            });
        } catch(e) {}

        // Stockage session
        localStorage.setItem("nom", data.user.nom);
        localStorage.setItem("role", data.user.role);
        localStorage.setItem("loginTime", Date.now().toString());

        // Biométrie — stocker uniquement le username et le rôle (JAMAIS le mot de passe)
        localStorage.setItem("bio_username", username);
        localStorage.setItem("bio_role", data.user.role);

        window.location.href = "index.html";

    } catch(err) {
        errorMsg.textContent = "Erreur réseau.";
        errorMsg.style.display = "block";
        loginBtn.disabled = false;
        loginBtn.textContent = "Se connecter";
    }
}

async function loginWithBiometrics() {
    var errorMsg = document.getElementById("errorMsg");
    errorMsg.style.display = "none";

    var savedNom = localStorage.getItem("bio_username");
    var savedRole = localStorage.getItem("bio_role");

    if (!savedNom) {
        errorMsg.textContent = "Aucune session biométrique. Connectez-vous d'abord avec votre mot de passe.";
        errorMsg.style.display = "block";
        return;
    }

    try {
        // Déclencher la vérification biométrique
        await navigator.credentials.get({
            publicKey: {
                challenge: new Uint8Array(32),
                timeout: 60000,
                userVerification: "required"
            }
        });

        // Biométrie réussie → restaurer la session
        localStorage.setItem("nom", savedNom);
        localStorage.setItem("role", savedRole || "agent");
        localStorage.setItem("loginTime", Date.now().toString());
        resetAttempts();

        window.location.href = "index.html";

    } catch(err) {
        errorMsg.textContent = "Authentification biométrique annulée ou indisponible.";
        errorMsg.style.display = "block";
    }
}
</script>

</body>
</html>
