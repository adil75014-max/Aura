<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant — Créer une vérification</title>
<style>
  :root{ --bg:#f4f6fb; --card:#fff; --line:#e2e8f0; --ink:#0f172a; --muted:#64748b; --accent:#7c3aed; --ok:#16a34a; }
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI',sans-serif;}
  body{background:var(--bg);color:var(--ink);padding:16px;max-width:640px;margin:auto;}
  header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  header a{text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink);font-weight:700;}
  h1{font-size:1.3rem;}
  .steps{display:flex;gap:6px;margin:14px 0 18px;}
  .steps .s{flex:1;height:6px;border-radius:99px;background:#e5ddf7;}
  .steps .s.on{background:var(--accent);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(15,23,42,.04);}
  .stepnum{display:inline-block;background:var(--accent);color:#fff;font-weight:800;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;margin-right:8px;}
  h2{font-size:1.05rem;margin-bottom:4px;}
  .hint{color:var(--muted);font-size:.85rem;margin-bottom:14px;}
  label{display:block;font-weight:700;font-size:.85rem;margin:12px 0 5px;}
  input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font-size:16px;background:#fff;color:var(--ink);}
  .checkline{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600;font-size:.9rem;color:var(--ink);}
  .checkline input{width:auto;}
  .btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;font-size:1.02rem;font-weight:800;cursor:pointer;margin-top:8px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-ok{background:var(--ok);color:#fff;}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .row2{display:flex;gap:10px;}
  .row2 .btn{margin-top:12px;}
  .pt{display:flex;align-items:center;gap:10px;background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-top:9px;}
  .pt .n{background:var(--accent);color:#fff;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;font-weight:800;font-size:.8rem;flex-shrink:0;}
  .pt .info{flex:1;min-width:0;}
  .pt .info b{display:block;}
  .pt .info small{color:var(--muted);font-size:.78rem;}
  .pt .del{background:#fee2e2;color:#dc2626;border:none;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:800;}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:99;max-width:92%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25);}
  .recap b{color:var(--muted);font-weight:600;}
  .hidden{display:none;}
</style>
</head>
<body>
<header>
  <a href="verifications_admin.html">⟵</a>
  <h1>🧭 Assistant — Créer une vérification</h1>
</header>
<div class="steps"><div class="s on" id="s1"></div><div class="s" id="s2"></div><div class="s" id="s3"></div></div>

<!-- ÉTAPE 1 -->
<div class="card" id="step1">
  <h2><span class="stepnum">1</span> Le modèle</h2>
  <div class="hint">Donnez un nom au modèle de vérification.</div>
  <label>Nom du modèle</label>
  <input id="nom" placeholder="Ex : J1 Baie SSI, Vérification EPI, Sprinkler…">
  <button class="btn btn-primary" onclick="toStep2()">Continuer →</button>
</div>

<!-- ÉTAPE 2 -->
<div class="card hidden" id="step2">
  <h2><span class="stepnum">2</span> Les points à vérifier</h2>
  <div class="hint">Ajoutez chaque élément à contrôler, un par un.</div>
  <label>Quoi vérifier ?</label>
  <input id="cpLabel" placeholder="Ex : État de l'extincteur, Voyant défaut…">
  <label>Où ? (facultatif)</label>
  <input id="cpZone" placeholder="Ex : PC Sécurité, Niveau -1…">
  <label>Type de réponse</label>
  <select id="cpType"></select>
  <div class="checkline"><input type="checkbox" id="cpReq" checked> Réponse obligatoire</div>
  <button class="btn btn-ghost" onclick="ajouterPoint()">+ Ajouter cet élément</button>
  <div id="listePoints"></div>
  <div class="row2">
    <button class="btn btn-ghost" onclick="toStep1()">← Retour</button>
    <button class="btn btn-primary" onclick="toStep3()">Continuer →</button>
  </div>
</div>

<!-- ÉTAPE 3 -->
<div class="card hidden" id="step3">
  <h2><span class="stepnum">3</span> Vérification</h2>
  <div class="hint">Relisez, puis créez le modèle.</div>
  <div class="recap" id="recap"></div>
  <div class="row2">
    <button class="btn btn-ghost" onclick="toStep2()">← Retour</button>
    <button class="btn btn-ok" id="btnSave" onclick="enregistrer()">💾 Créer le modèle</button>
  </div>
</div>

<script src="vendor/supabase.js" crossorigin="anonymous"></script>
<script src="supabaseClient.js"></script>
<script src="tenant.js"></script>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function genId(){ try{return crypto.randomUUID();}catch(_){return "cp_"+Date.now()+"_"+Math.floor(Math.random()*1e4);} }

/* Types simplifiés (mappés vers les types réels de verification_agent.html) */
const REP_TYPES = [
  { ui:"conforme", label:"✅ Conforme / Non conforme", real:"menu",   options:["Conforme","Non conforme","Sans objet"] },
  { ui:"ouinon",   label:"⊙ Oui / Non",                real:"ouinon", options:[] },
  { ui:"texte",    label:"✎ Texte",                     real:"texte",  options:[] },
  { ui:"nombre",   label:"# Nombre",                    real:"nombre", options:[] },
  { ui:"photo",    label:"🖼 Photo",                    real:"photo",  options:[] }
];
document.getElementById("cpType").innerHTML = REP_TYPES.map(t=>`<option value="${t.ui}">${t.label}</option>`).join("");

let points = [];

function showStep(n){
  [1,2,3].forEach(i=>document.getElementById("step"+i).classList.toggle("hidden",i!==n));
  [1,2,3].forEach(i=>document.getElementById("s"+i).classList.toggle("on",i<=n));
  window.scrollTo({top:0,behavior:"smooth"});
}
function toStep1(){ showStep(1); }
function toStep2(){
  if(!document.getElementById("nom").value.trim()){ toast("⚠️ Donnez un nom au modèle"); return; }
  showStep(2); renderPoints();
}
function toStep3(){
  if(points.length===0){ toast("⚠️ Ajoutez au moins un élément"); return; }
  const nom=esc(document.getElementById("nom").value.trim());
  document.getElementById("recap").innerHTML =
    `<p style="margin-bottom:6px;"><b>Modèle :</b> ${nom}</p>
     <p style="margin-bottom:10px;"><b>Éléments :</b> ${points.length}</p>` +
    points.map((p,i)=>`<div class="pt"><span class="n">${i+1}</span><div class="info"><b>${esc(p.label)}</b><small>${esc(REP_TYPES.find(t=>t.real===p.type&&(!t.options.length||t.options.length)&&t)?.label||p.type)}${p.zone?" · "+esc(p.zone):""}${p.required?" · obligatoire":""}</small></div></div>`).join("");
  showStep(3);
}

function ajouterPoint(){
  const label=document.getElementById("cpLabel").value.trim();
  const zone=document.getElementById("cpZone").value.trim();
  const ui=document.getElementById("cpType").value;
  const req=document.getElementById("cpReq").checked;
  if(!label){ toast("⚠️ Indiquez quoi vérifier"); return; }
  const t=REP_TYPES.find(x=>x.ui===ui)||REP_TYPES[0];
  points.push({ id:genId(), type:t.real, label, zone, required:req, options:t.options.slice(), _ui:t.ui });
  document.getElementById("cpLabel").value=""; document.getElementById("cpZone").value=""; document.getElementById("cpReq").checked=true;
  document.getElementById("cpLabel").focus();
  renderPoints();
}
function supprimerPoint(i){ points.splice(i,1); renderPoints(); }
function renderPoints(){
  const box=document.getElementById("listePoints");
  box.innerHTML = points.map((p,i)=>{
    const tl=(REP_TYPES.find(t=>t.ui===p._ui)||{}).label||p.type;
    return `<div class="pt"><span class="n">${i+1}</span><div class="info"><b>${esc(p.label)}</b><small>${esc(tl)}${p.zone?" · "+esc(p.zone):""}${p.required?" · obligatoire":""}</small></div><button class="del" onclick="supprimerPoint(${i})">✕</button></div>`;
  }).join("");
}

async function enregistrer(){
  const btn=document.getElementById("btnSave"); btn.disabled=true; btn.textContent="Enregistrement…";
  try{
    const { data:existing } = await supabaseClient.from("verifications_types").select("ordre").order("ordre",{ascending:false}).limit(1);
    const ordre = (existing && existing.length) ? (existing[0].ordre||0)+1 : 1;
    const checkpoints = points.map(p=>({ id:p.id, type:p.type, label:p.label, zone:p.zone||"", required:!!p.required, options:p.options||[] }));
    const { error } = await supabaseClient.from("verifications_types").insert({
      label: document.getElementById("nom").value.trim(),
      ordre: ordre,
      checkpoints: checkpoints
    });
    if(error) throw error;
    toast("✅ Modèle créé !");
    setTimeout(()=>{ location.href="verifications_admin.html"; }, 1200);
  }catch(e){
    toast("❌ "+(e.message||e)); btn.disabled=false; btn.textContent="💾 Créer le modèle";
  }
}
</script>
<script src="security.js"></script>
<script src="global.js"></script>
</body>
</html>
