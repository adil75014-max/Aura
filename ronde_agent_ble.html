<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ronde agent — NFC / BLE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0e17;color:#e0e4ef;font-family:'DM Sans',system-ui,sans-serif;padding:16px 16px 80px}

.header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-btn{background:rgba(77,163,255,0.12);border:1px solid rgba(77,163,255,0.3);color:#4da3ff;padding:8px 14px;border-radius:10px;cursor:pointer;font:600 .9rem 'DM Sans';transition:.2s}
.back-btn:hover{background:#4da3ff;color:#0b0e17}
.header h1{font-size:1.4rem;color:#4da3ff;letter-spacing:-.5px;flex:1}

.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:20px;margin-bottom:16px}
.card h2{font-size:1.05rem;color:#4da3ff;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* SCAN MODE SELECTOR */
.mode-row{display:flex;gap:8px;margin-bottom:16px}
.mode-btn{flex:1;padding:14px 10px;border-radius:12px;text-align:center;cursor:pointer;font:600 .9rem 'DM Sans';border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:#8899bb;transition:.25s}
.mode-btn.active{border-color:#4da3ff;background:rgba(77,163,255,0.1);color:#4da3ff;box-shadow:0 0 16px rgba(77,163,255,0.15)}
.mode-btn:hover{border-color:rgba(77,163,255,0.4)}
.mode-btn .mode-icon{font-size:1.6rem;display:block;margin-bottom:4px}

/* PROGRESS */
.progress-wrap{margin:12px 0 6px}
.progress-bar-bg{background:rgba(255,255,255,0.08);border-radius:99px;height:12px;overflow:hidden}
.progress-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#4da3ff,#00d4ff);border-radius:99px;transition:width .4s ease}
.progress-text{text-align:right;font-size:.8rem;color:#6b7a99;margin-top:4px}

/* SCAN BUTTON */
.scan-btn{width:100%;padding:16px;border:none;border-radius:14px;font:700 1.1rem 'DM Sans';cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.scan-btn.idle{background:linear-gradient(135deg,#4da3ff,#2b7de9);color:#fff;box-shadow:0 4px 20px rgba(77,163,255,0.3)}
.scan-btn.scanning{background:linear-gradient(135deg,#00c878,#00a060);color:#fff;animation:pulse 1.5s infinite}
.scan-btn:hover{transform:translateY(-1px)}
@keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(0,200,120,0.3)}50%{box-shadow:0 0 30px rgba(0,200,120,0.6)}}

/* NFC TAP ANIMATION */
.nfc-tap-zone{display:none;text-align:center;padding:30px;margin:16px 0}
.nfc-tap-zone.active{display:block}
.nfc-circle{width:120px;height:120px;border-radius:50%;border:3px dashed #4da3ff;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:3rem;animation:nfcPulse 2s infinite}
@keyframes nfcPulse{0%,100%{border-color:rgba(77,163,255,0.3);transform:scale(1)}50%{border-color:#4da3ff;transform:scale(1.05)}}
.nfc-tap-text{color:#8899bb;font-size:.95rem}

/* POINTS */
.point{padding:14px;border-radius:12px;margin-bottom:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:12px;transition:.2s}
.point.current{border-color:#4da3ff;background:rgba(77,163,255,0.06);box-shadow:0 0 12px rgba(77,163,255,0.15)}
.point.done{border-color:rgba(0,200,120,0.4);background:rgba(0,200,120,0.06)}
.point-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.point.pending .point-num{background:rgba(255,255,255,0.08);color:#6b7a99}
.point.current .point-num{background:#4da3ff;color:#fff}
.point.done .point-num{background:#00c878;color:#fff}
.point-info{flex:1;min-width:0}
.point-name{font-weight:600;font-size:.95rem}
.point-detail{font-size:.8rem;color:#6b7a99;margin-top:2px}
.point-tag{font-size:.7rem;padding:2px 8px;border-radius:999px;font-weight:600}
.tag-nfc{background:rgba(77,163,255,0.15);color:#4da3ff}
.tag-ble{background:rgba(255,180,50,0.15);color:#ffb432}
.point-actions{flex-shrink:0}
.btn-validate{padding:6px 12px;border:1px solid rgba(0,200,120,0.4);background:rgba(0,200,120,0.1);color:#00c878;border-radius:8px;font:600 .8rem 'DM Sans';cursor:pointer}
.btn-validate:hover{background:#00c878;color:#fff}

/* LOG */
.log{font-size:.8rem;max-height:180px;overflow-y:auto;background:rgba(0,0,0,0.3);padding:12px;border-radius:10px;margin-top:8px}
.log-line{margin-bottom:4px;color:#8899bb;line-height:1.4}
.log-line strong{color:#4da3ff}
.log-line.success strong{color:#00c878}
.log-line.error strong{color:#f87171}

/* COMMENT */
textarea{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#e0e4ef;font:0.9rem 'DM Sans';min-height:60px;resize:vertical}
input[type="file"]{color:#8899bb;font-size:.85rem;margin:6px 0}

.btn{padding:12px 16px;border:none;border-radius:10px;font:600 .95rem 'DM Sans';cursor:pointer;width:100%;transition:.2s;margin-top:10px}
.btn-primary{background:linear-gradient(135deg,#4da3ff,#2b7de9);color:#fff}
.btn-secondary{background:rgba(255,255,255,0.08);color:#8899bb;border:1px solid rgba(255,255,255,0.12)}

/* MODAL */
.modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);display:none;justify-content:center;align-items:center;padding:16px;z-index:999}
.modal-bg.active{display:flex}
.modal-box{background:#141824;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.modal-box h2{color:#4da3ff;margin-bottom:16px}
</style>
</head>
<body>

<div class="header">
    <button class="back-btn" onclick="location.href='index.html'">⟵</button>
    <h1>Ronde en cours</h1>
</div>

<!-- INFOS RONDE -->
<div class="card">
    <h2><span style="font-size:1.3rem">🛡</span> <span id="rondeNom">Chargement…</span></h2>
    <div style="font-size:.9rem;color:#6b7a99;margin-bottom:12px" id="rondeDesc"></div>

    <div class="progress-wrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
        <div class="progress-text" id="progressText">0 / 0</div>
    </div>
</div>

<!-- MODE DE SCAN -->
<div class="card">
    <h2><span style="font-size:1.3rem">📡</span> Mode de validation</h2>
    <div class="mode-row">
        <div class="mode-btn active" id="modeNFC" onclick="setMode('nfc')">
            <span class="mode-icon">📱</span> NFC
        </div>
        <div class="mode-btn" id="modeBLE" onclick="setMode('ble')">
            <span class="mode-icon">📡</span> BLE
        </div>
        <div class="mode-btn" id="modeManuel" onclick="setMode('manuel')">
            <span class="mode-icon">✋</span> Manuel
        </div>
    </div>

    <!-- NFC TAP ZONE -->
    <div class="nfc-tap-zone active" id="nfcZone">
        <div class="nfc-circle">📱</div>
        <div class="nfc-tap-text" id="nfcStatus">Appuyez sur « Scanner » puis approchez le pointeau NFC</div>
    </div>

    <button class="scan-btn idle" id="btnScan" onclick="toggleScan()">
        ▶ Démarrer le scan
    </button>
</div>

<!-- POINTS DE PASSAGE -->
<div class="card">
    <h2><span style="font-size:1.3rem">📍</span> Points de passage</h2>
    <div id="pointsList"></div>
</div>

<!-- JOURNAL -->
<div class="card">
    <h2><span style="font-size:1.3rem">📝</span> Journal</h2>
    <div class="log" id="log"></div>
</div>

<!-- COMMENTAIRE / MEDIA -->
<div class="card">
    <h2><span style="font-size:1.3rem">💬</span> Commentaire & médias</h2>
    <textarea id="commentaire" placeholder="Ajouter un commentaire…"></textarea>
    <label style="display:block;margin-top:8px;font-size:.85rem;color:#6b7a99">📸 Photos / 🎥 Vidéos</label>
    <input type="file" id="medias" accept="image/*,video/*" multiple>
    <button class="btn btn-secondary" onclick="ajouterCommentaire()">Ajouter au journal</button>
</div>

<!-- RAPPORT -->
<div class="card">
    <button class="btn btn-primary" onclick="ouvrirRapport()">📋 Rapport final</button>
</div>

<!-- MODAL RAPPORT -->
<div class="modal-bg" id="modalRapport" onclick="if(event.target===this)fermerRapport()">
    <div class="modal-box">
        <h2>📋 Rapport de ronde</h2>
        <div id="rapportContent"></div>
        <button class="btn btn-primary" onclick="exportPDF()" style="margin-top:16px">📄 Exporter PDF</button>
        <button class="btn btn-secondary" onclick="fermerRapport()">Fermer</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabaseClient.js"></script>
<script>
if(typeof showToast!=="function") window.showToast=function(m){alert(m)};

/* ============================================================
   STATE
============================================================ */
let rondeCourante = null;
let rondeDbId = null;
let indexCourant = 0;
let scanActif = false;
let scanMode = "nfc";
let bleScanHandle = null;
let ndefReader = null;

/* ============================================================
   CHARGEMENT DE LA RONDE
============================================================ */
async function chargerRonde() {
    const { data } = await supabaseClient
        .from("rondes")
        .select("*")
        .eq("statut", "en_cours")
        .order("created_at", { ascending: false })
        .limit(1);

    if (data && data.length > 0) {
        const r = data[0];
        rondeDbId = r.id;
        rondeCourante = {
            nom: (r.meta && r.meta.nom) || r.type || "Ronde",
            description: r.observations || "",
            type: r.type,
            points: (r.meta && r.meta.points) || []
        };
        logMsg("Ronde chargée : " + rondeCourante.nom);
    } else {
        rondeCourante = { nom: "Aucune ronde en cours", description: "Créez une ronde depuis la page Admin.", type: "", points: [] };
        logMsg("Aucune ronde en cours trouvée.", "error");
    }

    document.getElementById("rondeNom").textContent = rondeCourante.nom;
    document.getElementById("rondeDesc").textContent = rondeCourante.description;
    indexCourant = trouverProchain();
    afficherPoints();
    majProgression();

    // Auto-detect best mode
    if (rondeCourante.points.some(p => p.tagType === "nfc")) setMode("nfc");
    else if (rondeCourante.points.some(p => p.tagType === "ble")) setMode("ble");
}

function trouverProchain() {
    for (let i = 0; i < rondeCourante.points.length; i++) {
        if (!rondeCourante.points[i].valide) return i;
    }
    return rondeCourante.points.length;
}

/* ============================================================
   MODE DE SCAN
============================================================ */
function setMode(m) {
    scanMode = m;
    document.getElementById("modeNFC").classList.toggle("active", m === "nfc");
    document.getElementById("modeBLE").classList.toggle("active", m === "ble");
    document.getElementById("modeManuel").classList.toggle("active", m === "manuel");
    document.getElementById("nfcZone").classList.toggle("active", m === "nfc");

    if (scanActif) stopScan();

    // Update button label
    const btn = document.getElementById("btnScan");
    if (m === "manuel") {
        btn.style.display = "none";
    } else {
        btn.style.display = "";
        btn.textContent = m === "nfc" ? "▶ Scanner NFC" : "▶ Scanner BLE";
    }
}

/* ============================================================
   SCAN — TOGGLE
============================================================ */
function toggleScan() {
    if (scanActif) stopScan();
    else startScan();
}

async function startScan() {
    if (scanMode === "nfc") await startNFC();
    else if (scanMode === "ble") await startBLE();
}

function stopScan() {
    scanActif = false;
    const btn = document.getElementById("btnScan");
    btn.className = "scan-btn idle";
    btn.textContent = scanMode === "nfc" ? "▶ Scanner NFC" : "▶ Scanner BLE";

    if (bleScanHandle && bleScanHandle.active) bleScanHandle.stop();
    document.getElementById("nfcStatus").textContent = "Scan arrêté.";
    logMsg("Scan arrêté.");
}

/* ============================================================
   NFC SCAN (GuardTek-style)
============================================================ */
async function startNFC() {
    if (!("NDEFReader" in window)) {
        document.getElementById("nfcStatus").textContent = "⚠️ NFC non supporté. Utilisez le mode Manuel.";
        logMsg("NFC non disponible sur cet appareil.", "error");
        return;
    }

    try {
        ndefReader = new NDEFReader();
        await ndefReader.scan();
        scanActif = true;

        const btn = document.getElementById("btnScan");
        btn.className = "scan-btn scanning";
        btn.textContent = "⏹ Arrêter le scan NFC";

        document.getElementById("nfcStatus").textContent = "📡 En attente… Approchez un pointeau NFC";
        logMsg("Scan NFC démarré — approchez un tag.");

        ndefReader.onreading = (event) => {
            const uid = event.serialNumber || "";
            logMsg(`Tag NFC détecté : ${uid}`);
            document.getElementById("nfcStatus").textContent = "✅ Tag détecté : " + uid;
            matchAndValidate(uid, "nfc");
        };

        ndefReader.onreadingerror = () => {
            logMsg("Erreur lecture NFC — réessayez.", "error");
        };
    } catch (e) {
        logMsg("Erreur NFC : " + e.message, "error");
        document.getElementById("nfcStatus").textContent = "❌ Erreur : " + e.message;
    }
}

/* ============================================================
   BLE SCAN
============================================================ */
async function startBLE() {
    if (!navigator.bluetooth || !navigator.bluetooth.requestLEScan) {
        logMsg("BLE non supporté. Utilisez NFC ou Manuel.", "error");
        return;
    }

    try {
        bleScanHandle = await navigator.bluetooth.requestLEScan({ acceptAllAdvertisements: true });
        scanActif = true;

        const btn = document.getElementById("btnScan");
        btn.className = "scan-btn scanning";
        btn.textContent = "⏹ Arrêter le scan BLE";

        logMsg("Scan BLE démarré.");

        navigator.bluetooth.addEventListener("advertisementreceived", onBLEAdvert);
    } catch (e) {
        logMsg("Erreur BLE : " + e.message, "error");
    }
}

function onBLEAdvert(event) {
    if (!scanActif) return;
    const id = event.device && event.device.id ? event.device.id : "";
    const name = event.device && event.device.name ? event.device.name : "";
    const rssi = event.rssi;

    if (rssi < -80) return; // Trop loin

    const identifier = name || id;
    matchAndValidate(identifier, "ble", rssi);
}

/* ============================================================
   MATCHING — cherche le tag parmi les points non validés
============================================================ */
function matchAndValidate(tagId, type, rssi) {
    if (!rondeCourante || !rondeCourante.points.length) return;

    // Chercher le tag dans TOUS les points non validés (pas juste le courant)
    const normalizedTag = tagId.toLowerCase().replace(/[:\-\s]/g, "");

    for (let i = 0; i < rondeCourante.points.length; i++) {
        const p = rondeCourante.points[i];
        if (p.valide) continue;

        const normalizedPoint = (p.tagId || "").toLowerCase().replace(/[:\-\s]/g, "");

        if (normalizedTag === normalizedPoint ||
            normalizedTag.includes(normalizedPoint) ||
            normalizedPoint.includes(normalizedTag)) {

            validerPoint(i, rssi);
            return;
        }
    }

    logMsg(`Tag « ${tagId} » non reconnu pour cette ronde.`);
}

/* ============================================================
   VALIDATION D'UN POINT
============================================================ */
async function validerPoint(index, rssi) {
    const p = rondeCourante.points[index];
    if (p.valide) return;

    p.valide = true;
    p.horodatage = new Date().toLocaleString("fr-FR");
    if (rssi !== undefined) p.rssi = rssi;

    logMsg(`✅ Point validé : « ${p.nom} »`, "success");

    // Vibration feedback
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

    await sauvegarderRonde();
    indexCourant = trouverProchain();
    afficherPoints();
    majProgression();

    // Ronde terminée ?
    if (indexCourant >= rondeCourante.points.length) {
        logMsg("🎉 Ronde terminée !", "success");
        stopScan();
        if (rondeDbId) {
            await supabaseClient.from("rondes").update({
                statut: "terminee",
                fin_at: new Date().toISOString()
            }).eq("id", rondeDbId);
        }
        showToast("✅ Ronde terminée et enregistrée !");
    }
}

/* Validation manuelle (mode Manuel) */
async function validerManuellement(index) {
    if (!confirm(`Valider manuellement « ${rondeCourante.points[index].nom} » ?`)) return;
    rondeCourante.points[index].validation_manuelle = true;
    await validerPoint(index);
}

/* ============================================================
   SAUVEGARDE SUPABASE
============================================================ */
async function sauvegarderRonde() {
    if (!rondeDbId) return;
    try {
        await supabaseClient.from("rondes").update({
            observations: rondeCourante.description,
            meta: { nom: rondeCourante.nom, points: rondeCourante.points }
        }).eq("id", rondeDbId);
    } catch (e) {
        console.warn("Erreur sauvegarde ronde :", e);
    }
}

/* ============================================================
   AFFICHAGE
============================================================ */
function afficherPoints() {
    const div = document.getElementById("pointsList");
    div.innerHTML = "";

    if (!rondeCourante || rondeCourante.points.length === 0) {
        div.innerHTML = '<div style="text-align:center;color:#4a5578;padding:20px">Aucun point de passage.</div>';
        return;
    }

    rondeCourante.points.forEach((p, i) => {
        const status = p.valide ? "done" : (i === indexCourant ? "current" : "pending");
        const tagIcon = p.tagType === "nfc" ? "📱" : (p.tagType === "ble" ? "📡" : "🏷");
        const tagClass = p.tagType === "nfc" ? "tag-nfc" : "tag-ble";

        let detail = "";
        if (p.valide && p.horodatage) {
            detail = `✅ ${p.horodatage}` + (p.validation_manuelle ? " (manuel)" : "");
        } else {
            detail = `${tagIcon} ${p.tagId || "—"}`;
        }

        const manualBtn = (!p.valide && scanMode === "manuel")
            ? `<button class="btn-validate" onclick="validerManuellement(${i})">✓</button>`
            : "";

        div.innerHTML += `
            <div class="point ${status}">
                <div class="point-num">${i + 1}</div>
                <div class="point-info">
                    <div class="point-name">${p.nom} <span class="point-tag ${tagClass}">${(p.tagType||"").toUpperCase()}</span></div>
                    <div class="point-detail">${detail}</div>
                </div>
                <div class="point-actions">${manualBtn}</div>
            </div>
        `;
    });
}

function majProgression() {
    if (!rondeCourante) return;
    const total = rondeCourante.points.length;
    const valides = rondeCourante.points.filter(p => p.valide).length;
    const pct = total === 0 ? 0 : Math.round((valides / total) * 100);
    document.getElementById("progressBar").style.width = pct + "%";
    document.getElementById("progressText").textContent = `${valides} / ${total} points validés — ${pct}%`;
}

/* ============================================================
   JOURNAL
============================================================ */
function logMsg(msg, type = "") {
    const div = document.getElementById("log");
    const line = document.createElement("div");
    line.className = "log-line" + (type ? " " + type : "");
    line.innerHTML = `<strong>[${new Date().toLocaleTimeString("fr-FR")}]</strong> ${msg}`;
    div.prepend(line);
}

async function ajouterCommentaire() {
    const txt = document.getElementById("commentaire").value.trim();
    if (!txt) return;
    logMsg(`💬 ${txt}`);

    // Rattacher au point courant
    const point = rondeCourante.points[indexCourant] || rondeCourante.points[rondeCourante.points.length - 1];
    if (point) {
        if (!point.commentaires) point.commentaires = [];
        point.commentaires.push({ texte: txt, date: new Date().toLocaleString("fr-FR") });
        await sauvegarderRonde();
    }

    document.getElementById("commentaire").value = "";
    document.getElementById("medias").value = "";
}

/* ============================================================
   RAPPORT FINAL
============================================================ */
function ouvrirRapport() {
    if (!rondeCourante) return;
    const pts = rondeCourante.points;
    const total = pts.length;
    const valides = pts.filter(p => p.valide).length;

    let html = `
        <p><strong>Ronde :</strong> ${rondeCourante.nom}</p>
        <p><strong>Type :</strong> ${rondeCourante.type}</p>
        <p><strong>Progression :</strong> ${valides}/${total} points</p>
        <p><strong>Agent :</strong> ${localStorage.getItem("nom") || "—"}</p>
        <hr style="border-color:rgba(255,255,255,0.1);margin:12px 0">
    `;

    pts.forEach((p, i) => {
        const icon = p.valide ? "✅" : "❌";
        const mode = p.validation_manuelle ? "(validation manuelle)" : "";
        html += `<div style="margin-bottom:12px">
            <strong style="color:#4da3ff">${i + 1}. ${p.nom}</strong> ${icon} ${mode}<br>
            <span style="color:#6b7a99;font-size:.85rem">
                ${p.valide ? "Validé le " + p.horodatage : "Non validé"}
                ${p.tagType ? " — " + p.tagType.toUpperCase() + " : " + (p.tagId || "") : ""}
            </span>`;

        if (p.commentaires && p.commentaires.length) {
            p.commentaires.forEach(c => {
                html += `<div style="margin-top:4px;padding:6px 10px;background:rgba(255,255,255,0.04);border-radius:6px;font-size:.85rem">
                    💬 ${c.texte} <span style="color:#6b7a99;font-size:.75rem">(${c.date})</span>
                </div>`;
            });
        }
        html += `</div>`;
    });

    document.getElementById("rapportContent").innerHTML = html;
    document.getElementById("modalRapport").classList.add("active");
}

function fermerRapport() { document.getElementById("modalRapport").classList.remove("active"); }

async function exportPDF() {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");
    const M = 10;
    let y = 20;

    pdf.setFillColor(15, 20, 35);
    pdf.rect(0, 0, 210, 40, "F");
    pdf.setFontSize(18);
    pdf.setTextColor(77, 163, 255);
    pdf.text("Rapport de ronde", M, 28);

    y = 50;
    pdf.setFontSize(10);
    pdf.setTextColor(0);

    const lines = [
        `Ronde : ${rondeCourante.nom}`,
        `Type : ${rondeCourante.type}`,
        `Agent : ${localStorage.getItem("nom") || "—"}`,
        `Date : ${new Date().toLocaleString("fr-FR")}`,
        `Progression : ${rondeCourante.points.filter(p => p.valide).length} / ${rondeCourante.points.length}`
    ];
    lines.forEach(l => { pdf.text(l, M, y); y += 6; });
    y += 4;

    rondeCourante.points.forEach((p, i) => {
        if (y > 270) { pdf.addPage(); y = 20; }
        pdf.setFontSize(11);
        pdf.setTextColor(0, 80, 180);
        pdf.text(`${i + 1}. ${p.nom}`, M, y); y += 5;
        pdf.setFontSize(9);
        pdf.setTextColor(60);
        pdf.text(`Statut : ${p.valide ? "Validé" : "Non validé"}${p.horodatage ? " — " + p.horodatage : ""}`, M + 5, y); y += 5;
        pdf.text(`Tag : ${(p.tagType || "").toUpperCase()} ${p.tagId || ""}`, M + 5, y); y += 5;
        if (p.commentaires) {
            p.commentaires.forEach(c => {
                pdf.text(`💬 ${c.texte}`, M + 5, y); y += 5;
            });
        }
        y += 3;
    });

    pdf.setFontSize(8);
    pdf.setTextColor(120);
    pdf.text("LBM Sécurité — SEGEP RG", M, 290);
    pdf.save(`Ronde_${rondeCourante.nom.replace(/[^a-zA-Z0-9]/g, "_")}_${Date.now()}.pdf`);
    showToast("📄 PDF exporté");
}
