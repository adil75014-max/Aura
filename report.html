<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rapport - LBM Sécurité</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 🎨 Design global -->
<link rel="stylesheet" href="global.css">

<style>
/* 🎨 Centrage global */
body {
    display: flex;
    justify-content: center;
    padding: 20px;
}

.page-container {
    width: 100%;
    max-width: 700px;
}

/* 🎨 Titres */
h1 {
    text-align: center;
    margin-bottom: 25px;
    color: var(--accent);
    font-size: 1.7rem;
    font-weight: 600;
}

/* 🎨 Bouton menu */
.menu-return {
    margin-bottom: 20px;
}

.menu-return button {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 10px;
    color: var(--accent);
    cursor: pointer;
    transition: 0.25s;
}

.menu-return button:hover {
    background: var(--accent);
    color: #000;
}

/* 🎨 Sections */
.section {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
}

.section h2 {
    color: var(--accent);
    margin-bottom: 10px;
}

/* 🎨 Inputs */
textarea, input[type="text"], input[type="time"], select, input[type="file"] {
    width: 100%;
    padding: 10px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    margin-top: 8px;
    font-size: 0.9rem;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

/* 🎨 Bouton principal */
.btn {
    background: var(--accent);
    border: none;
    padding: 12px 16px;
    border-radius: 10px;
    color: #000;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-top: 10px;
}

.btn:hover {
    opacity: 0.85;
}
</style>
</head>

<body>

<div class="page-container">

<h1>Rapport</h1>

<!-- Bouton menu -->
<div class="menu-return">
    <button onclick="goMenu()">⟵ Menu</button>
</div>

<!-- Sélecteur de site (version simple & propre) -->
<label><strong>Site :</strong></label>
<select id="reportSite">
    <option value="">Sélectionner un site</option>
    <option value="Le Bon Marché">Le Bon Marché</option>
    <option value="La Grande Épicerie Rive Gauche">La Grande Épicerie Rive Gauche</option>
    <option value="Moët Hennessy">Moët Hennessy</option>
    <option value="Magasin 3 – 115 Rue du Bac">Magasin 3 – 115 Rue du Bac</option>
    <option value="La Grande Épicerie Rive Droite">La Grande Épicerie Rive Droite</option>
    <option value="Bagneux">Bagneux</option>
</select>

<!-- Infos automatiques -->
<div class="section">
    <h2>Informations automatiques</h2>

    <p><strong>ID :</strong> <span id="reportId"></span></p>
    <p><strong>Date :</strong> <span id="reportDate"></span></p>
    <p><strong>Heure début :</strong> <span id="reportTime"></span></p>

    <label>Heure de fin :</label>
    <input type="time" id="reportEndTime">

    <p><strong>Agent :</strong> <span id="reportAgent"></span></p>
    <p><strong>Type :</strong> <span id="reportType"></span></p>
</div>

<!-- Informations générales -->
<div class="section">
    <h2>Informations générales</h2>
    <textarea id="infoGenerales" placeholder="Décris la situation initiale..."></textarea>
</div>

<!-- Constat -->
<div class="section">
    <h2>Constat</h2>
    <textarea id="constat" placeholder="Décris ce que tu as constaté..."></textarea>
</div>

<!-- Actions -->
<div class="section">
    <h2>Actions réalisées</h2>
    <textarea id="actions" placeholder="Décris les actions effectuées..."></textarea>
</div>

<!-- Médias -->
<div class="section">
    <label>📸 Photos (multiples)</label>
    <input type="file" id="photos" accept="image/*" multiple>

    <label style="margin-top:10px;">🎥 Vidéos (multiples)</label>
    <input type="file" id="videos" accept="video/*" multiple>
</div>

<button class="btn" onclick="saveReport()">💾 Enregistrer le rapport</button>

</div> <!-- page-container -->

<script>
function goMenu() {
    window.location.href = "index.html";
}
</script>

<script src="js/security.js"></script>
<script src="global.js"></script>

</body>
</html>
