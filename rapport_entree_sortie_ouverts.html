<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rapports Entrée/Sortie ouverts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 🎨 Design global -->
<link rel="stylesheet" href="global.css">

<style>
/* 🎨 Styles spécifiques */

h1 { 
    color: var(--accent); 
    margin-bottom: 20px; 
    text-align: center;
}

/* Barre de recherche */
input {
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
}

/* Rapport */
.rapport {
    background: var(--card);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
}

/* Boutons */
button {
    margin-top: 10px;
    padding: 10px;
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: black;
    cursor: pointer;
    font-weight: 600;
}

button:hover {
    opacity: 0.9;
}

/* Bouton menu premium */
.menu-return {
    display: flex;
    justify-content: flex-start;
    margin-bottom: 20px;
}

.menu-return button {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 10px;
    color: var(--accent);
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 500;
    transition: 0.25s;
}

.menu-return button:hover {
    background: var(--accent);
    color: #000;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<script type="module">
import { requireLogin } from "./js/users.js";
requireLogin();
</script>

<h1>Rapports Entrée/Sortie en attente</h1>

<!-- Bouton menu -->
<div class="menu-return">
    <button onclick="goMenu()">⟵ Menu</button>
</div>

<!-- Compteurs -->
<div id="compteurs" class="rapport">
    <h3 style="color:var(--accent); margin-top:0;">Compteurs des rapports ouverts</h3>
    <p>Total : <span id="countTotal">0</span></p>
    <p>Personnel / Société : <span id="countPersonnel">0</span></p>
    <p>Livraison : <span id="countLivraison">0</span></p>
</div>

<!-- Barre de recherche -->
<input type="text" id="search" placeholder="Rechercher (société, agent, date)…">

<div id="liste"></div>

<script>
/* ============================
   BOUTON MENU
============================ */
function goMenu() {
    window.location.href = "index.html";
}

/* ============================
   CHARGER LES RAPPORTS OUVERTS
============================ */
function chargerRapports() {
    const rapports = JSON.parse(localStorage.getItem("rapports")) || [];

    const ouverts = rapports.filter(r =>
        r.cloture === false &&
        (r.type === "Entrée & Sortie du personnel / société" ||
         r.type === "Entrée & Sortie Livraison")
    );

    afficher(ouverts);
    updateCounters();
}

/* ============================
   AFFICHAGE DES RAPPORTS
============================ */
function afficher(listeRapports) {
    const liste = document.getElementById("liste");
    liste.innerHTML = "";

    if (listeRapports.length === 0) {
        liste.innerHTML = "<p>Aucun rapport en attente.</p>";
        return;
    }

    listeRapports.forEach(r => {
        const div = document.createElement("div");
        div.className = "rapport";

        div.innerHTML = `
            <p><strong>Type :</strong> ${r.type}</p>
            <p><strong>Date :</strong> ${r.date}</p>
            <p><strong>Société :</strong> ${r.societe || "—"}</p>
            <p><strong>Agent :</strong> ${r.agent}</p>
            <p><strong>Heure d'entrée :</strong> ${r.heureEntree}</p>

            <label>Heure de sortie :</label>
            <input type="time" id="sortie_${r.id}">
            <button onclick="cloturer(${r.id})">Clôturer</button>
        `;

        liste.appendChild(div);
    });
}

/* ============================
   COMPTEURS AUTOMATIQUES
============================ */
function updateCounters() {
    const rapports = JSON.parse(localStorage.getItem("rapports")) || [];

    const ouverts = rapports.filter(r =>
        r.cloture === false &&
        (r.type === "Entrée & Sortie du personnel / société" ||
         r.type === "Entrée & Sortie Livraison")
    );

    let personnel = 0;
    let livraison = 0;

    ouverts.forEach(r => {
        if (r.type === "Entrée & Sortie du personnel / société") personnel++;
        if (r.type === "Entrée & Sortie Livraison") livraison++;
    });

    document.getElementById("countTotal").textContent = ouverts.length;
    document.getElementById("countPersonnel").textContent = personnel;
    document.getElementById("countLivraison").textContent = livraison;
}

/* ============================
   CLÔTURER UN RAPPORT
============================ */
function cloturer(id) {
    const rapports = JSON.parse(localStorage.getItem("rapports")) || [];
    const rapport = rapports.find(r => r.id === id);

    const heure = document.getElementById("sortie_" + id).value;

    if (!heure) {
        alert("Veuillez entrer une heure de sortie.");
        return;
    }

    rapport.heureSortie = heure;
    rapport.cloture = true;

    localStorage.setItem("rapports", JSON.stringify(rapports));

    alert("Rapport clôturé !");
    chargerRapports();
}

/* ============================
   RECHERCHE RAPIDE
============================ */
document.getElementById("search").addEventListener("input", function () {
    const q = this.value.toLowerCase();
    const rapports = JSON.parse(localStorage.getItem("rapports")) || [];

    const ouverts = rapports.filter(r =>
        r.cloture === false &&
        (r.type === "Entrée & Sortie du personnel / société" ||
         r.type === "Entrée & Sortie Livraison") &&
        (
            (r.societe && r.societe.toLowerCase().includes(q)) ||
            (r.agent && r.agent.toLowerCase().includes(q)) ||
            (r.date && r.date.toLowerCase().includes(q))
        )
    );

    afficher(ouverts);
    updateCounters();
});

/* ============================
   LANCEMENT
============================ */
chargerRapports();
</script>

<!-- 🔐 Sécurité -->
<script src="js/security.js"></script>

<!-- 🎨 Thème global -->
<script src="global.js"></script>

</body>
</html>
